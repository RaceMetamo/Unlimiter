<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifold — geometry as a point generator</title>
<style>
  :root{
    --stage:#16181a; --panel:#1e2124; --panel-2:#24282b; --line:#2e3338;
    --text:#e8e6e1; --dim:#8d9490; --accent:#7fd1c0; --hot:#e0714f; --radius:3px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--stage);color:var(--text);font-family:var(--sans);font-size:13px;
    line-height:1.45;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{flex:1;min-width:0;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 50% 0%, #1c2023 0%, #131517 70%)}
  #stageBar{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line)}
  #stageBar h1{font-size:15px;font-weight:600;letter-spacing:.2px;margin:0}
  #stageBar h1 span{color:var(--dim);font-weight:400}
  #status{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-left:auto}
  #canvasWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:22px}
  #gl{max-width:100%;max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.55);background:#000;cursor:grab}
  #gl.dragging{cursor:grabbing}
  #panel{width:352px;flex:none;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column}
  #panelScroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
  #panelScroll::-webkit-scrollbar{width:9px}
  #panelScroll::-webkit-scrollbar-thumb{background:#33383c;border-radius:9px}
  .group{border-bottom:1px solid var(--line)}
  .group > summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;align-items:center;
    gap:8px;font-weight:600;font-size:12.5px;user-select:none}
  .group > summary::-webkit-details-marker{display:none}
  .group > summary:hover{background:var(--panel-2)}
  .group > summary .chev{width:8px;height:8px;border-right:1.5px solid var(--dim);
    border-bottom:1.5px solid var(--dim);transform:rotate(-45deg);transition:transform .15s ease;margin-left:auto}
  .group[open] > summary .chev{transform:rotate(45deg)}
  .group .body{padding:2px 16px 14px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0;min-height:28px}
  .row label{flex:none;width:104px;color:var(--dim);font-size:12px}
  .row .ctl{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
  .val{font-family:var(--mono);font-size:11px;color:var(--text);width:56px;text-align:right;flex:none}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:ew-resize}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--accent);margin-top:-4.5px;border:none}
  input[type=range]::-moz-range-track{height:2px;background:var(--line)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:none}
  select{width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:var(--radius);padding:5px 7px;font-size:12px;font-family:inherit}
  input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--panel-2);cursor:pointer;flex:none}
  input[type=checkbox]{appearance:none;width:15px;height:15px;border:1px solid #454b50;
    border-radius:var(--radius);background:var(--panel-2);cursor:pointer;flex:none;position:relative}
  input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  input[type=checkbox]:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border-right:2px solid #14181a;border-bottom:2px solid #14181a;transform:rotate(42deg)}
  button{background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:var(--radius);padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  button:hover{border-color:#4a5157;background:#2b3033}
  button.primary{background:var(--accent);border-color:var(--accent);color:#121718;font-weight:600}
  button.on{border-color:var(--accent);color:var(--accent)}
  .btnrow{display:flex;gap:6px;padding:6px 0}
  .btnrow button{flex:1}
  .note{color:var(--dim);font-size:11.5px;padding:2px 0 6px;line-height:1.5}
  .subhead{color:var(--text);font-size:11.5px;font-weight:600;padding:10px 0 2px;
    border-top:1px solid var(--line);margin-top:8px;display:flex;align-items:center;gap:8px}
  .subhead .tag{font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:400;margin-left:auto}
  #footer{border-top:1px solid var(--line);padding:12px 16px}
  .hidden{display:none !important}
  a{color:var(--accent)}
</style>
</head>
<body>

<div id="stage">
  <div id="stageBar">
    <h1>Manifold <span>— geometry as a point generator</span></h1>
    <div id="status">starting</div>
  </div>
  <div id="canvasWrap"><canvas id="gl"></canvas></div>
</div>

<div id="panel">
  <div id="panelScroll">
    <details class="group" open>
      <summary>Presets<span class="chev"></span></summary>
      <div class="body">
        <div class="row"><label>Preset</label><div class="ctl"><select id="presetSel"></select></div></div>
        <div class="btnrow"><button id="bReset">Reset view</button><button id="bSpin">Auto orbit</button></div>
      </div>
    </details>

    <details class="group" open>
      <summary>Form<span class="chev"></span></summary>
      <div class="body" id="g-form"></div>
    </details>

    <details class="group" open>
      <summary>Placement<span class="chev"></span></summary>
      <div class="body" id="g-place"></div>
    </details>

    <details class="group">
      <summary>Modifiers<span class="chev"></span></summary>
      <div class="body" id="g-mods"></div>
    </details>

    <details class="group">
      <summary>Morph<span class="chev"></span></summary>
      <div class="body" id="g-morph"></div>
    </details>

    <details class="group" open>
      <summary>Look<span class="chev"></span></summary>
      <div class="body" id="g-look"></div>
    </details>

    <details class="group">
      <summary>Camera<span class="chev"></span></summary>
      <div class="body" id="g-cam"></div>
    </details>

    <details class="group">
      <summary>Drive — audio, MIDI, modulation<span class="chev"></span></summary>
      <div class="body" id="g-drive"></div>
    </details>

    <details class="group">
      <summary>Hand off<span class="chev"></span></summary>
      <div class="body" id="g-out"></div>
    </details>
  </div>
  <div id="footer">
    <div class="btnrow"><button id="bSave">Save preset</button><button id="bLoad">Load</button></div>
    <input type="file" id="fileIn" accept="application/json" class="hidden">
  </div>
</div>

<script src="unlimiter-points.js"></script>
<script src="unlimiter-drive.js"></script>
<script>
"use strict";

const U = window.UnlimiterPoints;
const cv = document.getElementById("gl");
const statusEl = document.getElementById("status");

if(!U){
  statusEl.textContent = "unlimiter-points.js not found";
  document.getElementById("g-form").innerHTML =
    '<div class="note">unlimiter-points.js was not found next to this page. ' +
    'Manifold is only the instrument panel — the geometry itself lives in that module.</div>';
}

/* ============================ parameters ============================
   P is the user's; Q is P with modulation applied. Nothing writes to Q,
   nothing but the render path reads it — the standard suite contract.
   Keys are namespaced by role so a surface swap can keep the numbers
   it shares with the surface before it (radius stays radius).
   ==================================================================== */
const VIEW_DEFAULTS = {
  rows: 64, cols: 72, shells: 4,
  surface: "sphere", dist: "grid", presence: "field", colour: "spectrum",
  sizeMin: 3, sizeMax: 3, pointScale: 1, glow: 0.55,
  morphOn: false, morphTo: "torus", morphMix: 0.5, morphDrift: 0, morphPeriod: 16,
  camYaw: -24, camPitch: 14, camDist: 720, fov: 42, spin: 5,
  bg: "#07090c", persist: 0, fogNear: 0.2, fogFar: 2.4
};
let P = Object.assign({}, VIEW_DEFAULTS);
let Q = P;
let MODS = [{ type: "none" }, { type: "none" }, { type: "none" }];

const Drive = window.UnlimiterDrive
  ? UnlimiterDrive.create({ onChange: () => {}, getOutputCanvas: () => cv })
  : null;

/* Rebuilding the point set every frame is the whole job, so almost
   everything is fair game — but counts and identities are not: they
   reallocate buffers, and at 60fps that kills the tool. */
const NO_MOD = new Set(["rows","cols","shells","surface","dist","presence","colour",
                        "morphTo","morphOn","bg","persist"]);
let GRP = "";
function registerMod(k, l, mn, mx){
  if(!Drive || NO_MOD.has(k)) return;
  Drive.registerTarget(k, GRP ? GRP + " — " + l : l, mn, mx);
}

/* ============================ controls ============================ */
const bound = {}, rows = {};
function row(p, label, nodes, key){
  const r = document.createElement("div"); r.className = "row";
  const l = document.createElement("label"); l.textContent = label;
  const c = document.createElement("div"); c.className = "ctl";
  nodes.forEach(n => c.appendChild(n));
  r.appendChild(l); r.appendChild(c); p.appendChild(r);
  if(key) rows[key] = r;
  return r;
}
function note(p, t){ const d = document.createElement("div"); d.className = "note"; d.textContent = t; p.appendChild(d); }
function subhead(p, t, tag){
  const d = document.createElement("div"); d.className = "subhead"; d.textContent = t;
  if(tag){ const s = document.createElement("span"); s.className = "tag"; s.textContent = tag; d.appendChild(s); }
  p.appendChild(d); return d;
}
function fmt(v, s){
  if(s >= 1) return String(Math.round(v));
  return v.toFixed(Math.min(4, Math.max(0, Math.round(-Math.log10(s)))));
}
function slider(p, key, label, min, max, step, suffix){
  const i = document.createElement("input");
  i.type = "range"; i.min = min; i.max = max; i.step = step;
  if(P[key] == null) P[key] = min;
  i.value = P[key];
  const v = document.createElement("span"); v.className = "val";
  const show = () => v.textContent = fmt(Number(P[key]), step) + (suffix || "");
  show();
  i.addEventListener("input", () => { P[key] = Number(i.value); show(); onParam(key); });
  bound[key] = () => { i.value = P[key]; show(); };
  registerMod(key, label, min, max);
  return row(p, label, [i, v], key);
}
function select(p, key, label, opts, onChange){
  const s = document.createElement("select");
  opts.forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; s.appendChild(o); });
  s.value = P[key];
  s.addEventListener("change", () => { P[key] = s.value; if(onChange) onChange(); onParam(key); });
  bound[key] = () => { s.value = P[key]; };
  return row(p, label, [s], key);
}
function check(p, key, label, onChange){
  const c = document.createElement("input"); c.type = "checkbox"; c.checked = !!P[key];
  c.addEventListener("change", () => { P[key] = c.checked; if(onChange) onChange(); onParam(key); });
  bound[key] = () => { c.checked = !!P[key]; };
  return row(p, label, [c], key);
}
function colorPick(p, key, label){
  const c = document.createElement("input"); c.type = "color"; c.value = P[key];
  c.addEventListener("input", () => { P[key] = c.value; });
  bound[key] = () => { c.value = P[key]; };
  return row(p, label, [c], key);
}
function onParam(k){ if(k === "rows" || k === "cols" || k === "shells" || k === "dist") rebuildState(); }

/* Build a group of sliders straight from the module's own parameter
   metadata. One list describes a surface; it becomes the sliders, the
   defaults and the modulation targets, so there is no parameter list
   kept anywhere in this file. */
function paramGroup(parent, prefix, list, group){
  const prev = GRP; GRP = group;
  (list || []).forEach(pr => {
    const key = prefix + pr.key;
    if(P[key] == null) P[key] = pr.def;
    slider(parent, key, pr.label, pr.min, pr.max, pr.step);
  });
  GRP = prev;
}
function pick(src, prefix){
  const o = {};
  for(const k in src) if(k.indexOf(prefix) === 0) o[k.slice(prefix.length)] = src[k];
  return o;
}

/* ---- Form: the surface, and whatever numbers that surface has ---- */
const gForm = document.getElementById("g-form");
let surfParamBox = null;
function buildSurface(){
  if(surfParamBox) surfParamBox.remove();
  surfParamBox = document.createElement("div");
  gForm.appendChild(surfParamBox);
  const S = U && U.SURFACES[P.surface];
  paramGroup(surfParamBox, "s_", S && S.params, S ? S.label : "Surface");
}
if(U){
  GRP = "Form";
  select(gForm, "surface", "Surface",
    Object.keys(U.SURFACES).map(k => [k, U.SURFACES[k].label]),
    () => { buildSurface(); refreshAll(); });
  slider(gForm, "shells", "Nested shells", 1, 12, 1, "");
  slider(gForm, "rows", "Rows", 4, 200, 1, "");
  slider(gForm, "cols", "Columns", 4, 200, 1, "");
  GRP = "";
  buildSurface();
  note(gForm, "Rows × columns is the point count and the cost in one. Shells repeat the whole form inward, which is where the layered reading comes from rather than from any one surface.");
}

/* ---- Placement: how points land on that surface ---- */
const gPlace = document.getElementById("g-place");
let distParamBox = null;
function buildDist(){
  if(distParamBox) distParamBox.remove();
  distParamBox = document.createElement("div");
  gPlace.appendChild(distParamBox);
  const D = U && U.DISTRIBUTIONS[P.dist];
  paramGroup(distParamBox, "d_", D && D.params, D ? D.label : "Placement");
}
if(U){
  GRP = "Placement";
  select(gPlace, "dist", "Placement",
    Object.keys(U.DISTRIBUTIONS).map(k => [k, U.DISTRIBUTIONS[k].label]),
    () => { buildDist(); rebuildState(); refreshAll(); });
  GRP = "";
  buildDist();
  note(gPlace, "Placement is independent of form: a flock walks a Möbius band exactly as it walks a sphere, because the agents live in flat wrap-around coordinates and only become 3D at the last step.");
}

/* ---- Modifiers: an ordered, non-destructive stack ---- */
const gMods = document.getElementById("g-mods");
function buildMods(){
  gMods.innerHTML = "";
  MODS.forEach((m, i) => {
    subhead(gMods, "Slot " + (i + 1), m.type === "none" ? "empty" : "");
    const s = document.createElement("select");
    const opts = [["none", "— none —"]].concat(Object.keys(U.MODIFIERS).map(k => [k, U.MODIFIERS[k].label]));
    opts.forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; s.appendChild(o); });
    s.value = m.type;
    s.addEventListener("change", () => { MODS[i].type = s.value; buildMods(); });
    row(gMods, "Effect", [s]);
    if(m.type !== "none"){
      const box = document.createElement("div"); gMods.appendChild(box);
      paramGroup(box, "m" + i + "_", U.MODIFIERS[m.type].params, U.MODIFIERS[m.type].label);
    }
  });
  note(gMods, "Each slot is a pass over the points the form produced — the form itself is never edited, so emptying a slot returns it exactly.");
}
if(U) buildMods();

/* ---- Morph: the same points, travelling to a second form ---- */
const gMorph = document.getElementById("g-morph");
let morphParamBox = null;
function buildMorphTarget(){
  if(morphParamBox) morphParamBox.remove();
  morphParamBox = document.createElement("div");
  gMorph.appendChild(morphParamBox);
  if(!P.morphOn) return;
  const S = U && U.SURFACES[P.morphTo];
  paramGroup(morphParamBox, "b_", S && S.params, S ? S.label + " (target)" : "Target");
}
if(U){
  GRP = "Morph";
  check(gMorph, "morphOn", "Morph on", () => { buildMorphTarget(); refreshAll(); });
  select(gMorph, "morphTo", "Target form",
    Object.keys(U.SURFACES).map(k => [k, U.SURFACES[k].label]),
    () => { buildMorphTarget(); refreshAll(); });
  slider(gMorph, "morphMix", "Mix", 0, 1, 0.005, "");
  slider(gMorph, "morphDrift", "Auto drift", 0, 1, 0.01, "");
  slider(gMorph, "morphPeriod", "Drift period", 2, 60, 1, "s");
  GRP = "";
  buildMorphTarget();
  note(gMorph, "Both forms are sampled at the same address and blended point by point, so the geometry travels rather than cross-fading. Mix is a modulation target like any other — a kick drum can push a sphere partway into a torus.");
}

/* ---- Look: presence, colour, size ---- */
const gLook = document.getElementById("g-look");
let presBox = null, colBox = null;
function buildPresence(){
  if(presBox) presBox.remove();
  presBox = document.createElement("div");
  gLook.insertBefore(presBox, colAnchor);
  const R = U && U.PRESENCE[P.presence];
  paramGroup(presBox, "pr_", R && R.params, R ? R.label : "Presence");
}
function buildColour(){
  if(colBox) colBox.remove();
  colBox = document.createElement("div");
  gLook.appendChild(colBox);
  const C = U && U.COLOURS[P.colour];
  paramGroup(colBox, "c_", C && C.params, C ? C.label : "Colour");
}
let colAnchor = null;
if(U){
  GRP = "Look";
  select(gLook, "presence", "Which points",
    Object.keys(U.PRESENCE).map(k => [k, U.PRESENCE[k].label]),
    () => { buildPresence(); refreshAll(); });
  colAnchor = document.createElement("div"); gLook.appendChild(colAnchor);
  select(gLook, "colour", "Colour from",
    Object.keys(U.COLOURS).map(k => [k, U.COLOURS[k].label]),
    () => { buildColour(); refreshAll(); });
  slider(gLook, "sizeMin", "Size start", 0.5, 20, 0.1, "");
  slider(gLook, "sizeMax", "Size end", 0.5, 20, 0.1, "");
  slider(gLook, "pointScale", "Point scale", 0.2, 4, 0.01, "×");
  slider(gLook, "glow", "Glow", 0, 1, 0.01, "");
  slider(gLook, "persist", "Trails", 0, 0.97, 0.01, "");
  colorPick(gLook, "bg", "Background");
  GRP = "";
  buildPresence(); buildColour();
  note(gLook, "Noise carve is the same field the flock can steer by — set both and the agents fly through the gaps the carve leaves open.");
}

/* ---- Camera ---- */
const gCam = document.getElementById("g-cam");
GRP = "Camera";
slider(gCam, "camYaw", "Yaw", -180, 180, 0.5, "°");
slider(gCam, "camPitch", "Pitch", -89, 89, 0.5, "°");
slider(gCam, "camDist", "Distance", 150, 2500, 5, "");
slider(gCam, "fov", "Field of view", 12, 100, 0.5, "°");
slider(gCam, "spin", "Auto orbit", -90, 90, 0.5, "°/s");
slider(gCam, "fogNear", "Fade starts", 0, 2, 0.01, "");
slider(gCam, "fogFar", "Fade ends", 0.1, 4, 0.01, "");
GRP = "";
note(gCam, "Drag on the canvas to orbit, wheel to dolly.");

/* ---- Hand off ---- */
const gOut = document.getElementById("g-out");
const outRow = document.createElement("div"); outRow.className = "btnrow";
const bPly = document.createElement("button"); bPly.textContent = "Export .ply";
const bPng = document.createElement("button"); bPng.textContent = "Capture frame";
outRow.appendChild(bPly); outRow.appendChild(bPng); gOut.appendChild(outRow);
note(gOut, "Export .ply writes this frame's live points as a binary point cloud — volume-renderer.html loads it directly, so a form built here becomes a volumetric source without passing through a picture of itself.");
const outStat = document.createElement("div"); outStat.className = "note"; gOut.appendChild(outStat);

/* ============================ presets ============================ */
const VIEW_FOR_PRESET = {
  "Shell rings":       { camDist: 700, spin: 5, glow: 0.55, persist: 0 },
  "Orbit flower":      { camDist: 640, spin: 3, glow: 0.7, persist: 0.35 },
  "Supershape bloom":  { camDist: 760, spin: 8, glow: 0.45, persist: 0 },
  "Carved torus":      { camDist: 720, spin: 6, glow: 0.6, persist: 0.2 },
  "Flock on a sphere": { camDist: 760, spin: 4, glow: 0.8, persist: 0.6 },
  "Möbius scatter":    { camDist: 700, spin: 7, glow: 0.5, persist: 0 }
};
function applyPreset(name){
  const spec = U && U.PRESETS[name];
  if(!spec) return;
  P = Object.assign({}, VIEW_DEFAULTS, VIEW_FOR_PRESET[name] || {});
  P.surface = spec.surface; P.dist = spec.distribution;
  P.presence = spec.presence || "all"; P.colour = spec.colour || "spectrum";
  P.rows = spec.rows; P.cols = spec.cols; P.shells = spec.shells || 1;
  P.sizeMin = spec.sizeMin; P.sizeMax = spec.sizeMax;
  const load = (prefix, kind, id, given) => {
    const merged = U.withDefaults(kind, id, given);
    for(const k in merged) P[prefix + k] = merged[k];
  };
  load("s_", "surface", spec.surface, spec.surfaceParams);
  load("d_", "distribution", spec.distribution, spec.distParams);
  load("pr_", "presence", P.presence, spec.presenceParams);
  load("c_", "colour", P.colour, spec.colourParams);
  MODS = [0, 1, 2].map(i => {
    const m = (spec.modifiers || [])[i];
    if(!m) return { type: "none" };
    const merged = U.withDefaults("modifier", m.type, m.params);
    for(const k in merged) P["m" + i + "_" + k] = merged[k];
    return { type: m.type };
  });
  rebuildPanels();
  rebuildState();
}
const presetSel = document.getElementById("presetSel");
if(U){
  Object.keys(U.PRESETS).forEach(n => {
    const o = document.createElement("option"); o.value = n; o.textContent = n; presetSel.appendChild(o);
  });
  presetSel.addEventListener("change", () => applyPreset(presetSel.value));
}

function rebuildPanels(){
  buildSurface(); buildDist(); buildMods(); buildMorphTarget(); buildPresence(); buildColour();
  refreshAll();
}
function refreshAll(){ for(const k in bound) bound[k](); }

/* ============================ state ============================ */
let frame = null, scratchA = null, scratchB = null, flock = null;
function rebuildState(){
  const n = Math.max(1, Math.round(P.rows) * Math.round(P.cols));
  flock = (U && P.dist === "flock") ? U.createFlock(n, Math.max(1, Math.round(P.shells))) : null;
  frame = null; scratchA = null; scratchB = null;
}

function specFrom(q, surfaceId, prefix){
  return {
    surface: surfaceId,
    surfaceParams: pick(q, prefix),
    shells: Math.max(1, Math.round(q.shells)),
    distribution: q.dist,
    distParams: pick(q, "d_"),
    rows: Math.max(1, Math.round(q.rows)),
    cols: Math.max(1, Math.round(q.cols)),
    modifiers: MODS.map((m, i) => m.type === "none" ? null : { type: m.type, params: pick(q, "m" + i + "_") }).filter(Boolean),
    presence: q.presence,
    presenceParams: pick(q, "pr_"),
    colour: q.colour,
    colourParams: pick(q, "c_"),
    sizeMin: q.sizeMin, sizeMax: q.sizeMax
  };
}

/* ============================ WebGL ============================ */
const gl = cv.getContext("webgl2", { antialias: true, preserveDrawingBuffer: false, alpha: false });
let prog = null, progQuad = null, vao = null;
let bufPos = null, bufCol = null, bufSize = null, bufPre = null, capacity = 0;

const VS = `#version 300 es
in vec3 aPos; in vec3 aCol; in float aSize; in float aPre;
uniform mat4 uProj, uView;
uniform float uPixelScale, uScale, uFogNear, uFogFar;
out vec3 vCol; out float vPre;
void main(){
  if(aPre < 0.02){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; vPre = 0.0; vCol = vec3(0.0); return; }
  vec4 eye = uView * vec4(aPos, 1.0);
  gl_Position = uProj * eye;
  float dist = max(0.001, -eye.z);
  gl_PointSize = clamp(aSize * uScale * uPixelScale / dist, 1.0, 96.0);
  float fog = 1.0 - smoothstep(uFogNear, uFogFar, dist / 400.0);
  vCol = aCol; vPre = aPre * clamp(fog, 0.0, 1.0);
}`;
const FS = `#version 300 es
precision highp float;
in vec3 vCol; in float vPre;
uniform float uGlow;
out vec4 frag;
void main(){
  vec2 d = gl_PointCoord - vec2(0.5);
  float r = length(d) * 2.0;
  if(r > 1.0) discard;
  float core = 1.0 - smoothstep(0.0, 0.55, r);
  float halo = (1.0 - smoothstep(0.0, 1.0, r)) * uGlow;
  float a = clamp(core + halo, 0.0, 1.0) * vPre;
  frag = vec4(vCol * (core + halo * 0.7), a);
}`;
const QVS = `#version 300 es
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const QFS = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 frag;
void main(){ frag = uColor; }`;

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function allocBuffers(n){
  if(n <= capacity && vao) return;
  capacity = Math.max(n, 1024);
  if(vao) gl.deleteVertexArray(vao);
  [bufPos, bufCol, bufSize, bufPre].forEach(b => { if(b) gl.deleteBuffer(b); });
  vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const mk = (loc, comps, bytes) => {
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, bytes, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, comps, gl.FLOAT, false, 0, 0);
    return b;
  };
  bufPos  = mk(gl.getAttribLocation(prog, "aPos"),  3, capacity * 12);
  bufCol  = mk(gl.getAttribLocation(prog, "aCol"),  3, capacity * 12);
  bufSize = mk(gl.getAttribLocation(prog, "aSize"), 1, capacity * 4);
  bufPre  = mk(gl.getAttribLocation(prog, "aPre"),  1, capacity * 4);
  gl.bindVertexArray(null);
}

/* ---- tiny mat4 ---- */
function perspective(fovDeg, aspect, near, far){
  const f = 1 / Math.tan(fovDeg * Math.PI / 360);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) / (near - far), -1,
    0, 0, (2 * far * near) / (near - far), 0
  ]);
}
/* look-at from an orbit position, target at the origin, world up +Y.
   Column-major, the layout glUniformMatrix4fv wants. */
function orbitView(yawDeg, pitchDeg, dist){
  const y = yawDeg * Math.PI / 180, p = pitchDeg * Math.PI / 180;
  const cp = Math.cos(p), sp = Math.sin(p), cy = Math.cos(y), sy = Math.sin(y);
  const ex = dist * cp * sy, ey = dist * sp, ez = dist * cp * cy;

  // forward = normalize(target - eye)
  let fx = -ex, fy = -ey, fz = -ez;
  const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;

  // right = normalize(cross(forward, up)); up is +Y, so cross = (-fz, 0, fx)
  let rx = -fz, ry = 0, rz = fx;
  let rl = Math.hypot(rx, ry, rz);
  if(rl < 1e-6){ rx = 1; ry = 0; rz = 0; rl = 1; }   // looking straight up or down
  rx /= rl; ry /= rl; rz /= rl;

  // trueUp = cross(right, forward)
  const ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;

  return new Float32Array([
    rx,  ux, -fx, 0,
    ry,  uy, -fy, 0,
    rz,  uz, -fz, 0,
    -(rx * ex + ry * ey + rz * ez),
    -(ux * ex + uy * ey + uz * ez),
      fx * ex + fy * ey + fz * ez, 1
  ]);
}

const hex = h => { const n = parseInt(String(h).slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

function resize(){
  const wrap = document.getElementById("canvasWrap");
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  const w = Math.max(320, Math.floor((wrap.clientWidth - 44) * dpr));
  const h = Math.max(240, Math.floor((wrap.clientHeight - 44) * dpr));
  const cap = 1920, k = Math.max(w, h) > cap ? cap / Math.max(w, h) : 1;
  cv.width = Math.floor(w * k); cv.height = Math.floor(h * k);
  cv.style.width = Math.floor(cv.width / dpr) + "px";
  cv.style.height = Math.floor(cv.height / dpr) + "px";
}

/* ---- camera drag ---- */
let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; cv.classList.add("dragging"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointerup", e => { dragging = false; cv.classList.remove("dragging"); });
cv.addEventListener("pointermove", e => {
  if(!dragging) return;
  P.camYaw = ((P.camYaw - (e.clientX - lastX) * 0.4 + 180) % 360 + 360) % 360 - 180;
  P.camPitch = Math.max(-89, Math.min(89, P.camPitch + (e.clientY - lastY) * 0.3));
  lastX = e.clientX; lastY = e.clientY;
  if(bound.camYaw) bound.camYaw(); if(bound.camPitch) bound.camPitch();
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  P.camDist = Math.max(150, Math.min(2500, P.camDist * (1 + Math.sign(e.deltaY) * 0.08)));
  if(bound.camDist) bound.camDist();
}, { passive: false });

/* ============================ frame ============================ */
let t0 = performance.now(), lastT = t0, fpsT = t0, frames = 0, fps = 0, morphPhase = 0;

function render(now){
  requestAnimationFrame(render);
  if(!gl || !prog || !U) return;
  Q = Drive ? Drive.resolve(P) : P;
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const t = (now - t0) / 1000;

  // geometry
  const specA = specFrom(Q, Q.surface, "s_");
  if(P.dist === "flock" && flock){
    const F = pick(Q, "d_");
    let field = null, band = null;
    if(Q.presence === "field"){
      const SP = U.withDefaults("surface", Q.surface, pick(Q, "s_"));
      const CP = U.withDefaults("presence", "field", pick(Q, "pr_"));
      const tmp = [0, 0, 0];
      field = (u, v, shf) => { U.SURFACES[Q.surface].map(u, v, shf, SP, tmp); return U.carveField(tmp, shf, CP, t); };
      band = [CP.low, CP.high, CP.scale];
    }
    U.stepFlock(flock, dt, t, F, field, band);
  }

  if(Q.morphOn){
    let mix = Q.morphMix;
    if(Q.morphDrift > 0){
      morphPhase += dt / Math.max(0.5, Q.morphPeriod);
      const osc = 0.5 + 0.5 * Math.sin(morphPhase * Math.PI * 2);
      mix = (1 - Q.morphDrift) * Q.morphMix + Q.morphDrift * osc;
    }
    const specB = specFrom(Q, Q.morphTo, "b_");
    const r = U.morph(specA, specB, mix, t, frame, flock, flock, scratchA, scratchB);
    frame = r.frame; scratchA = r.a; scratchB = r.b;
  } else {
    frame = U.generate(specA, t, frame, flock);
  }

  // upload
  const n = frame.count;
  allocBuffers(n);
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufPos);  gl.bufferSubData(gl.ARRAY_BUFFER, 0, frame.positions, 0, n * 3);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufCol);  gl.bufferSubData(gl.ARRAY_BUFFER, 0, frame.colors, 0, n * 3);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufSize); gl.bufferSubData(gl.ARRAY_BUFFER, 0, frame.sizes, 0, n);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufPre);  gl.bufferSubData(gl.ARRAY_BUFFER, 0, frame.presence, 0, n);

  // draw
  gl.viewport(0, 0, cv.width, cv.height);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  const bg = hex(Q.bg);
  if(Q.persist > 0.005){
    gl.useProgram(progQuad);
    gl.uniform4f(gl.getUniformLocation(progQuad, "uColor"), bg[0], bg[1], bg[2], 1 - Q.persist);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(null);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(vao);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  } else {
    gl.clearColor(bg[0], bg[1], bg[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }

  if(P.spin !== 0) P.camYaw = ((P.camYaw + Q.spin * dt + 180) % 360 + 360) % 360 - 180;
  const proj = perspective(Q.fov, cv.width / cv.height, 1, 8000);
  const view = orbitView(Q.camYaw, Q.camPitch, Q.camDist);
  const pixelScale = (cv.height * 0.5) / Math.tan(Q.fov * Math.PI / 360);

  gl.useProgram(prog);
  gl.uniformMatrix4fv(gl.getUniformLocation(prog, "uProj"), false, proj);
  gl.uniformMatrix4fv(gl.getUniformLocation(prog, "uView"), false, view);
  gl.uniform1f(gl.getUniformLocation(prog, "uPixelScale"), pixelScale);
  gl.uniform1f(gl.getUniformLocation(prog, "uScale"), Q.pointScale);
  gl.uniform1f(gl.getUniformLocation(prog, "uGlow"), Q.glow);
  gl.uniform1f(gl.getUniformLocation(prog, "uFogNear"), Q.fogNear);
  gl.uniform1f(gl.getUniformLocation(prog, "uFogFar"), Q.fogFar);
  gl.drawArrays(gl.POINTS, 0, n);
  gl.bindVertexArray(null);

  if(Drive) Drive.pushFrame(cv);

  frames++;
  if(now - fpsT > 500){ fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
  let live = 0;
  for(let i = 0; i < n; i += 7) if(frame.presence[i] > 0.02) live++;
  statusEl.textContent = n.toLocaleString() + " points · ~" + Math.round(live / Math.max(1, Math.ceil(n / 7)) * 100) +
    "% visible · " + fps.toFixed(0) + " fps";
}

/* ============================ export ============================ */
function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
bPly.addEventListener("click", () => {
  if(!frame) return;
  // binary little-endian, xyz float + rgb uchar — the layout
  // volume-renderer.html's non-gaussian PLY path reads.
  // The header stays strictly ASCII on purpose: that loader finds the
  // data offset with a *string* index into the decoded header, so a
  // single multi-byte character here would shift every float it reads.
  let n = 0;
  for(let i = 0; i < frame.count; i++) if(frame.presence[i] >= 0.02) n++;
  const header =
    "ply\nformat binary_little_endian 1.0\n" +
    "comment generated by manifold.html - The Unlimiter\n" +
    "element vertex " + n + "\n" +
    "property float x\nproperty float y\nproperty float z\n" +
    "property uchar red\nproperty uchar green\nproperty uchar blue\n" +
    "end_header\n";
  const head = new TextEncoder().encode(header);
  const stride = 15;
  const buf = new ArrayBuffer(head.length + n * stride);
  const u8 = new Uint8Array(buf);
  u8.set(head, 0);
  const dv = new DataView(buf, head.length);
  let w = 0;
  for(let i = 0; i < frame.count; i++){
    const a = frame.presence[i];
    if(a < 0.02) continue;
    const o = w * stride, i3 = i * 3;
    dv.setFloat32(o, frame.positions[i3], true);
    dv.setFloat32(o + 4, frame.positions[i3 + 1], true);
    dv.setFloat32(o + 8, frame.positions[i3 + 2], true);
    dv.setUint8(o + 12, Math.round(Math.min(1, frame.colors[i3] * a) * 255));
    dv.setUint8(o + 13, Math.round(Math.min(1, frame.colors[i3 + 1] * a) * 255));
    dv.setUint8(o + 14, Math.round(Math.min(1, frame.colors[i3 + 2] * a) * 255));
    w++;
  }
  download(new Blob([buf], { type: "application/octet-stream" }), "manifold_" + Date.now() + ".ply");
  outStat.textContent = n.toLocaleString() + " points written — load it in volume-renderer.html.";
});
bPng.addEventListener("click", () => {
  cv.toBlob(b => { if(b) download(b, "manifold_" + Date.now() + ".png"); });
});

document.getElementById("bSave").addEventListener("click", () => {
  const out = Object.assign({}, P, { _mods: MODS });
  if(Drive) out._drive = Drive.serialize();
  download(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }), "manifold_preset.json");
});
document.getElementById("bLoad").addEventListener("click", () => document.getElementById("fileIn").click());
document.getElementById("fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  f.text().then(txt => {
    const j = JSON.parse(txt);
    if(Drive && j._drive) Drive.load(j._drive);
    delete j._drive;
    if(j._mods) MODS = j._mods;
    delete j._mods;
    P = Object.assign({}, VIEW_DEFAULTS, j);
    rebuildPanels(); rebuildState();
  }).catch(() => { outStat.textContent = "could not read that preset"; });
  e.target.value = "";
});

document.getElementById("bReset").addEventListener("click", () => {
  P.camYaw = VIEW_DEFAULTS.camYaw; P.camPitch = VIEW_DEFAULTS.camPitch;
  P.camDist = VIEW_DEFAULTS.camDist; refreshAll();
});
const bSpin = document.getElementById("bSpin");
bSpin.addEventListener("click", () => {
  P.spin = P.spin === 0 ? 5 : 0;
  bSpin.classList.toggle("on", P.spin !== 0);
  refreshAll();
});

/* ============================ boot ============================ */
const drivePanel = document.getElementById("g-drive");
if(Drive){ Drive.mountPanel(drivePanel); }
else {
  drivePanel.innerHTML = '<div class="note">unlimiter-drive.js was not found next to this page. ' +
    'Manifold still runs as a standalone generator — audio, MIDI and the modulation matrix are what is missing.</div>';
}

if(gl && U){
  try{
    prog = program(VS, FS);
    progQuad = program(QVS, QFS);
    resize();
    window.addEventListener("resize", resize);
    applyPreset("Shell rings");
    presetSel.value = "Shell rings";
    bSpin.classList.add("on");
    requestAnimationFrame(render);
  }catch(err){
    statusEl.textContent = "shader error";
    console.error(err);
  }
} else if(!gl){
  statusEl.textContent = "WebGL2 unavailable";
}
</script>
</body>
