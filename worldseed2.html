    // comets are dirty snowballs: water, CO2 and the raw organics life starts from
    e.W+=rad*rad*(0.9+sys.comets)*Math.min(1.5,1+e.m)*1.6;
    e.Catm+=rad*rad*1.5; e.life.chem+=rad*0.8; e.N2+=rad*rad*0.3;
  } else e.Catm+=rad*rad*0.4;
  if(rad>0.2||why){
    e.bigImp++;
    e.H=Math.min(1,e.H+rad*rad*2/(1+e.m));
    e.T+=rad*90;      // a pulse of heat — enough to crack a snowball for a while
    if(e.flashes.length<4) e.flashes.push({d:dir,r:rad*1.6,a:1});
    const lossA=Math.min(0.2,rad*rad*1.5/Math.max(e.g*e.g,0.04));
    e.Catm*=1-lossA; e.N2*=1-lossA*0.7; e.H2O*=1-lossA;
    e.W+=sys.comets*rad*rad*0.8*Math.min(1.5,1+e.m);
    if(e.life.stage>0){
      const kill=Math.min(0.97,rad*1.8)*(1-0.5*(sys.ten||0));
      e.life.ext=Math.max(e.life.ext,kill);
      e.life.killDir=dir; e.life.killR=rad*2.6;
      log(e,`${why||'A '+Math.round(rad*2*6371*e.R/10)*10+' km impact'} — ${Math.round(kill*100)}% of life lost`,'extinct');
      if(kill>0.85&&e.life.stage>=3) e.life.prog*=0.4;
    } else if(why) log(e,why+(comet?' — water and organics delivered':''),'impact');
    else if(rad>0.36&&t>150) log(e,'A huge impact has reset part of the surface','impact');
  }
}

function evoStep(e,dt,t,sys,r,log){
  if(e.dead) return;
  const st=sys.starNow;
  const S=st.L/(e.aAU*e.aAU);                     // flux, Earth = 1
  e.S=S;
  if(e.kind==='gas'||e.kind==='ice'){ evoGiant(e,dt,t,sys,S); return; }
  // ── heat ──
  e.H*=Math.exp(-dt/e.tauH);
  e.Hm=Math.min(1.4,0.95*Math.pow(e.m,0.32)*Math.exp(-t/(2400*Math.pow(e.m,0.3)))+0.08*Math.exp(-t/5000)+e.tidal);
  const Teq0=278*Math.pow(S,0.25);
  const lavaWorld=Teq0*Math.pow(1-e.A,0.25)/Math.pow(0.7,0.25)>1100;
  const wasMagma=e.regime==='magma';
  if(e.H>0.55||lavaWorld) e.regime='magma';
  else if(e.Hm>0.2&&e.m>0.22&&(e.W>0.03||e.H2O>1)) e.regime='plates';
  else e.regime='lid';
  if(wasMagma&&e.regime!=='magma') log(e,'A crust has frozen over the magma ocean','geo');
  if(!wasMagma&&e.regime==='magma'&&lavaWorld&&!e._lavaLogged){ e._lavaLogged=1; log(e,'The surface has melted back into a lava sea','geo'); }
  e.V=e.regime==='magma'?1:e.regime==='plates'?0.2+0.55*Math.min(1,e.Hm):0.05+0.5*Math.min(1,e.Hm);

  // ── volatiles out of the interior ──
  const og=dt*e.V*(e.regime==='magma'?0.012:0.0016);
  const outW=Math.min(e.Wmax,e.Wmax*og*1.4);
  e.Wmax-=outW; e.W+=outW;
  // most carbon stays locked in the mantle; volcanoes leak it out slowly
  const outC=Math.min(e.C,e.C*dt*(e.V*(e.regime==='magma'?0.005:0.00008)+(!e.liquid&&e.T>450?0.0015:0))); e.C-=outC; e.Catm+=outC;
  if(e.wat>0.1&&e.vol>0.03) e.N2+=og*e.vol*2;
  // icy, volatile-rich worlds breathe out methane from clathrates — no life needed
  if(e.wat>0.1&&e.vol>0.03) e.CH4+=og*e.vol*0.35;
  // hydrogen envelopes boil away under strong light
  if(e.Hen>0){
    const loss=e.Hen*dt*Math.min(0.02,0.0008*S/Math.max(e.g,0.2));
    e.Hen-=loss;
    if(e.Hen<0.0005*e.m&&!e._henLogged){ e._henLogged=1; e.Hen=0; log(e,'Starlight has stripped away its hydrogen envelope','air'); }
  }

  // ── bombardment ──
  const rate=sys.debris*(55*Math.exp(-t/95)+11*Math.exp(-Math.pow((t-650)/150,2))+0.25)*Math.max(e.R,0.2)**2*(1+0.25*Math.sqrt(e.m));
  const k=poissonR(r,rate*dt*0.018);
  e.flashes=e.flashes.filter(f=>(f.a-=dt*0.02)>0);
  for(let i=0;i<k;i++){
    const u=Math.max(r(),1e-4);
    const rad=Math.min(0.42,0.035*Math.pow(u,-0.55));
    evoImpact(e,r,rad,randDir(r),'rock',sys,log,t);
  }
  // craters soften under wind, water, ice and moving plates
  const er=0.00035+(e.liquid?0.009*Math.min(1,Math.sqrt(e.P)):0)+(e.P>0.05?0.0015*Math.min(1,e.P):0)
          +(e.regime==='plates'?0.006:0)+(e.regime==='magma'?0.05:0)+e.V*0.002;
  e.craters=e.craters.filter(c=>(c.depth*=Math.exp(-er*dt))>0.06);

  // ── plates ──
  if(e.regime==='plates'){
    const sp=0.0011*Math.min(1.3,e.Hm+0.2);
    for(const p of e.plates) p.c=rotAxis(p.c,p.ax,p.rate*sp*dt);
    // continents slowly grow as the plates recycle crust
    if(r()<dt*0.004*Math.min(1,e.Hm*2)){
      const oc=e.plates.filter(p=>p.w<0);
      if(oc.length>e.plates.length*0.55){ const p=oc[Math.floor(r()*oc.length)]; p.w=0.35+r()*0.55; }
    }
    e.relief=Math.min(1,e.relief+dt*0.0012);
  } else if(e.regime==='lid'){
    e.relief=Math.min(0.75,e.relief+dt*0.0006);
  } else e.relief=Math.max(0.05,e.relief-dt*0.01);
  e.cont=e.plates.filter(p=>p.w>0).length/e.plates.length;
  e.erosion=Math.min(1,e.erosion+dt*(e.liquid?0.0007:e.P>0.1?0.0002:0));

  // ── air: escape and the carbon thermostat ──
  // a molten core makes a magnetic shield; without one the stellar wind sputters the air away
  e.mag=e.Hm>0.15&&e.m>0.3;
  const tauEsc=420*Math.pow(Math.max(e.m,0.004)/0.107,e.m>0.107?2:1.5)/Math.pow(Math.max(S,0.02),0.7)
              *Math.pow(300/Math.max(e.T,40),1.5)/(e.mag?1:3);
  const esc=Math.exp(-dt/Math.max(tauEsc,1));
  // heavy molecules hang on longer than light ones
  e.Catm*=Math.pow(esc,0.25); e.N2*=Math.pow(esc,0.6); e.CH4*=Math.pow(esc,1.2); e.O2*=Math.pow(esc,0.5);
  if(e.liquid){
    const land=(e.regime==='plates'?1:0.3)*(e.life.stage>=3?1.8:1);   // roots crack rock
    const wth=0.05*Math.exp((Math.min(e.T,360)-288)/9)*land*(0.4+0.6*Math.min(1,1.2-e.ocean));
    const taken=Math.min(e.Catm*0.98,e.Catm*wth*dt);
    e.Catm-=taken;
    // subduction carries buried carbon back down, where volcanoes can return it later
    if(e.regime==='plates') e.C+=taken*0.92;
  }
  // life rewrites the air
  const L=e.life;
  if(L.stage>=1&&e.liquid&&!L.sub){ e.CH4=Math.min(0.002,e.CH4+dt*0.000004*(L.stage<3?1:0.2)); }
  if(L.stage>=2&&!L.sub){
    const tgt=(L.stage>=3?0.24:0.06)*Math.max(0.65,Math.min(1.2,e.N2/0.8+0.4));
    e.O2+=(tgt-e.O2)*Math.min(1,dt/(L.stage>=3?900:1600)*(1+2*(sys.ten||0)));
    if(e.O2>0.02&&!e._goeLogged){ e._goeLogged=1; log(e,'Oxygen is building up in the air — the oceans are rusting','life'); }
    e.CH4*=Math.exp(-dt/300);
  }
  const Pco2=e.Catm;
  e.Pco2=Pco2;
  const Pn2=Math.min(e.N2,60)*0.95;

  // ── water: liquid, ice or steam ──
  const Pdry=Pco2+Pn2+e.O2+e.CH4*0.5+e.Hen*120;
  // boiling point from Clausius–Clapeyron, capped at water's critical point
  const tb=Math.min(647,1/(1/373-Math.log(Math.max(Pdry+e.H2O,0.001))/4895));
  // runaway is judged on starlight and the dry greenhouse, with hysteresis, so it can't flicker
  // above water's critical point nothing condenses, whatever the pressure
  const hot=e.regime==='magma'||S>(e.runaway?1.0:1.12)||e.Tdry>(e.runaway?660:700);
  const wasRun=e.runaway;
  e.runaway=e.W+e.H2O>0.01&&hot;
  if(e.runaway){
    const ev=Math.min(e.W,e.W*dt/40+0.002*dt);
    e.W-=ev; e.H2O+=ev*270;
    if(!wasRun&&e.regime!=='magma'&&e.W>0.05&&t>150&&t-(e._runLog||-1e9)>600){ e._runLog=t; log(e,'Runaway greenhouse — the oceans are boiling off','climate'); }
  } else {
    const cond=Math.min(e.H2O,e.H2O*dt/25);
    e.H2O-=cond; e.W+=cond/270;
  }
  e.steam=e.H2O>5;
  // steam high in the air gets split by UV and the hydrogen leaks away — limited by the energy
  // arriving, and almost shut off by a cold trap when the oceans are calm
  if(e.H2O>0.001){
    const tl=Math.max(30,600*Math.pow(e.g,2)/Math.max(S,0.1));
    const cap=1.2*S/Math.max(e.g*e.g,0.04)*dt;
    const trap=!e.runaway&&e.T<330?0.02:1;
    e.H2O-=Math.min(e.H2O*(1-Math.exp(-dt/tl)),cap)*trap;
    if(e.runaway&&e.W+e.H2O/270<0.01&&!e._dryLogged&&t>50){ e._dryLogged=1; log(e,'Its water has escaped to space — a dry, hot world now','climate'); }
  }
  e.P=Pdry+e.H2O;
  const canLiquid=e.P>0.008&&e.W>0.004;
  // ice-covered oceans can stay liquid underneath if the interior is warm enough
  const Tfreeze=273-Math.min(25,e.vol*120);       // ammonia and salts lower the freezing point
  e.liquid=canLiquid&&e.T>Tfreeze&&!e.runaway&&e.T<tb+(e.liquid?12:0);
  const ocTot=e.W>0?Math.min(0.995,0.71*Math.pow(e.W,0.3)*(1.06-0.25*e.cont)):0;
  e.ocean=ocTot;
  e.seaIce=e.W>0.004?Math.max(0,Math.min(1,(Tfreeze+16-e.T)/40)):0;
  if(e.P<0.008&&e.W>0.004) e.seaIce=Math.max(e.seaIce,0.85);  // vacuum: any water sits as ice
  e.snow=Math.max(0,Math.min(1.2,(292-e.T)/55))*(e.W>0.001||e.P>0.05?1:0.2);
  const wasSnowball=e.ice>0.92;
  e.ice=e.ocean*e.seaIce;
  const temperate=278*Math.pow(S,0.25)>215;
  if(e.ice>0.92&&!wasSnowball&&e.ocean>0.3&&t>100&&temperate) log(e,'Snowball — ice has closed over the whole ocean','climate');
  if(e.ice<0.7&&wasSnowball&&e.ocean>0.3&&temperate) log(e,'The snowball is thawing as volcanic CO₂ builds up','climate');
  // a buried ocean needs a heat source: tides from a giant host, or a big, still-hot interior
  e.sub=!e.liquid&&e.W>0.3&&(e.tidal>0.12||(e.Hm>0.6&&e.m>1))&&e.T<Tfreeze;

  // ── clouds and haze ──
  const evap=e.liquid?e.ocean*Math.max(0,Math.min(1,(e.T-255)/55)):e.steam?1:0;
  e.cloud=Math.min(0.9,(e.P>0.03?0.08:0)+0.62*evap+(e.steam?0.4:0));
  e.haze=0; e.hazeKind='';
  if(e.steam){ e.haze=Math.min(1,0.6+e.H2O/400); e.hazeKind='steam'; }
  else if(!e.liquid&&e.P>3&&e.T>380){ e.haze=Math.min(1,0.4+e.P/40+e.V*0.2); e.hazeKind='sulfur'; }
  else if(e.CH4>0.0005&&e.T<200&&e.P>0.2){ e.haze=0.8; e.hazeKind='tholin'; }
  else if(e.CH4>0.001&&e.O2<0.01&&e.P>0.3){ e.haze=0.35; e.hazeKind='tholin'; }
  e.storm=e.liquid?Math.max(0,Math.min(1,(e.T-278)/25))*e.ocean:0;

  // ── albedo and temperature ──
  const land=1-e.ocean;
  let As=land*(e.regime==='magma'?0.05:0.16+0.18*e.snow*0.6)+e.ocean*(0.07*(1-e.seaIce)+0.62*e.seaIce);
  if(e.W<0.002&&e.T<160&&e.wat>0.1) As=0.6;     // icy crust
  e.A=As*(1-e.cloud)+0.52*e.cloud;
  if(e.haze>0) e.A=e.A*(1-e.haze)+(e.hazeKind==='steam'||e.hazeKind==='sulfur'?0.76:0.3)*e.haze;
  e.Teq=278*Math.pow(S,0.25)*Math.pow((1-e.A)/0.7,0.25);
  const pf=Math.sqrt(Math.min(1,e.P/0.3));
  // far from the star CO2 condenses into clouds and stops warming — the outer edge of the habitable zone
  const fco2=Math.max(0,Math.min(1,(S-0.08)/0.27));
  let dTd=fco2*(pf*3.2*Math.log2(1+Pco2/0.0003)+34*Math.sqrt(Pco2))+4*Math.min(Pn2,10)
         +pf*1.2*Math.log2(1+e.CH4/2e-6)+e.Hen*400+e.tidal*25;
  if(e.regime==='magma') dTd+=900*Math.min(1,e.H*1.2);
  const dTw=(e.liquid?15*Math.min(1.2,evap*1.4):0)+90*Math.log10(1+e.H2O);
  const k2=Math.min(1,dt/18);
  e.Tdry+=(e.Teq+dTd-e.Tdry)*k2;
  e.T+=(e.Teq+dTd+dTw-e.T)*k2;
  if(!isFinite(e.T)){ e.T=e.Teq+dTd+dTw; e.Tdry=e.Teq+dTd; }
  // CO2 frosts out onto the poles when it is cold enough
  if(e.T<205){ const pm=Math.pow(10,(e.T-195)/12); if(e.Catm>pm){ e.C+=e.Catm-pm; e.Catm=pm; } }
  // sunlight breaks methane down; far from the star it lingers
  e.CH4*=Math.exp(-dt*Math.min(2,S)/60);
  evoLife(e,dt,t,sys,r,log);
  evoEra(e,t,log);
}

function evoLife(e,dt,t,sys,r,log){
  const L=e.life;
  // tenacity widens what life will put up with and how fast it moves on
  const ten=sys.ten||0;
  const surf=e.liquid&&e.T>258-14*ten&&e.T<350+12*ten;
  const hab=surf||e.sub;
  // complex life needs a narrower band than microbes: too much heat (or cold) and it is pushed back down
  if(L.stage>=3){
    const lo=255-12*ten, hi=336+12*ten;
    const bad=!e.liquid||e.T>hi||e.T<lo;
    if(bad){
      L.stress=(L.stress||0)+dt;
      if(L.stress>(30+40*ten)){
        L.stress=0;
        const hot=e.T>hi||e.steam;
        const was=L.stage;
        L.stage=Math.max(L.stage>=5?4:L.stage-1,2); L.prog=0;
        if(was>=5){ civFall(e,L,t,hot?'Their world grew too hot to live on — the cities went dark':'The ice came back and the cities emptied',log); }
        else log(e,hot?(was===4?'The heat has killed off the animals — only plants and mats are left':'The land has baked bare — life has retreated to the sea')
                       :(was===4?'The cold has killed off the animals':'The land has frozen over — life has retreated to the sea'),'extinct');
      }
    } else L.stress=Math.max(0,(L.stress||0)-dt*0.5);
  }
  // the great filter: every technological civilisation faces some chance, each million years, of not making it
  if(L.stage>=5){
    const flt=sys.filter===undefined?0.5:sys.filter;
    if(r()<dt*(0.0003+0.0045*flt*flt+0.001*flt)){
      const why=['They went silent. No one is left to say why','A war ended them','They poisoned their own air','A plague of their own making emptied the cities',
        'They used up their world and could not leave it in time','Their machines outlived them','They simply stopped transmitting'];
      L.stage=Math.min(L.stage,4); L.prog=0;
      civFall(e,L,t,why[Math.floor(r()*why.length)],log);
    }
  }
  if(!hab){
    if(L.stage>0){
      L.unhab=(L.unhab||0)+dt;
      if(L.unhab>(e.ice>0.9?220:40)*(1+3*ten)){
        log(e,e.steam?'The last microbes have cooked — life here is over':e.ice>0.9?'The ice won — life here has frozen out':'Life here could not hold on','extinct');
        L.stage=0; L.prog=0; L.chem=0.3; L.pop=0; L.unhab=0; L.gone=true;
      }
    }
    return;
  }
  L.unhab=0;
  L.sub=!surf&&e.sub;
  if(L.stage===0){
    // dark oceans have chemistry but no sunlight, so they get there more slowly
    const food=(0.35+Math.min(1,e.vol*14)+Math.min(0.6,e.V*0.8)+(e.tidal>0.1?0.4:0))*(L.sub?(e.tidal>0.12?0.5:0.3):1);
    const calm=Math.exp(-sys.debris*45*Math.exp(-t/95));
    L.chem+=dt*food*calm/520*(1+2*ten);
    if(L.chem>L.gate){
      L.stage=1; L.prog=0; L.born=t; L.t1=t;
      log(e,L.sub?'Life has begun in the dark ocean under the ice':'Life has begun — microbial mats in the shallows','life');
    }
    return;
  }
  const light=Math.min(1.3,e.S*(1-e.haze*0.85));
  const cap=L.sub?1:6;
  const rate=[0,1/550,1/760,1/480,1/1000,1/160][Math.min(L.stage,5)]*(L.stage<5?(1+3*ten):1);
  let ok=true;
  if(L.stage===1&&L.sub) ok=false;
  if(L.stage===1) ok=ok&&light>0.15;
  if(L.stage===2) ok=e.O2>0.025*(1-0.6*ten)&&e.ocean<0.985;
  if(L.stage===3) ok=e.O2>0.09*(1-0.5*ten)&&e.T>262-12*ten&&e.T<330+12*ten;
  if(L.stage===4) ok=e.O2>0.15*(1-0.5*ten)&&L.techOK!==false;
  if(L.stage===4&&L.techOK===undefined) L.techOK=r()<0.42+0.4*ten;
  if(L.stage===5){ if(L.spaceOK===undefined) L.spaceOK=r()<0.88-0.55*(sys.filter===undefined?0.5:sys.filter); ok=L.spaceOK; }
  if(ok&&L.stage<cap) L.prog+=dt*rate*(0.6+0.8*r())*Math.min(1,1-L.ext*0.5);
  L.ext=Math.max(0,L.ext-dt*0.004);
  if(L.prog>=1&&L.stage<cap){
    L.stage++; L.prog=0; L['t'+L.stage]=t;
    const msg=['','',
      'Photosynthesis has evolved — the seas are turning green',
      'Life has crawled onto land — the continents are greening',
      'Complex, moving life has appeared',
      'Lights on the night side — something here builds cities',
      'They have left their world — ships are heading out across the system'][L.stage];
    log(e,msg,L.stage>=5?'civ':'life');
  }
}

// a technosphere ends; what is left behind is ruins, and maybe another try much later
function civFall(e,L,t,why,log){
  L.fallen=(L.fallen||0)+1; L.ruins=true; L.fellAt=t; L.fallWhy=why;
  L.techOK=Math.random()<0.25; L.spaceOK=undefined;
  e.civFell=why;
  log(e,why,'extinct');
}
function evoEra(e,t,log){
  let era;
  const L=e.life;
  if(e.engulfed) era='Engulfed';
  else if(e.regime==='magma') era=e.Teq>1100?'Lava world':'Magma ocean';
  else if(L.stage>=6) era='Spacefaring';
  else if(L.stage>=5) era='Technosphere';
  else if(e.colony&&!e.colony.dead) era=e.liquid&&e.T>255&&e.T<330?'Colony':'Outpost';
  else if(L.ruins||(e.colony&&e.colony.dead)) era='Silent ruins';
  else if(L.stage===4) era='Age of animals';
  else if(L.stage===3) era='Green continents';
  else if(L.stage===2) era='Oxygen age';
  else if(L.stage===1) era=L.sub?'Life under ice':'Microbial seas';
  else if(e.steam) era='Steam greenhouse';
  else if(e.haze>0.5&&e.P>10) era=e.T>320?'Hothouse':'Smog world';
  else if(e.ice>0.92&&e.ocean>0.3&&278*Math.pow(e.S,0.25)>215) era='Snowball';
  else if(e.sub) era='Hidden ocean';
  else if(e.liquid&&e.ocean>0.98) era='Ocean world';
  else if(e.liquid) era='Young seas';
  else if(t<700&&e.nImp>0&&e.P<0.05) era='Heavy bombardment';
  else if(e.wat>0.1&&e.T<200) era='Ice world';
  else if(e.P<0.01) era='Airless rock';
  else if(e.T>330) era='Desert furnace';
  else era='Cold desert';
  // an era has to last a few ticks before it is named, so brief wobbles don't count
  if(era===e.era){ e._pend=null; return; }
  if(e._pend!==era){ e._pend=era; e._pendN=0; }
  if(++e._pendN>=3||!e.era){ e.era=era; e.eraT=t; e._pend=null; }
}

function evoGiant(e,dt,t,sys,S){
  e.Teq=Math.max(40,122*Math.pow(S/0.037,0.25));
  e.H*=Math.exp(-dt/400);
  e.T=e.Teq+e.H*300;
  e.storm=Math.min(1,0.25+e.H);
  const era=e.Teq>1300?'Roasting giant':e.Teq>700?'Hot giant':e.H>0.35?'Young, glowing':e.kind==='gas'?'Banded giant':'Ice giant';
  if(era!==e.era){ e.era=era; e.eraT=t; }
}


/* ── genesis: life as cellular automata ───────────────────────
   Every living world runs Life-like rules (Conway's family: B/S
   birth and survival counts) on an equirectangular grid wrapped
   round the planet. Which rule a lineage gets is hashed from the
   world itself — its iron, water, volatiles, gravity and star — so
   two planets never quite share a biosphere. Ocean lineages drift

function clamp01(v){ return v<0?0:v>1?1:v; }
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }
function spectral(T){ return T<3700?'M':T<5200?'K':T<6000?'G':T<7500?'F':T<10000?'A':'B'; }
function fmtAge(t){ return t<1000?Math.round(t)+' Myr':(t/1000).toFixed(t<10000?2:1)+' Gyr'; }

function genStarLook(sp,dyn,name){
  const T=dyn?dyn.T:sp.T, L=dyn?dyn.L:sp.L, R=dyn?dyn.R:1;
  const c=kelvinRGB(T), c2=kelvinRGB(T*0.68).map(v=>v*0.8);
  return {name,color:toHex(c),color2:toHex(c2),
    radius:Math.min(sp.Rvis*R,9),
    intensity:Math.max(0.75,Math.min(2.1,1.35+0.22*Math.log10(Math.max(L,1e-4)))),
    glow:Math.max(0.15,Math.min(0.7,0.32+0.1*Math.log10(Math.max(L,1e-4)))),
    glowRad:Math.max(0.05,Math.min(0.26,0.085+0.025*Math.log10(Math.max(L,1e-3))+(R>2?0.05:0))),
    gran:R>2?0.85:0.5};
}
function genHZ(L){ return [0.95*Math.sqrt(L)*GEN.AU,1.67*Math.sqrt(L)*GEN.AU]; }

/* ── setup and formation ─────────────────────────────────── */
function genReset(){
  if(typeof rogues!=='undefined') rogues.length=0;
  gen.S=genCreate(gen.ing);
  gen.starName=genName(mulberry(Math.floor(gen.ing.seed*131)+7));
  gen.phase='setup'; gen.ended=false;
  store('genesisIng',gen.ing);
}
function genIgnite(){
  if(gen.phase==='evolving'||!gen.S||gen.S.t>0) genReset();
  gen.phase='forming'; gen.playing=true;
  buildUI(); hud('The disk is collapsing. Watch the embryos sweep up their neighbours.');
}
function genFormTick(){
  const S=gen.S;
  if(!S||gen.phase!=='forming'||!gen.playing) return;
  const t0=performance.now();
  let n=0;
  while(n<gen.pace&&performance.now()-t0<11){ genStep(S,0.015); n++; if(S.t>=GEN_TEND) break; }
  for(let i=0;i<S.n;i++) S.heat[i]*=0.985;
  if(S.t>=GEN_TEND) genCrystallize();
}
function ensureDust(){
  if(dustVAO) return;
  dustVAO=gl.createVertexArray(); gl.bindVertexArray(dustVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER,meshRock.vb); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,meshRock.ib);
  dustBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,dustBuf);
  dustData=new Float32Array(900*8);
  gl.bufferData(gl.ARRAY_BUFFER,dustData.byteLength,gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,4,gl.FLOAT,false,32,0); gl.vertexAttribDivisor(1,1);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,4,gl.FLOAT,false,32,16); gl.vertexAttribDivisor(2,1);
  gl.bindVertexArray(null); gl.bindBuffer(gl.ARRAY_BUFFER,null);
}
function dustColor(S,i){
  const gf=S.gas[i]/Math.max(S.m[i],1e-9);
  if(gf>0.3) return mix3([0.72,0.58,0.4],[0.62,0.78,0.9],clamp01((Math.hypot(S.x[i],S.z[i])/S.rf-1.2)*0.6));
  const ice=clamp01(S.wat[i]*3.2);
  const rock=mix3([0.42,0.38,0.34],[0.36,0.25,0.2],clamp01((S.fe[i]-0.3)*4));
  return mix3(rock,[0.78,0.86,0.94],ice);
}
function renderFormation(dt,time){
  genFormTick();
  const S=gen.S; if(!S) return;
  cam.tTarget=[0,0,0];
  const eye=[cam.target[0]+Math.cos(cam.pitch)*Math.sin(cam.yaw)*cam.dist,
             cam.target[1]+Math.sin(cam.pitch)*cam.dist,
             cam.target[2]+Math.cos(cam.pitch)*Math.cos(cam.yaw)*cam.dist];
  const la=lookAt(eye,cam.target,[0,1,0]);
  const VP=mul(persp(0.86,W/H,0.02,400),la.m); curVP=VP;
  beginScene();
  const st=genStarLook(S.sp,null,gen.starName);
  gl.useProgram(pStar);
  gl.uniformMatrix4fv(U(pStar,'uVP'),false,VP);

  gl.uniform1f(U(pStar,'uTime'),time);

  gl.uniformMatrix4fv(U(pStar,'uModel'),false,trs([0,0,0],st.radius));
  gl.uniform3fv(U(pStar,'cStar'),hex(st.color)); gl.uniform3fv(U(pStar,'cStar2'),hex(st.color2));
  gl.uniform1f(U(pStar,'uGran'),st.gran); gl.uniform1f(U(pStar,'uInt'),st.intensity);
  gl.drawElements(gl.TRIANGLES,meshSys.count,gl.UNSIGNED_INT,0);
  const sun=starCol(st);
  // snow line and habitable zone as faint guides
  gl.useProgram(pOrbit);
  gl.uniformMatrix4fv(U(pOrbit,'uVP'),false,VP);
  gl.uniform1f(U(pOrbit,'uN'),192); gl.uniform1f(U(pOrbit,'uIncl'),0);
  gl.uniform3fv(U(pOrbit,'uCenter'),new Float32Array([0,0,0]));
  gl.bindVertexArray(emptyVAO);
  gl.uniform3fv(U(pOrbit,'uCol'),new Float32Array([0.2,0.34,0.46]));
  gl.uniform1f(U(pOrbit,'uR'),S.rf); gl.drawArrays(gl.LINE_LOOP,0,192);
  const hz=genHZ(S.sp.L);
  gl.uniform3fv(U(pOrbit,'uCol'),new Float32Array([0.14,0.36,0.2]));
  gl.uniform1f(U(pOrbit,'uR'),hz[0]); gl.drawArrays(gl.LINE_LOOP,0,192);
  gl.uniform1f(U(pOrbit,'uR'),hz[1]); gl.drawArrays(gl.LINE_LOOP,0,192);
  // the planetesimals
  ensureDust();
  const minR=cam.dist*0.0042;
  for(let i=0;i<S.n;i++){
    const gf=S.gas[i]/Math.max(S.m[i],1e-9);
    const rr=Math.max(minR,(gf>0.3?0.07:0.05)*Math.cbrt(Math.min(S.m[i],400)));
    const c=dustColor(S,i), o=i*8;
    dustData[o]=S.x[i]; dustData[o+1]=S.y[i]; dustData[o+2]=S.z[i]; dustData[o+3]=rr;
    dustData[o+4]=c[0]; dustData[o+5]=c[1]; dustData[o+6]=c[2]; dustData[o+7]=Math.min(1,S.heat[i]);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,dustBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,dustData,0,S.n*8);
  gl.bindBuffer(gl.ARRAY_BUFFER,null);
  gl.useProgram(pDust);
  gl.uniformMatrix4fv(U(pDust,'uVP'),false,VP);
  gl.uniform3fv(U(pDust,'uSun'),new Float32Array(sun));
  gl.bindVertexArray(dustVAO);
  gl.drawElementsInstanced(gl.TRIANGLES,meshRock.count,gl.UNSIGNED_INT,0,S.n);
  // the gas, with whatever gaps the giants have opened
  const g=new Float32Array(56); let gmax=0;
  // surface density falls steeply with radius, so show it compressed to keep the outer disk visible
  const rc=b=>Math.sqrt(S.binR[b]*S.binR[b+1]);
  for(let b=0;b<56;b++) gmax=Math.max(gmax,S.gbin0[b]/S.binA[b]*rc(b));
  for(let b=0;b<56;b++) g[b]=Math.pow(S.gbin[b]/S.binA[b]*rc(b)/Math.max(gmax,1e-12),0.45);
  gl.useProgram(pDisk);
  gl.uniformMatrix4fv(U(pDisk,'uVP'),false,VP);
  gl.uniform1f(U(pDisk,'uIn'),S.rin*0.8); gl.uniform1f(U(pDisk,'uOut'),S.rout*1.3); gl.uniform1f(U(pDisk,'uSegs'),180);
  gl.uniform1fv(U(pDisk,'uGas[0]'),g);
  gl.uniform1f(U(pDisk,'uLb0'),S.lb0); gl.uniform1f(U(pDisk,'uLb1'),S.lb1);
  gl.uniform1f(U(pDisk,'uTime'),time); gl.uniform1f(U(pDisk,'uFrost'),S.rf);
  gl.uniform1f(U(pDisk,'uAmt'),0.95*Math.min(1.4,0.6+gen.ing.gasRich*0.4));
  gl.uniform3fv(U(pDisk,'cHot'),new Float32Array([1.0,0.62,0.32]));
  gl.uniform3fv(U(pDisk,'cCold'),new Float32Array([0.32,0.2,0.42]));
  gl.uniform3fv(U(pDisk,'uSun'),new Float32Array(hex(st.color)));
  gl.disable(gl.CULL_FACE); gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLE_STRIP,0,181*2);
  gl.disable(gl.BLEND); gl.depthMask(true); gl.enable(gl.CULL_FACE);
  // labels for the star and the biggest embryos
  const items=[{n:gen.starName,p:[0,0,0],r:st.radius,s:true}];
  genTop(S,6).forEach(i=>{ if(S.m[i]<0.25) return;
    const gf=S.gas[i]/S.m[i];
    items.push({n:(gf>0.45&&S.m[i]>25?'Giant ':gf>0.1?'Mini-Neptune ':'')+fmtM(S.m[i])+' M⊕',p:[S.x[i],S.y[i],S.z[i]],r:0.1}); });
  placeLabels(VP,items);
  const cp=projectPt(VP,[0,0,0]);
  const glows=cp[2]>0.0001?[{amt:st.glow*st.intensity,rad:st.glowRad,pos:[cp[0]/cp[2]*0.5+0.5,cp[1]/cp[2]*0.5+0.5],col:hex(st.color)}]:[];
  endScene(la,glows);
}

/* ── crystallize: the survivors become a system ──────────── */
const ROMAN=['I','II','III','IV','V','VI'];
function genCrystallize(){
  const S=gen.S, ing=gen.ing;
  const r=mulberry(Math.floor(ing.seed*977)+29);
  gen.rng=r;
  const GM=S.GM;
  const list=[]; let scattered=0, debrisM=0, debrisIce=0;
  for(let i=0;i<S.n;i++){
    const p=[S.x[i],S.y[i],S.z[i]], v=[S.vx[i],S.vy[i],S.vz[i]];
    const rr=Math.hypot(...p), v2=v[0]*v[0]+v[1]*v[1]+v[2]*v[2];
    const a=1/(2/rr-v2/GM);
    if(!(a>0)||a>S.rout*2.6){ scattered++; continue; }
    const h=vcross(p,v), hm=Math.hypot(...h)||1;
    list.push({i,m:S.m[i],a,incl:Math.acos(Math.max(-1,Math.min(1,-h[1]/hm))),phase:Math.atan2(p[2],p[0]),
      retro:h[1]>0,gf:S.gas[i]/S.m[i],fe:S.fe[i],si:S.si[i],wat:S.wat[i],vol:S.vol[i],gi:S.gi[i],hits:S.hits[i]});
  }
  const PMIN=0.08;
  let planets=list.filter(o=>o.m>=PMIN);
  const debris=list.filter(o=>o.m<PMIN);
  if(planets.length>10){ const keep=planets.sort((x,y)=>y.m-x.m).slice(0,10); planets.filter(o=>!keep.includes(o)).forEach(o=>debris.push(o)); planets=keep; }
  planets.sort((x,y)=>x.a-y.a);
  debris.forEach(o=>{ debrisM+=o.m; if(o.wat>0.1) debrisIce+=o.m; });

  bodies.length=0; belts.length=0; collapsed.clear();
  focusIdx=-1; selIdx=-1; linkIdx=-1;
  gen.st={...S.sp};
  stars.length=0; stars.push(genStarLook(S.sp,starAt(gen.st,0),gen.starName));
  const letters='bcdefghijklmn';
  const sm=Math.sqrt(S.sp.M);
  const kindOf=o=>o.gf>0.45&&o.m>25?'gas':(o.gf>0.08&&o.m>3)||(o.m>9&&o.gf>0.03)?'ice':'rocky';
  planets.forEach((o,k)=>{
    const kind=kindOf(o);
    const name=gen.starName+' '+letters[k];
    const tilt=kind==='gas'?r()*0.12:o.gi>0.35?r()*Math.PI*(r()<0.3?1:0.55):r()*0.45;
    let scale,p,colors;
    if(kind==='gas'){
      scale=0.55*Math.max(0.75,Math.min(1.12,Math.pow(o.m/318,0.1)));
      p={amp:0.045,freq:1.5+r()*0.6,ridge:0.08,sea:-1.5,plateN:0,rivers:0,terrace:0.45+r()*0.2,terraceN:10+Math.floor(r()*6),
         oblate:0.05+0.05*Math.min(1,o.m/300),warpAmp:0.3+r()*0.15,warpFreq:0.45+r()*0.15,warpDrift:0.015,rim:0.3,tilt,craterN:0};
    } else if(kind==='ice'){
      scale=Math.max(0.13,Math.min(0.42,0.26*Math.pow(o.m/15,0.3)));
      p={amp:0.04,freq:1.5,ridge:0.12,sea:-1.5,plateN:0,rivers:0,terrace:0.3,terraceN:8,oblate:0.025,warpAmp:0.25,warpFreq:0.45,warpDrift:0.01,rim:0.7,tilt,craterN:0};
    } else {
      scale=Math.max(0.035,Math.min(0.32,0.17*Math.pow(o.m,0.27)*(1+0.2*Math.min(1,o.wat*3))));
      p={amp:0.05,freq:1.15+r()*1.1,ridge:0.35+r()*0.4,warpAmp:0.25+r()*0.4,warpFreq:0.45+r()*0.6,warpIter:1+Math.floor(r()*2),
         warpDrift:0,sea:-1.5,snow:0,plateN:0,plateAmp:0.2,plateRidge:0.1,plateTrench:0.1,plateSharp:14,shelf:0.25,
         rivers:0,riverFreq:3+r()*2,terrace:0,craterN:0,craterSize:0.15,craterDepth:0.24,rim:0.1,spec:0.65,rough:0.72,
         paint:0,carve:0,tilt,oblate:0,lump:o.m<0.015?0.22:0,lumpScale:1.3,faceOn:0};
    }
    colors={deep:'#0a2a48',shallow:'#1d6e92',low:'#3a3430',mid:'#5a524a',high:'#857a6e',atmo:'#8090a0',ringA:'#d8c9ad',ringB:'#8f7f6b'};
    const spd=0.49*Math.sqrt(GM/Math.pow(o.a,3))*(o.retro?-1:1);
    const spin=kind==='gas'?1.1+r()*0.5:kind==='ice'?0.8+r()*0.5:0.25+r()*0.9;
    const b=mkBody(name,-1,p,colors,{r:o.a,speed:spd,phase:o.phase,incl:Math.min(o.incl,0.5)},scale,spin);
    b.gen={kind,m:o.m,fe:o.fe,si:o.si,wat:o.wat,vol:o.vol,gasf:o.gf,aAU:o.a/GEN.AU,gi:o.gi,hits:o.hits,tidal:0};
    if(kind!=='rocky'&&r()<(o.m>50?0.45:0.3)+(o.a>S.rf?0.25:0)){
      p.ringOn=1; p.ringInner=1.25+r()*0.25; p.ringOuter=p.ringInner+0.5+r()*1.0; p.ringOpacity=0.4+r()*0.5;
      p.ringBands=6+r()*14; p.ringGap=0.3+r()*0.4; p.ringTurb=0.2+r()*0.4;
      if(o.a<S.rf){ colors.ringA='#6a625a'; colors.ringB='#3a3430'; }
      else { colors.ringA='#e6dcc8'; colors.ringB='#8f8774'; }
    }
    bodies.push(b);
  });
  // moons: debris disks around giants, and the leftovers of giant impacts on rocky worlds
  const nP=bodies.length;
  for(let k=0;k<nP;k++){
    const pb=bodies[k], g=pb.gen;
    const add=(nm,mm,dist,comp,tidal)=>{
      if(bodies.length>=26) return;
      const sc=Math.max(0.018,Math.min(pb.scale*0.42,0.17*Math.pow(mm,0.27)));
      const rad=pb.scale*dist;
      const p={amp:0.06,freq:1.4+r()*0.8,ridge:0.4+r()*0.3,warpAmp:0.3,warpFreq:0.6,warpIter:1,sea:-1.5,plateN:0,
        plateAmp:0.15,shelf:0.2,rivers:0,riverFreq:4,craterN:0,craterSize:0.15,craterDepth:0.24,rim:0.05,spec:0.6,rough:0.7,
        paint:0,carve:0,tilt:r()*0.1,lump:mm<0.004?0.3:0,lumpScale:1.4,faceOn:0};
      const sp=Math.max(0.25,Math.min(3,1.7*Math.pow(pb.scale*2.6/rad,1.5)));
      const m=mkBody(nm,k,p,{deep:'#0a2a48',shallow:'#1d6e92',low:'#4a4440',mid:'#6a625a',high:'#8a8278',atmo:'#606870'},
        {r:rad,speed:sp,phase:r()*6.28,incl:r()*0.12},sc,sp);
      m.gen={kind:'rocky',m:mm,fe:comp.fe,si:1-comp.fe-comp.wat-comp.vol,wat:comp.wat,vol:comp.vol,gasf:0,aAU:g.aAU,gi:0,hits:0,tidal};
      bodies.push(m);
    };
    if(g.kind==='gas'||g.kind==='ice'){
      const n=g.kind==='gas'?Math.max(2,Math.min(5,Math.round(2+Math.log10(g.m)*0.9+r()))):1+Math.floor(r()*2.5);
      const icy=pb.orbit.r>S.rf;
      for(let j=0;j<n;j++){
        const dist=2.0+j*1.15+r()*0.45;
        const mm=(0.004+r()*0.02)*(g.kind==='gas'?1:0.6);
        const tidal=Math.max(0,Math.min(0.9,(g.m/318)*0.55*Math.pow(2.0/dist,4)))+(j===1?0.12:0);
        const comp=icy&&j>0?{fe:0.2,wat:0.3+r()*0.15,vol:0.03+r()*0.06}:{fe:0.3,wat:icy?0.02:0.003,vol:0.012};
        add(pb.name+' '+ROMAN[j],mm,dist,comp,tidal);
      }
    } else if(g.gi>0.15&&g.m>0.25&&r()<0.22+0.3*Math.min(1,g.gi)){
      add(pb.name+' I',Math.max(0.006,g.m*0.012*Math.min(2,g.gi/0.3)),3+r()*2.5,{fe:0.1,wat:0.0005,vol:0.003},0);
      pb.world.p.tilt=r()*0.5+(g.gi>0.5?r()*0.6:0);
    } else if(g.m>0.05&&g.m<0.4&&debris.length>8&&r()<0.35){
      add(pb.name+' I',0.0003,2.4+r(),{fe:0.25,wat:0.005,vol:0.01},0);
    }
  }
  // leftover rubble settles into belts where it is thickest
  if(debris.length>=4){
    const bins=new Array(24).fill(0).map(()=>[]);
    const l0=Math.log(S.rin*0.9), l1=Math.log(S.rout*2.6);
    debris.forEach(o=>{ const b=Math.max(0,Math.min(23,Math.floor((Math.log(o.a)-l0)/(l1-l0)*24))); bins[b].push(o); });
    const groups=[]; let cur=null;

  const cls=Tq<150?0:Tq<350?1:Tq<800?2:Tq<1400?3:4;
  if(b._cls!==cls){
    b._cls=cls;
    const alt=(b.world.seed%2)===0;
    let pal;
    if(cls===0) pal=e.kind==='gas'?(alt?['#b48c54','#c9a06a','#e8d2a0','#f5ead0','#e0c68e']:['#cdb98a','#ddc89a','#ecdfbd','#f7f1e0','#e8d9b0'])
                                    :(alt?['#7cc4bc','#b8e8e0','#9fd8d0','#eafaf6','#bdf0e8']:['#1b3480','#1f3f9e','#2c56c4','#8fb0f0','#3f6fe0']);
    else if(cls===1) pal=['#a8b0bc','#c8ccd2','#e6e8ec','#ffffff','#dfe8f0'];
    else if(cls===2) pal=['#22488a','#2e5fa8','#4f86d0','#9cc4f0','#6fa8ff'];
    else if(cls===3) pal=['#14162a','#1f2236','#3a3150','#5a4a6a','#7a4a9a'];
    else pal=['#3a2a20','#4a3a30','#6a5a48','#8a7a60','#ff7a40'];
    c.deep=pal[0]; c.low=pal[1]; c.mid=pal[2]; c.high=pal[3]; c.atmo=pal[4];
    if(gen.phase==='evolving'&&gen.t>10) genLog(e,['Ammonia clouds have formed','Water clouds now veil it','Its clouds have burned away to a clear blue sky','Alkali metals darken its sky','Silicate clouds glow in its scorched sky'][cls],'climate');
  }
  p.warpDrift=0.015;
  fx.on=1; fx.cloud=0; fx.haze=0; fx.veg=0; fx.lava=0; fx.algae=0; fx.lifeOn=0; fx.lifeTex=null; fx.seaIce=0; fx.iceAll=0;
  fx.thermal=Math.min(0.9,e.H*0.5+(cls>=3?0.35:0));
  fx.tempK=e.T; fx.humid=0; fx.wind=0; fx.storm=0; fx.seed=1;
  for(let i=0;i<4;i++) fx.flash[i*4+3]=0;
  if(!fx.vegA){ fx.vegA=fx.vegB=fx.vegC=fx.desert=fx.tundra=fx.algaeCol=[0,0,0]; fx.cloudCol=fx.hazeCol=[1,1,1]; }
}
function setEvoUniforms(w){
  const fx=evoFX.get(w)||lookFromP(w);
  if(!blankTex){ blankTex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,blankTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4)); }
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,(fx&&fx.lifeTex)||blankTex);
  gl.uniform1i(U(pPlanet,'uLife'),3);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1f(U(pPlanet,'uEvo'),fx&&fx.on?1:0);
  if(!fx||!fx.on) return;
  const f=(n,v)=>gl.uniform1f(U(pPlanet,n),v), v3=(n,v)=>gl.uniform3fv(U(pPlanet,n),new Float32Array(v));
  f('uVeg',fx.veg); f('uTempK',fx.tempK); f('uHumid',fx.humid); f('uCloud',fx.cloud); f('uHaze',fx.haze);
  f('uWind',fx.wind); f('uStorm',fx.storm); f('uLava',fx.lava); f('uThermal',fx.thermal); f('uSeaIce',fx.seaIce);
  f('uAlgae',fx.algae); f('uIceAll',fx.iceAll); f('uCloudSeed',fx.seed); f('uLifeOn',fx.lifeOn); f('uLifeGlow',fx.lifeGlow||0);
  v3('cCloud',fx.cloudCol); v3('cHaze',fx.hazeCol); v3('cLava',[1.0,0.36,0.1]);
  v3('cVegA',fx.vegA); v3('cVegB',fx.vegB); v3('cVegC',fx.vegC); v3('cDesert',fx.desert); v3('cTundra',fx.tundra);
  v3('cAlgae',fx.algaeCol); v3('cIceE',[0.86,0.92,0.96]);
  gl.uniform4fv(U(pPlanet,'uFlash[0]'),fx.flash);
}
function genDrawZones(VP){
  if(mode!=='genesis'||gen.phase!=='evolving'||!gen.sys) return;
  const L=gen.sys.starNow?gen.sys.starNow.L:gen.st.L;
  const hz=genHZ(L);
  gl.useProgram(pOrbit);
  gl.uniformMatrix4fv(U(pOrbit,'uVP'),false,VP);
  gl.uniform1f(U(pOrbit,'uN'),192); gl.uniform1f(U(pOrbit,'uIncl'),0);
  gl.uniform3fv(U(pOrbit,'uCenter'),new Float32Array([0,0,0]));
  gl.uniform3fv(U(pOrbit,'uCol'),new Float32Array([0.12,0.32,0.17]));
  gl.bindVertexArray(emptyVAO);
  gl.uniform1f(U(pOrbit,'uR'),Math.min(hz[0],300)); gl.drawArrays(gl.LINE_LOOP,0,192);
  gl.uniform1f(U(pOrbit,'uR'),Math.min(hz[1],300)); gl.drawArrays(gl.LINE_LOOP,0,192);
}

const KIND_LABEL={gas:'Gas giant',ice:'Ice giant',rocky:'Rocky'};
function kindName(b){
  const g=b.gen; if(!g) return '';
  if(b.parent>=0) return g.wat>0.1?'Icy moon':'Moon';
  if(g.kind==='ice') return g.aAU*GEN.AU<(gen.S?gen.S.rf:9)?'Mini-Neptune':'Ice giant';
  if(g.kind==='gas') return 'Gas giant';
  if(g.m<0.08) return 'Dwarf';
  if(g.wat>0.08) return b.evo&&b.evo.T<250||g.aAU*GEN.AU>(gen.S?gen.S.rf:9)?'Ice world':'Water world';
  return g.m>1.8?'Super-Earth':'Rocky';
}
function eraColor(e){
  if(!e) return '#888';
  if(e.engulfed||e.dead) return '#5a3030';
  if(e.life.stage>=5||(e.colony&&!e.colony.dead)) return '#ffd27a';
  if(e.era==='Silent ruins') return '#8a7f74';
  if(e.life.stage>=3) return '#5fcf6a'; if(e.life.stage>=1) return '#3fb8a8';
  if(e.regime==='magma') return '#ff7a3a';
  if(e.liquid) return '#4a9fe0'; if(e.ice>0.9||e.T<200) return '#cfe6f2';
  if(e.haze>0.5) return '#e8c878';
  return '#9a8a7a';
}

function genUIRefresh(force){

  if(mode!=='genesis') return;
  if(gen.phase==='forming'&&u.bar){
    const S=gen.S;
    u.bar.style.width=Math.min(100,S.t/GEN_TEND*100).toFixed(1)+'%';
    const top=genTop(S,5);
    u.live.innerHTML=`<div class="gen-stat"><span>Elapsed</span><b>${(S.t*GEN.TMYR).toFixed(1)} Myr</b><span>Bodies</span><b>${S.n}</b>`+
      `<span>Gas left</span><b>${Math.round(genGasLeft(S)*100)}%</b><span>Mergers</span><b>${S.stats.merged}</b></div>`+
      top.map(i=>{ const gf=S.gas[i]/S.m[i]; return `<div class="gen-row"><i style="background:${toHex(dustColor(S,i))}"></i>${fmtM(S.m[i])} M⊕ <em>${(Math.hypot(S.x[i],S.z[i])/GEN.AU).toFixed(2)} AU${gf>0.1?' · '+Math.round(gf*100)+'% gas':''}${S.wat[i]>0.1?' · icy':''}</em></div>`; }).join('');
    if(u.n!==S.events.length){ u.n=S.events.length;
      u.lg.innerHTML=S.events.slice(-7).reverse().map(ev=>`<div class="gen-ev ${ev.kind}"><b>${ev.t.toFixed(1)} Myr</b> ${ev.txt}</div>`).join(''); }
    return;
  }

  u.top.innerHTML=`<b>${fmtAge(gen.t)}</b><span>${gen.t>=gen.tMax?'end of the record':gen.evoPlaying?(gen.pace<gen.speed?`slowed to ${gen.pace} Myr/s — a civilisation is rising`:'deep time running'):'paused'}</span>`;

  for(const r of u.rows){
    const e=r.b.evo;
    r.dot.style.background=eraColor(e);
    r.chip.textContent=r.b.gone?'Engulfed':e.era||'';
    r.tC.textContent=r.b.gone?'':Math.round(e.T-273)+'°C';
    r.it.style.opacity=r.b.gone?0.45:1;
  }
  const b=selIdx>=0?bodies[selIdx]:null;
  if(b&&b.evo){
    const e=b.evo, g=b.gen;
    const comp=[[g.fe,'#8a6a5a','iron'],[g.si,'#b0a090','rock'],[g.wat,'#9fd0f0','water/ice'],[g.vol,'#d0b070','volatiles'],[g.gasf||0,'#e8c890','H/He gas']];
    const tot=comp.reduce((s,c)=>s+(c[0]||0),0)||1;
    const L=e.life;
    const gases=[['CO₂',e.Pco2||0],['N₂',e.N2],['O₂',e.O2],['H₂O',e.H2O],['CH₄',e.CH4]].filter(x=>x[1]>0.0005).sort((a,b)=>b[1]-a[1]);
    const rows=[];
    const R=(k,v)=>rows.push(`<span>${k}</span><b>${v}</b>`);
    R('Type',kindName(b)); R('Mass',fmtM(g.m)+' M⊕');
    R('Orbit',(b.parent>=0?'around '+bodies[b.parent].name:(b.orbit.r/GEN.AU).toFixed(2)+' AU'));

    if(e.kind==='rocky'){
      R('Air',e.P<0.001?'none':(e.P<1?e.P.toFixed(3):e.P.toFixed(1))+' bar'+(gases.length?' · '+gases.slice(0,2).map(x=>x[0]).join(', '):''));
      R('Water',e.W<0.004?(e.H2O>1?'all steam':'none'):(e.ice>0.9?'frozen ':e.liquid?'':'ice ')+(e.W<10?e.W.toFixed(2):Math.round(e.W))+' oceans · '+Math.round(e.ocean*100)+'% cover');
      R('Interior',{magma:'magma ocean',plates:'plate tectonics',lid:'stagnant lid'}[e.regime]+(e.mag?' · magnetic field':''));

      const cs=civSummary(e); if(cs) R('Civilisation',cs);
      R('Life',L.stage===0?(L.gone?'extinct':e.liquid||e.sub?'not yet':'—'):['','microbes','photosynthesis','land life','animals','technosphere','spacefaring'][L.stage]+(L.sub?' (under ice)':''));
    }
    let html=`<div class="gen-era" style="border-color:${eraColor(e)}">${b.gone?'Engulfed':e.era}<small>since ${fmtAge(e.eraT||0)}</small></div>`+

        `<p class="note">Rules are hashed from this world's iron, water, volatiles and mass. Sea lineages drift with currents set by its spin; animals graze the plants they cross. Cover: ${(b.life.pop*100).toFixed(1)}% of the surface.</p>`;
    }
    if(u.detFor!==selIdx||force||now-(u.detT||0)>400){ u.det.innerHTML=html; u.detFor=selIdx; u.detT=now; }
  }
  if(gen.logDirty){
    gen.logDirty=false;
    const who=b?b.name:null;
    const items=gen.log.filter(x=>!gen.filterSel||!who||x.who===who).slice(0,40);
    if(gen.silUI) silenceRefresh();
    u.lg.innerHTML=items.length?items.map(x=>`<div class="gen-ev ${x.kind}"><b>${fmtAge(x.t)}</b>${x.who?' <u>'+x.who+'</u>':''} ${x.txt}</div>`).join(''):'<p class="note">Nothing yet.</p>';

}

/* ── genesis: rogues, interventions and the bridge to the Planet editor ──
   Rogue asteroids and comets fall through the system from outside; most
   pass, some hit, a few get caught as moons. You can throw your own, seed
   life, or send a planet from the editor into the evolving system — into
   an orbit, or straight into another world.
   ──────────────────────────────────────────────────────────────────── */
if(gen.ing.tenacity===undefined) gen.ing.tenacity=0.5;
if(gen.ing.rogues===undefined) gen.ing.rogues=0.35;
gen.send={m:1,W:1,fe:0.32,vol:0.012,au:1,target:-1,name:''};
const rogues=[];
let editorEvo=null;

function tenacityName(v){ return v<0.2?'Rare Earth':v<0.45?'Stubborn':v<0.75?'Hardy':'Life finds a way'; }
function sysReach(){ return Math.max(10,bodies.reduce((m,b)=>Math.max(m,b.parent<0&&!b.gone?b.orbit.r:0),0)*1.45); }
function genInitBody(b,hot){
  const g=b.gen;
  b.evo=evoNew(g,gen.rng||mulberry(5)); b.evo.name=b.name; b.evo.spin=b.spin;
  b.evo.T=hot?(g.kind==='rocky'?1500:200):278*Math.pow(starAt(gen.st,gen.t).L/(g.aAU*g.aAU),0.25)+15;
  b.evo.Tdry=b.evo.T;
  b.life=null; b.lifeTex=null; b.bake=null; b.gone=false;
  geoOverride.set(b.world.p,{plates:new Float32Array(MAX_PLATES*4),craters:new Float32Array(MAX_CRATERS*4),craterD:new Float32Array(MAX_CRATERS)});
}

/* rogue traffic */
function spawnRogue(o){
  o=o||{};
  const reach=sysReach();
  const live=bodies.map((b,i)=>i).filter(i=>!bodies[i].gone);
  if(!live.length) return null;
  let kind=o.kind||(Math.random()<0.35?'comet':'rock');
  let mode='pass', target=-1;
  if(o.target!==undefined){ mode='hit'; target=o.target; }
  else {
    const roll=Math.random();
    // bigger worlds are bigger targets
    const pick=()=>{ let tot=0; live.forEach(i=>tot+=bodies[i].scale**2); let x=Math.random()*tot;
      for(const i of live){ x-=bodies[i].scale**2; if(x<=0) return i; } return live[0]; };
    if(roll<0.32){ mode='hit'; target=pick(); }
    else if(roll<0.37){ mode='capture'; target=live.filter(i=>bodies[i].parent<0)[Math.floor(Math.random()*live.filter(i=>bodies[i].parent<0).length)]; }
  }
  const a=Math.random()*Math.PI*2, y=(Math.random()-0.5)*0.5;
  const start=[Math.cos(a)*reach*1.5,y*reach,Math.sin(a)*reach*1.5];
  const end=[-start[0]+(Math.random()-0.5)*reach,-start[1],-start[2]+(Math.random()-0.5)*reach];
  const d=vnorm([end[0]-start[0],end[1]-start[1],end[2]-start[2]]);
  const rad=o.rad||Math.min(0.4,0.12+Math.pow(Math.random(),3)*0.3);
  const rg={kind,mode,target,rad,pos:start,vel:d,speed:reach*(o.payload?0.32:0.42),trail:[],age:0,payload:o.payload||null,user:!!o.user,name:o.name||''};
  rogues.push(rg);
  return rg;
}
function genRogueTick(dt){
  if(gen.evoPlaying&&gen.t<gen.tMax&&gen.ing.rogues>0){
    gen.rogueAcc=(gen.rogueAcc||0)+dt*gen.ing.rogues*0.5;
    if(gen.rogueAcc>1&&rogues.filter(x=>!x.civ).length<7){ gen.rogueAcc=0; spawnRogue(); }
  }
  const reach=sysReach();
  for(let k=rogues.length-1;k>=0;k--){
    const rg=rogues[k];
    rg.age+=dt;
    if(rg.age>0.0){ rg.trail.unshift(rg.pos.slice()); if(rg.trail.length>(rg.civ?30:16)) rg.trail.pop(); }
    const tb=rg.target>=0?bodies[rg.target]:null;
    if(rg.mode!=='pass'&&(!tb||tb.gone)) rg.mode='pass';
    if(rg.mode!=='pass'){
      const tp=bodyPos(tb);
      const to=[tp[0]-rg.pos[0],tp[1]-rg.pos[1],tp[2]-rg.pos[2]];
      const dist=Math.hypot(to[0],to[1],to[2]);
      const want=vnorm(to), steer=rg.civ&&rg.age<1.2?Math.min(1,dt*0.6):dist<Math.max(reach*0.35,tb.scale*8)?1:Math.min(1,dt*2.4);
      rg.vel=vnorm([rg.vel[0]+(want[0]-rg.vel[0])*steer,rg.vel[1]+(want[1]-rg.vel[1])*steer,rg.vel[2]+(want[2]-rg.vel[2])*steer]);
      if(rg.mode==='capture'&&dist<tb.scale*3.2){ captureRogue(rg); rogues.splice(k,1); continue; }
      if(rg.mode==='hit'&&dist<tb.scale*1.1+rg.speed*dt*1.6){ rogueHit(rg,tb,want); rogues.splice(k,1); continue; }
    }
    // ships climb away slowly and then pick up speed; asteroids come in fast
    const sp=rg.civ?rg.speed*(0.06+0.94*Math.min(1,(rg.age/3)**2)):rg.speed*(rg.mode==='pass'?1:Math.min(1.6,1+0.6*(1-Math.min(1,rg.age/3))));
    rg.pos=[rg.pos[0]+rg.vel[0]*sp*dt,rg.pos[1]+rg.vel[1]*sp*dt,rg.pos[2]+rg.vel[2]*sp*dt];
    if(rg.age>(rg.civ?90:40)||Math.hypot(...rg.pos)>reach*2.2) rogues.splice(k,1);
  }
}
function rogueHit(rg,b,inDir){
  const e=b.evo;
  const dir=vnorm([-inDir[0],-inDir[1],-inDir[2]]);
  if(rg.kind==='ship'){ civArrive(rg,b); return; }
  if(rg.payload){ planetCollide(b,rg.payload); return; }
  const what=rg.kind==='comet'?(rg.user?'Your comet hit':'A rogue comet struck'):(rg.user?'Your asteroid hit':'A rogue asteroid struck');
  if(e.kind==='rocky') evoImpact(e,gen.rng,rg.rad,dir,rg.kind,gen.sys,genLog,gen.t,what);
  else { e.H=Math.min(1,e.H+0.08); genLog(e,what+' and vanished into the clouds','impact'); }
  if(selIdx>=0&&bodies[selIdx]===b) hud(b.name+': '+what.toLowerCase()+'.');
}
function captureRogue(rg){
  const host=bodies[rg.target]; if(!host||bodies.length>=MAX_BODIES) return;
  const n=bodies.filter(x=>x.parent===rg.target).length;
  const comet=rg.kind==='comet';
  const p={amp:0.08,freq:1.8,ridge:0.5,warpAmp:0.3,warpFreq:0.6,warpIter:1,sea:-1.5,plateN:0,shelf:0.2,rivers:0,craterN:0,
    craterSize:0.15,craterDepth:0.24,rim:0.02,spec:0.5,rough:0.8,paint:0,carve:0,tilt:Math.random()*0.6,lump:0.32,lumpScale:1.6,faceOn:0};
  const sc=Math.max(0.014,host.scale*0.08);
  const rad=host.scale*(3.2+n*0.9+Math.random()*0.6);
  const sp=Math.max(0.25,Math.min(3,1.7*Math.pow(host.scale*2.6/rad,1.5)))*(Math.random()<0.3?-1:1);
  const m=mkBody(host.name+' '+(ROMAN[n]||('M'+(n+1))),rg.target,p,
    {deep:'#3a3a40',shallow:'#3a3a40',low:comet?'#7a8a96':'#4a4238',mid:comet?'#a8b8c4':'#6a6050',high:comet?'#dfe8ee':'#8a8070',atmo:'#202020'},
    {r:rad,speed:sp,phase:Math.random()*6.28,incl:Math.random()*0.5},sc,0.4);
  m.gen={kind:'rocky',m:0.0004,fe:comet?0.1:0.3,si:comet?0.4:0.68,wat:comet?0.45:0.002,vol:comet?0.05:0.01,gasf:0,aAU:host.gen.aAU,gi:0,hits:0,tidal:0};
  bodies.push(m); genInitBody(m,false);
  genLog(host.evo,`Caught a passing ${comet?'comet':'asteroid'} — it now circles as a small moon`,'geo');
  if(mode==='genesis') buildUI();
}
// a whole planet arriving — the target gets the giant impact of its life
function planetCollide(b,pl){
  const e=b.evo, g=b.gen, m=pl.gen.m;
  const q=m/Math.max(g.m,1e-6);
  if(e.kind!=='rocky'){
    g.m+=m; e.H=Math.min(1,e.H+Math.min(0.5,q*4));
    genLog(e,`Swallowed ${pl.name} whole (${fmtM(m)} M⊕) — it glows with the heat`,'impact');
    return;
  }
  const M=g.m+m;
  for(const k of ['fe','si','vol']) g[k]=(g[k]*g.m+pl.gen[k]*m)/M;
  e.fe=g.fe; e.si=g.si; e.vol=g.vol;
  e.W+=pl.W||0; e.C+=pl.gen.vol*m*5000*0.5;
  g.m=M; e.m=M; e.R=Math.pow(M,0.27); e.g=M/(e.R*e.R);
  b.scale=Math.min(0.42,b.scale*Math.pow(M/(M-m),0.27));
  e.H=Math.min(1,0.62+q*1.5); e.tauH=60+90*Math.pow(M,0.45);
  e.craters=[]; e.relief=0.15; e.erosion=0;
  e.flashes=[{d:randDir(Math.random),r:1.2,a:1}];
  const L=e.life;
  if(L.stage>0){ genLog(e,`${pl.name} hit — the surface melted and every living thing died`,'extinct');
    L.stage=0; L.prog=0; L.chem=0.2; L.gone=true; if(b.life){ b.life=null; } }
  else genLog(e,`${pl.name} hit — the two worlds have melted into one`,'impact');
  if(q>0.04&&bodies.length<32){
    // the splash gathers into a moon that still wears the impactor's colours
    const idx=bodies.indexOf(b), n=bodies.filter(x=>x.parent===idx).length;
    const p=JSON.parse(JSON.stringify(pl.world.p)); p.sea=-1.5; p.plateN=0; p.faceOn=pl.world.p.faceOn||0;
    const sc=Math.max(0.025,b.scale*Math.min(0.45,0.2+q*0.6));
    const rad=b.scale*(3.4+n*1.0);
    const mm=mkBody(b.name+' '+(ROMAN[n]||('M'+(n+1))),idx,p,{...pl.world.colors},
      {r:rad,speed:Math.max(0.3,1.7*Math.pow(b.scale*2.6/rad,1.5)),phase:Math.random()*6.28,incl:Math.random()*0.15},sc,0.3);
    mm.world.seed=pl.world.seed;
    mm.gen={kind:'rocky',m:Math.max(0.004,m*0.1),fe:0.12,si:0.84,wat:0.0008,vol:0.004,gasf:0,aAU:g.aAU,gi:0,hits:0,tidal:0};
    mm.basePal=pl.basePal; mm.baseAmp=pl.world.p.amp;
    bodies.push(mm); genInitBody(mm,true);
    genLog(e,`Debris from ${pl.name} has gathered into a moon`,'geo');
  }
  if(mode==='genesis') buildUI();
}

/* interventions on the selected world */
function genThrow(i,kind){
  const b=bodies[i]; if(!b||b.gone) return;
  spawnRogue({target:i,kind,rad:kind==='comet'?0.24:0.3,user:true});
  if(!gen.evoPlaying&&gen.t<gen.tMax){ gen.evoPlaying=true; }
  hud(kind==='comet'?'Comet away — water and organics incoming.':'Asteroid away — brace for it.');
}
function genSeedLife(i){
  const b=bodies[i]; if(!b) return;
  const e=b.evo, L=e.life;
  if(e.kind!=='rocky'){ hud('Nothing to seed on a giant — try one of its moons.'); return; }
  if(L.stage>0){ hud('Life is already here.'); return; }
  const ten=gen.ing.tenacity||0;
  const surf=e.liquid&&e.T>258-14*ten&&e.T<350+12*ten;
  if(!surf&&!e.sub){
    const why=e.regime==='magma'?'its surface is still molten':e.runaway||e.steam?'its oceans are boiling':!e.W||e.W<0.004?'it has no water':e.P<0.008?'it has no air to hold water':e.T<258?'it is frozen solid':'it is too hot';
    hud(`Seeds would die on ${b.name} — ${why}. Try a comet first, or wait.`); return;
  }
  L.chem=L.gate+0.01;
  genLog(e,'Panspermia — spores you sent have taken hold','life');
}

/* the bridge: Genesis world → Planet editor */
function buildSendToGenesis(){

function genOpenInEditor(i){
  const b=bodies[i]; if(!b) return;
  if(b.gen){ gen.send.m=b.gen.m; gen.send.fe=b.gen.fe; gen.send.vol=b.gen.vol; gen.send.W=Math.min(60,b.evo.W||0); }
  openInEditor(i,'genesis');
  hud(`Editing ${b.name} live, as it stands at ${fmtAge(gen.t)}. Your changes are kept as it keeps evolving.`);
}
// the bridge back: whatever is in the editor becomes a world in the running system
function editorWorld(){
  const snap=snapshot();
  const sv=gen.send;
  const m=Math.max(0.02,sv.m), W=Math.max(0,sv.W);
  const fe=Math.max(0.05,Math.min(0.7,sv.fe)), vol=Math.max(0.001,sv.vol);
  const wat=Math.min(0.45,W*1.3*0.0018/m);
  const name=uniqueName((sv.name||'').trim()||(S.name||'').trim()||'Visitor');
  const b={name,world:snap,parent:-1,orbit:{r:sv.au*GEN.AU,speed:0,phase:Math.random()*6.28,incl:0.02},
    scale:Math.max(0.035,Math.min(0.34,0.17*Math.pow(m,0.27)*(1+0.2*Math.min(1,wat*3)))),spin:0.6,accum:null};
  b.gen={kind:'rocky',m,fe,si:Math.max(0.05,1-fe-wat-vol),wat,vol,gasf:0,aAU:sv.au,gi:0,hits:0,tidal:0,imported:true};
  b.basePal=['low','mid','high'].map(k=>hex(snap.colors[k]));
  b.baseOcean=[snap.colors.deep,snap.colors.shallow];
  b.baseAmp=snap.p.amp;
  b.W=W;
  // keep its geography: the editor's own plates and craters seed the evolving ones
  const ov=geoFromP(P);
  const geo=ov?{plates:ov.plates,craters:ov.craters,craterD:ov.craterD}:deriveGeo(snap.seed,snap.p.plateN,snap.p.craterN,snap.p.craterSize);
  b.geoSeed={plates:Array.from(geo.plates),craters:Array.from(geo.craters),craterD:geo.craterD?Array.from(geo.craterD):null,
    nP:ov?MAX_PLATES:snap.p.plateN,nC:ov?MAX_CRATERS:snap.p.craterN};
  return b;
}
function settleEditorWorld(b){
  genInitBody(b,false);
  const e=b.evo, gs=b.geoSeed, r=Math.random;
  e.H=0.12; e.W=b.W; e.Wmax=b.W*0.4; e.Catm=0.01*b.gen.m; e.N2=Math.max(0.05,b.gen.vol*b.gen.m*42);
  e.relief=0.6; e.erosion=0.3;

  for(let i=0;i<gs.nP;i++){ const w=gs.plates[i*4+3]; if(!w&&i>=gs.nP) break;
    if(gs.plates[i*4]===0&&gs.plates[i*4+1]===0&&gs.plates[i*4+2]===0) continue;
    e.plates.push({c:[gs.plates[i*4],gs.plates[i*4+1],gs.plates[i*4+2]],ax:randDir(r),rate:(0.4+r()*1.2)*(r()<0.5?-1:1),w}); }
  if(e.plates.length<4) for(let i=e.plates.length;i<8;i++) e.plates.push({c:randDir(r),ax:randDir(r),rate:0.8,w:-(0.3+r()*0.5)});
  e.craters=[];
  for(let i=0;i<Math.min(gs.nC,MAX_CRATERS);i++){ const rr=gs.craters[i*4+3]; if(rr>0.001)
    e.craters.push({d:[gs.craters[i*4],gs.craters[i*4+1],gs.craters[i*4+2]],r:rr,depth:gs.craterD?gs.craterD[i]||1:1}); }
}
function sendEditorToGenesis(how,target){
  if(gen.phase!=='evolving'){ hud('Form a system in Genesis first.'); return; }
  if(bodies.length>=MAX_BODIES){ hud('This system is full.'); return; }
  if(linkIdx>=0){ syncLink(true); linkIdx=-1; linkRef=null; }
  const b=editorWorld();
  b.orbit.speed=0.49*Math.sqrt(gen.S.GM/Math.pow(b.orbit.r,3));
  if(how==='orbit'){
    bodies.push(b); settleEditorWorld(b);
    genLog(b.evo,`Arrived from the editor and settled at ${gen.send.au.toFixed(2)} AU`,'geo');

  } else {
    const t=bodies[target]; if(!t||t.gone){ hud('Pick a world to aim at.'); return; }

    spawnRogue({target,payload:b,kind:'rock',user:true,rad:0.42,name:b.name});

}

/* drawing the rogues: heads and fading trails, comets with a tail pointed away from the star */
function genDrawRogues(VP){
  if(mode!=='genesis') return;
  const orbiters=genOrbiters();
  if(!rogues.length&&!orbiters.length) return;
  ensureDust();
  const reach=sysReach(); let n=0;
  const put=(p,r,c,h)=>{ if(n>=880) return; const o=n*8; dustData[o]=p[0]; dustData[o+1]=p[1]; dustData[o+2]=p[2]; dustData[o+3]=r;
    dustData[o+4]=c[0]; dustData[o+5]=c[1]; dustData[o+6]=c[2]; dustData[o+7]=h; n++; };
  const base=Math.max(0.03,cam.dist*0.006);
  // satellites and stations: lights circling worlds that have learned to fly
  const now=performance.now()/1000, lite=cam.dist*0.0042;
  for(const o of orbiters){
    const bp=bodyPos(o.b), c=o.col;
    for(let k=0;k<o.n;k++){
      const h1=Math.sin(k*12.9898+o.seed)*43758.5453%1, h2=Math.sin(k*78.233+o.seed)*12543.123%1;
      const rr=o.b.scale*(1.12+Math.abs(h1)*(k%5===0?1.4:0.5)), inc=h2*1.4, ph=k*2.39996+o.seed;
      const w=(0.5+Math.abs(h2))*0.35/Math.sqrt(rr/o.b.scale), a=now*w+ph;
      const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
      put([bp[0]+x,bp[1]+z*Math.sin(inc),bp[2]+z*Math.cos(inc)],lite*(k%7===0?1.5:1.0),vivid(c),-1);
    }
  }
  for(const rg of rogues){
    if(rg.civ){
      // ships and arks: a bright point in the civilisation's colour with an engine wake; a flare at lift-off
      const c=(civOf(rg.civ)||{col:[1,1,1]}).col, s=lite*(rg.kind==='ark'?3.2:2.2);
      if(rg.age<0.8) put(rg.pos,s*(3.4-rg.age*3.5),[3,2.6,2],-1);

/* ── genesis: civilisations, ships and the great silence ──

   Settlements grow from where they land: domes on airless rock,

function civPickTarget(civ,from){

      ctx.lineWidth=Math.max(0.6,R*0.05); ctx.beginPath(); for(let i=0;i<24;i++){ const a=i*Math.PI/12; ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*R,y+Math.sin(a)*R); } ctx.stroke();
      ctx.beginPath(); ctx.arc(x,y,R*0.18,0,Math.PI*2); ctx.fill(); }
    else if(m.t==='hexagram'){ ctx.lineWidth=Math.max(1,R*0.16); for(const s of [1,-1]){ ctx.beginPath(); for(let i=0;i<3;i++){ const a=-s*Math.PI/2+i*Math.PI*2/3; ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*R,y+Math.sin(a)*R); } ctx.closePath(); ctx.stroke(); } }
    else if(m.t==='leaf'){ ctx.beginPath(); LEAF.forEach(([a,b],i)=>ctx[i?'lineTo':'moveTo'](x+a*R,y+b*R)); ctx.closePath(); ctx.fill(); }
    else if(m.t==='ring'){ ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
      ctx.lineWidth=Math.max(1,R*0.16); ctx.save(); ctx.translate(x,y); ctx.rotate(-0.35); ctx.scale(1,0.32);
      ctx.strokeStyle=P(m.k); ctx.beginPath(); ctx.arc(0,0,R*1.75,0,Math.PI*2); ctx.lineWidth=Math.max(2,R*0.5); ctx.stroke();
      ctx.strokeStyle=P(m.c); ctx.lineWidth=Math.max(1,R*0.22); ctx.beginPath(); ctx.arc(0,0,R*1.75,0,Math.PI*2); ctx.stroke(); ctx.restore();
      ctx.beginPath(); ctx.arc(x,y,R,Math.PI*1.05,Math.PI*1.95); ctx.fill(); }
    else if(m.t==='cells'){ const g=[[0,1,0],[0,0,1],[1,1,1]], q=R*0.62; for(let a=0;a<3;a++) for(let b=0;b<3;b++) if(g[b][a]) ctx.fillRect(x+(a-1.5)*q+q*0.08,y+(b-1.5)*q+q*0.08,q*0.84,q*0.84); }
    else if(m.t==='diamond'){ const dx=(W-H*(1-m.s))*0.5*m.s/Math.max(m.s,0.01), dy=H*m.s*0.5; ctx.beginPath(); ctx.moveTo(x-dx,y); ctx.lineTo(x,y-dy); ctx.lineTo(x+dx,y); ctx.lineTo(x,y+dy); ctx.closePath(); ctx.fill(); }
  }
  ctx.restore();
}
const flagCache=new WeakMap();
function flagURL(f,h){
  h=h||24;
  const key=JSON.stringify([f.pal,f.bands,f.over,f.ems,f.aspect])+h;
  let c=flagCache.get(f); if(c&&c.key===key) return c.url;
  const cv=document.createElement('canvas'); const s=2; cv.height=h*s; cv.width=Math.round(h*f.aspect*s);
  const ctx=cv.getContext('2d',{willReadFrequently:true}); drawFlag(ctx,f,cv.width,cv.height);   // a CPU canvas: tiny, and no GPU context to spin up
  const url=cv.toDataURL(); flagCache.set(f,{key,url}); return url;
}
function flagOf(b){ if(!b) return null; if(!b.flag) b.flag=genFlag(b); return b.flag; }
/* the flag editor: shown in the panel for the selected world */
function buildFlagEditor(parent,b){
  const f=flagOf(b);
  const box=el('div','flag-ed');
  const img=document.createElement('img'); img.className='flag-big'; box.appendChild(img);
  const refresh=()=>{ img.src=flagURL(b.flag,60); };
  const prow=el('div','sel','<label>Flag</label>'); const ps=document.createElement('select');
  const o0=document.createElement('option'); o0.value=''; o0.textContent=b.flag.preset?'Earth: '+b.flag.preset:(b.flag.gen?'Made for this world':'Custom'); ps.appendChild(o0);
  const og=document.createElement('optgroup'); og.label='Earth';
  Object.keys(EARTH_FLAGS).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=k; og.appendChild(o); }); ps.appendChild(og);
  ps.onchange=()=>{ if(!ps.value) return; b.flag=JSON.parse(JSON.stringify(EARTH_FLAGS[ps.value])); b.flag.preset=ps.value; flagChanged(b); };
  prow.appendChild(ps); box.appendChild(prow);
  const row=(lab,opts,val,on)=>{ const r=el('div','sel',`<label>${lab}</label>`); const s=document.createElement('select');
    opts.forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; if(v===val) o.selected=true; s.appendChild(o); });
    s.onchange=()=>on(s.value); r.appendChild(s); box.appendChild(r); return s; };
  row('Pattern',FLAG_PATTERNS,f.pattern,v=>{ flagSetPattern(b.flag,v); b.flag.preset=null; b.flag.gen=false; flagChanged(b); });
  row('Emblem',FLAG_EMBLEMS,f.emT||(f.ems.length?'':'none'),v=>{ setEmblem(b.flag,v); b.flag.preset=null; b.flag.gen=false; flagChanged(b); });
  if(b.flag.emScale===undefined){ b.flag.emScale=1; b.flag._emScale=1; }
  if(f.ems.length) sliderRow(box,{l:'Emblem size',min:0.4,max:2,step:0.01},b.flag,'emScale',()=>{
    const k=b.flag.emScale/(b.flag._emScale||1); b.flag._emScale=b.flag.emScale;
    for(const m of b.flag.ems){ if(m.s) m.s*=k; if(m.r) m.r*=k; } refresh(); updateFlagViews(b); });
  // colours: one swatch per palette slot that is actually used
  const used=new Set([...f.bands.c]); f.over.forEach(o=>{ if(o.c!==undefined) [].concat(o.c).forEach(c=>used.add(c)); if(o.inner) used.add(o.inner.c); if(o.c2!==undefined) used.add(o.c2);
    if(o.union){ used.add(o.union.c); used.add(o.union.c2); } if(o.cross) used.add(o.cross.c); }); f.ems.forEach(m=>used.add(m.c));
  const sw=el('div','flag-sw');
  [...used].sort((a,b)=>a-b).forEach(i=>{ const inp=document.createElement('input'); inp.type='color'; inp.value=normHex(f.pal[i]);
    inp.oninput=()=>{ b.flag.pal[i]=inp.value; b.flag.gen=false; refresh(); updateFlagViews(b); };
    inp.onchange=()=>{ saveSystemSoon(); }; sw.appendChild(inp); });
  box.appendChild(sw);
  const bb=el('div','btns');
  const bn=el('button',null,'New design'); bn.title='Roll a fresh flag for this world';
  bn.onclick=()=>{ b.flagRoll=(b.flagRoll||0)+1; const nm=b.name; b.name=nm+'#'+b.flagRoll; b.flag=genFlag(b); b.name=nm; flagChanged(b); };
  const br=el('button',null,'Reset'); br.title='Back to the flag generated for it';
  br.onclick=()=>{ b.flagRoll=0; b.flag=genFlag(b); flagChanged(b); };
  bb.append(bn,br); box.appendChild(bb);
  parent.appendChild(box);
  refresh();
}
function normHex(c){ if(/^#[0-9a-f]{6}$/i.test(c)) return c; if(/^#[0-9a-f]{3}$/i.test(c)) return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]; return toHex(hex(c)); }
function flagChanged(b){ saveSystemSoon(); updateFlagViews(b); buildUI(); }
function updateFlagViews(b){ document.querySelectorAll('img[data-flag]').forEach(im=>{ const i=+im.dataset.flag; if(bodies[i]===b) im.src=flagURL(b.flag,+im.dataset.h||24); }); }

/* ── hover cards: what a world is, at a glance ───────────────── */
const hoverEl=document.createElement('div'); hoverEl.id='hovercard'; document.body.appendChild(hoverEl);
let hoverIdx=-1, hoverT=0, hoverXY=[0,0], hoverRow=null;
function popOf(b){
  const e=b.evo, L=b.life; if(!e||!L||!L.lv) return 0;
  if(b._popT&&performance.now()-b._popT<900) return b._pop;
  let s=0, sd=0; const home=e.civ&&!e.civ.dead;
  for(let i=0;i<L.city.length;i++){ const c=L.city[i]; if(c&&c<255) s+=L.lv[i]/255; }
  const R=Math.pow(Math.max(0.01,b.gen?b.gen.m:1),0.27);
  const area=510e6*R*R/(L.W*L.H);
  b._pop=s*area*(home?2600:320); b._popT=performance.now();
  return b._pop;
}
function fmtPop(n){ if(n<1) return 'none'; if(n<1e3) return Math.round(n)+''; if(n<1e6) return (n/1e3).toFixed(n<1e4?1:0)+' thousand'; if(n<1e9) return (n/1e6).toFixed(n<1e7?1:0)+' million'; return (n/1e9).toFixed(n<1e10?1:0)+' billion'; }
function hoverHTML(b,i){
  const f=flagOf(b);
  const e=b.evo;
  let head=`<div class="hc-h"><img src="${flagURL(f,22)}"><div><b>${b.name}</b><small>${e?(b.gone?'Engulfed':e.era||''):(b.parent>=0?'moon of '+bodies[b.parent].name:'world')}</small></div></div>`;
  if(!e) return head+`<div class="hc-r"><span>Made in</span><b>the Planet editor</b></div><p class="hc-n">No history yet — send it into Genesis to give it one.</p>`;
  const rows=[], R=(k,v)=>rows.push(`<div class="hc-r"><span>${k}</span><b>${v}</b></div>`);
  const L=e.life;
  if(e.kind==='rocky'){
    const gases=[['CO₂',e.Pco2||0],['N₂',e.N2],['O₂',e.O2],['H₂O',e.H2O],['CH₄',e.CH4]].filter(x=>x[1]>0.0005).sort((a,b)=>b[1]-a[1]);
    const ice=e.ice>0.9?'frozen over':e.seaIce>0.4?'big ice caps':e.seaIce>0.1?'polar ice':'';
    R('Climate',`${Math.round(e.T-273)}°C · `+(e.P<0.001?'no air':(e.P<1?e.P.toFixed(2):e.P.toFixed(1))+' bar '+gases.slice(0,2).map(x=>x[0]).join('/'))+
      (e.W>0.004?` · ${e.liquid?Math.round(e.ocean*100)+'% ocean':'ice'}`:' · dry')+(ice?' · '+ice:''));
    R('Geology',{magma:'magma ocean',plates:'plate tectonics',lid:'stagnant lid'}[e.regime]+(e.mag?' · magnetic field':' · no field')+` · ${e.nImp} impacts`);
    R('Evolution',L.stage===0?(L.gone?'life went extinct':'lifeless'):['','microbes','photosynthesis','land life','animals','cities','spacefaring'][L.stage]+(L.sub?' under the ice':'')+(b.life&&b.life.species.length?` · ${b.life.species.length} species`:''));
    const pop=popOf(b);
    const cs=civSummary(e);
    R('Population',pop>0?'≈ '+fmtPop(pop)+(cs?' · '+cs:''):(L.ruins&&!e.civ&&!(e.colony&&!e.colony.dead)?'none — only ruins remain':cs?cs:(L.stage>=4?'wild animals only':'nobody')));
  } else {
    const moons=bodies.filter(o=>o.parent>=0&&bodies[o.parent]===b&&!o.gone).length;
    R('Type',kindName(b)+' · '+fmtM(b.gen.m)+' M⊕');
    R('Climate',`${Math.round(e.T-273)}°C cloud tops`);
    R('Moons',moons||'none');
  }
  const evs=gen.log.filter(x=>x.who===b.name&&x.kind!=='species').slice(0,3);
  const ev=evs.length?`<div class="hc-ev">${evs.map(x=>`<div><b>${fmtAge(x.t)}</b> ${x.txt}</div>`).join('')}</div>`:'';
  return head+rows.join('')+ev;
}
function hoverUpdate(force){
  if(hoverIdx<0||(dragging&&!hoverPin)||(mode!=='genesis'&&mode!=='system')){ hoverEl.style.display='none'; return; }
  const b=bodies[hoverIdx]; if(!b||b.gone){ hoverEl.style.display='none'; return; }
  const now=performance.now();
  if(force||now-hoverT>400){ hoverT=now; hoverEl.innerHTML=hoverHTML(b,hoverIdx); }
  hoverEl.style.display='block';
  const W=window.innerWidth, H=window.innerHeight, r=hoverEl.getBoundingClientRect();
  let x=hoverXY[0]+18, y=hoverXY[1]+14;
  if(x+r.width>W-8) x=hoverXY[0]-r.width-18;
  if(y+r.height>H-8) y=Math.max(8,H-r.height-8);
  hoverEl.style.left=x+'px'; hoverEl.style.top=y+'px';
}
let hoverPend=0;
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse') return;
  if(dragging||(mode!=='genesis'&&mode!=='system')){ hoverIdx=-1; hoverUpdate(); return; }
  hoverXY=[e.clientX,e.clientY];
  if(hoverPend) return;
  hoverPend=requestAnimationFrame(()=>{ hoverPend=0;
    const t=(mode==='genesis'&&gen.phase!=='evolving')?null:pickAt(hoverXY[0],hoverXY[1]);
    const ni=t&&t.kind==='body'?t.n:-1;
    const changed=ni!==hoverIdx; hoverIdx=ni; hoverUpdate(changed);
    canvas.style.cursor=ni>=0?'pointer':''; });
});
canvas.addEventListener('pointerleave',e=>{ if(e.pointerType!=='mouse'||hoverPin) return; hoverIdx=-1; hoverUpdate(); });
setInterval(()=>{ if(hoverRow&&!hoverRow.isConnected){ hoverRow=null; hoverIdx=-1; } if(hoverIdx>=0||hoverEl.style.display==='block') hoverUpdate(); },500);

/* ── boot ─────────────────────────────────────────────────── */
buildSphere(S.subdiv);
meshSys=makeSphere(5);
meshRock=makeSphere(2);
buildParticles(S.pCount);
buildAccum(S.accumSize);
loadPersisted();
if(!load('system')) loadSolarSystem(true);
genReset();
mode='genesis'; cam.tDist=gen.S.rout*1.75; cam.tTarget=[0,0,0]; cam.pitch=0.72;
resize();
buildUI();
requestAnimationFrame(loop);
</script>
