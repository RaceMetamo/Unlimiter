<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive check — Unlimiter</title>
<style>
  :root{
    --stage:#16181a;--panel:#1e2124;--panel-2:#24282b;--line:#2e3338;
    --text:#e8e6e1;--dim:#8d9490;--accent:#7fd1c0;--hot:#e0714f;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--stage);color:var(--text);font-family:var(--sans);font-size:13px;display:flex;overflow:hidden}
  #left{flex:1;min-width:0;display:flex;flex-direction:column}
  #head{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  #head h1{margin:0;font-size:15px;font-weight:600}
  #head span{color:var(--dim);font-weight:400}
  #scopeWrap{flex:1;min-height:0;padding:20px;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;background:#0e1011;border:1px solid var(--line)}
  #panel{width:352px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px}
  #panel::-webkit-scrollbar{width:9px}
  #panel::-webkit-scrollbar-thumb{background:#33383c;border-radius:9px}
  .hint{color:var(--dim);font-size:12px;padding:0 20px 14px;line-height:1.55}
  .hint b{color:var(--text);font-weight:600}
</style>
</head>
<body>
<div id="left">
  <div id="head"><h1>Drive check <span>— audio, MIDI and clock, on their own</span></h1></div>
  <div class="hint">Every source in the drive layer, drawn live. Use it to set levels and confirm
    MIDI clock before you load a heavy tool. Must be served over <b>http://localhost</b> or https —
    the microphone and WebMIDI do not work from a file:// URL.</div>
  <div id="scopeWrap"><canvas id="scope" width="900" height="560"></canvas></div>
</div>
<div id="panel"></div>

<script src="unlimiter-drive.js"></script>
<script>
"use strict";
const panel=document.getElementById("panel");
if(!window.UnlimiterDrive){
  panel.innerHTML='<div style="color:#e0714f">unlimiter-drive.js not found — it must sit in this same folder.</div>';
} else {
  const Drive=UnlimiterDrive.create({});
  Drive.mountPanel(panel);

  const ROWS=[
    ["audio.low","Audio low"],["audio.mid","Audio mid"],["audio.high","Audio high"],
    ["audio.level","Audio level"],["audio.onset","Onset"],
    ["clock.beat","Beat ramp"],["clock.beatPulse","Beat pulse"],
    ["clock.bar","Bar ramp"],["clock.barPulse","Bar pulse"],
    ["random.beat","Random/beat"],
    ["lfo.0","LFO 1"],["lfo.1","LFO 2"],["lfo.2","LFO 3"],["lfo.3","LFO 4"]
  ];
  const cv=document.getElementById("scope"), cx=cv.getContext("2d");
  const hist=ROWS.map(()=>new Float32Array(cv.width).fill(0));

  function draw(){
    const W=cv.width,H=cv.height;
    const rowH=H/ROWS.length;
    cx.fillStyle="#0e1011"; cx.fillRect(0,0,W,H);
    ROWS.forEach((r,i)=>{
      const h=hist[i];
      h.copyWithin(0,1);
      h[W-1]=Drive.sourceValue(r[0]);
      const y0=i*rowH, mid=y0+rowH/2;
      cx.strokeStyle="#22272a"; cx.beginPath();
      cx.moveTo(0,mid); cx.lineTo(W,mid); cx.stroke();
      cx.strokeStyle = r[0].startsWith("audio") ? "#7fd1c0"
                     : r[0].startsWith("clock") ? "#e0c46f" : "#b98cd9";
      cx.lineWidth=1.25; cx.beginPath();
      for(let x=0;x<W;x++){
        const v=h[x];
        const y=mid - v*(rowH*0.42);
        if(x===0) cx.moveTo(x,y); else cx.lineTo(x,y);
      }
      cx.stroke();
      cx.fillStyle="#8d9490"; cx.font="11px ui-monospace,monospace";
      cx.fillText(r[1],8,y0+13);
      cx.fillStyle="#e8e6e1";
      cx.fillText(h[W-1].toFixed(2), W-40, y0+13);
    });
    requestAnimationFrame(draw);
  }
  draw();
}
</script>
</body>
</html>
