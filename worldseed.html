  }
  const sb=section('Stars',true);
  const cr=el('div','sel','<label for="nstars">How many stars</label>');
  const cs=document.createElement('select'); cs.id='nstars';
  cs.innerHTML=[[1,'One'],[2,'Binary'],[3,'Triple'],[4,'Quadruple']]
    .map(([v,l])=>`<option value="${v}"${stars.length===v?' selected':''}>${l}</option>`).join('');
  cs.onchange=()=>setStarCount(parseInt(cs.value,10));
  cr.appendChild(cs); sb.appendChild(cr);

  if(stars.length>1){
    const ar=el('div','sel','<label for="starmode">Arrangement</label>');
    const as=document.createElement('select'); as.id='starmode';
    as.innerHTML=`<option value="hier"${multi.mode==='hier'?' selected':''}>Hierarchical</option>`+
                 `<option value="ring"${multi.mode==='ring'?' selected':''}>Trapezium</option>`;
    as.onchange=()=>{ multi.mode=as.value; spaceStars(); saveSystem(); buildUI(); };
    ar.appendChild(as); sb.appendChild(ar);
    sb.appendChild(el('p','note', multi.mode==='hier'
      ? (stars.length>3 ? 'Two tight pairs circling each other \u2014 the arrangement real quadruple systems settle into.'
        : stars.length>2 ? 'A tight pair on one side, a lone star on the other, like Alpha Centauri with Proxima.'
        : 'Both stars circle the barycentre at the centre.')
      : 'Every star shares one ring around the centre. Pretty, though nothing like it stays stable for long.'));
    sliderRow(sb,{l:'Separation',min:0.4,max:20,step:0.01},multi,'sep',saveSystem);
    if(!(multi.mode==='ring'&&stars.length>2))
      sliderRow(sb,{l:'Mass balance',min:0.05,max:0.95,step:0.005},multi,'ratio',saveSystem);
    sliderRow(sb,{l:'Orbit speed',min:-1.5,max:1.5,step:0.005},multi,'speed',saveSystem);
    sliderRow(sb,{l:'Inclination',min:-0.9,max:0.9,step:0.005},multi,'incl',saveSystem);
    if(multi.mode==='hier'&&stars.length>2){
      sliderRow(sb,{l:'Pair separation',min:0.1,max:6,step:0.01},multi,'innerSep',saveSystem);
      sliderRow(sb,{l:'Pair speed',min:-3,max:3,step:0.005},multi,'innerSpeed',saveSystem);
      sliderRow(sb,{l:'Pair tilt',min:-1.5,max:1.5,step:0.005},multi,'innerIncl',saveSystem);
    }
    const bq=el('div','btns');
    const bcl=el('button',null,'Warm / cool mix');
    bcl.onclick=()=>{
      const pal=[['#ffd0a8','#ff6a2c',1.4],['#cfe2ff','#6f9bd8',1.2],
                 ['#ffd8d8','#c4483c',1.0],['#efe6ff','#8f7ad0',0.95]];
      stars.forEach((st,i)=>{ st.color=pal[i][0]; st.color2=pal[i][1]; st.intensity=pal[i][2]; });
      saveSystem(); buildUI(); };
    const bsw=el('button',null,'Shuffle sizes');
    bsw.onclick=()=>{ stars.forEach((st,i)=>{ st.radius=+(0.35+Math.random()*(i?0.7:1.1)).toFixed(2); });
      spaceStars(); saveSystem(); buildUI(); };
    const bsp=el('button',null,'Space them out');
    bsp.title='Push the orbits apart until no two stars overlap';
    bsp.onclick=()=>{ spaceStars(); saveSystem(); buildUI(); hud('Orbits spaced so nothing overlaps.'); };
    bq.append(bcl,bsw,bsp); sb.appendChild(bq);
  }

  stars.forEach((st,i)=>{
    if(i===0){ starBlock(sb,st,'st0'); return; }
    const box=el('div','modslot');
    const hd=el('div','item');
    const dot=el('div','dot'); dot.style.background=st.color;
    const nm=el('span','nm'); nm.textContent=st.name||('Star '+(i+1));
    hd.append(dot,nm); box.appendChild(hd);
    starBlock(box,st,'st'+i);
    sb.appendChild(box);
  });

  const pb=section('Planets in orbit',true);
  if(!bodies.length) pb.appendChild(el('p','note','No planets yet. Build one in Planet mode and press “Send to system”, or use “Send current planet” below. Once a planet is here, its “+ Moon” button drops a random moon into orbit around it.'));
  bodyOrder().forEach(({i,lvl,kids})=>{
    const b=bodies[i];
    const it=el('div','item'+(i===selIdx?' on sel':'')+(lvl?' kid':''));
    if(lvl) it.style.marginLeft=(lvl*13)+'px';
    const tw=el('button','twist',kids?(collapsed.has(b.name)?'▸':'▾'):'');
    tw.title=kids?(collapsed.has(b.name)?'Show moons':'Hide moons'):'';
    if(!kids){ tw.disabled=true; tw.style.visibility='hidden'; }
    tw.onclick=()=>{ if(collapsed.has(b.name)) collapsed.delete(b.name); else collapsed.add(b.name); buildUI(); };
    const dot=el('div','dot'); dot.style.background=b.world.colors.mid;
    if(lvl){ dot.style.width='7px'; dot.style.height='7px'; }
    const nm=document.createElement('input');
    nm.type='text'; nm.className='nm nmin'; nm.value=b.name; nm.spellcheck=false;
    nm.title='Click to rename';
    if(i===linkIdx) nm.style.color='var(--hot)';
    nm.oninput=()=>{ b.name=nm.value; saveSystemSoon(); };
    nm.onblur=()=>{
      const old=b.name;
      const clean=(nm.value||'').trim()||(lvl?'Moon':'Planet');
      b.name=clean; nm.value=clean;
      if(collapsed.has(old)&&old!==clean){ collapsed.delete(old); collapsed.add(clean); }
      saveSystem(); buildUI();
    };
    nm.onkeydown=e=>{ if(e.key==='Enter') nm.blur(); };
    const cnt=kids&&collapsed.has(b.name)?el('span','cnt',String(kids)):null;
    const bsel=el('button',null,i===selIdx?'Hide':'Edit');
    bsel.onclick=()=>{ selIdx=(i===selIdx?-1:i); buildUI(); };
    const bmoon=el('button',null,'+ Moon');
    bmoon.title='Add a random moon to '+b.name;
    bmoon.onclick=()=>{ randomMoon(i); hud('Added a moon to '+b.name+'.'); };
    const bf=el('button',null,'Focus');
    bf.onclick=()=>{ focusIdx=(focusIdx===i?-1:i); cam.tDist=focusIdx===i?Math.max(0.9,b.scale*4.5):18; buildUI(); };
    const bx=el('button',null,'✕');
    bx.onclick=()=>{
      bodies.splice(i,1);
      bodies.forEach(o=>{ const pi=(o.parent===undefined?-1:o.parent);
        o.parent = pi===i ? -1 : (pi>i?pi-1:pi); });
      linkIdx = linkIdx===i ? -1 : (linkIdx>i?linkIdx-1:linkIdx);
      if(focusIdx>=bodies.length) focusIdx=-1; selIdx=-1; saveSystem(); buildUI(); };
    it.append(tw,dot,nm);
    if(cnt) it.appendChild(cnt);
    it.append(bmoon,bsel,bf,bx);
    pb.appendChild(it);
    if(i===selIdx){
      const box=el('div','modslot');
      const prow=el('div','sel','<label>Orbits</label>');
      const ps=document.createElement('select');
      ps.innerHTML=`<option value="-1">${(stars[0].name||'Star')}</option>`+
        bodies.map((o,j)=>j===i?'':`<option value="${j}"${(b.parent===j)?' selected':''}>${o.name}</option>`).join('');
      ps.value=String(b.parent===undefined?-1:b.parent);
      ps.onchange=()=>{
        const v=parseInt(ps.value,10);
        b.parent=v;
        if(v>=0&&bodies[v]){ b.orbit.r=Math.min(b.orbit.r,bodies[v].scale*4); b.orbit.speed=Math.max(Math.abs(b.orbit.speed),0.9)*Math.sign(b.orbit.speed||1); }
        saveSystem(); buildUI();
      };
      prow.appendChild(ps); box.appendChild(prow);
      sliderRow(box,{l:'Orbit radius',min:0.05,max:40,step:0.01},b.orbit,'r',saveSystem);
      sliderRow(box,{l:'Orbit speed',min:-1,max:1,step:0.002},b.orbit,'speed',saveSystem);
      sliderRow(box,{l:'Inclination',min:-0.8,max:0.8,step:0.002},b.orbit,'incl',saveSystem);
      sliderRow(box,{l:'Size',min:0.03,max:1.2,step:0.005},b,'scale',saveSystem);
      sliderRow(box,{l:'Axial tilt',min:-3.15,max:3.15,step:0.005},b.world.p,'tilt',saveSystem);
      sliderRow(box,{l:'Day length',min:-2,max:2,step:0.005},b,'spin',saveSystem);
      const bb=el('div','btns');
      const bm=el('button',null,'Add current as moon');
      bm.onclick=()=>addBodyFromCurrent('',true,i);
      const brm=el('button',null,'Random moon');
      brm.onclick=()=>randomMoon(i);
      bb.append(bm,brm); box.appendChild(bb);

      const wp=(id)=>sliderRow(box,DEF(id),b.world.p,id,saveSystem);
      const wchk=(id,lbl)=>checkbox(box,lbl||DEF(id).l,()=>num(b.world.p[id],0)>0.5,
        v=>{ b.world.p[id]=v?1:0; saveSystem(); buildUI(); });

      box.appendChild(el('p','subhead','Shape'));
      wp('amp'); wp('lump'); wp('lumpScale'); wp('oblate'); wp('elong');
      wp('craterN'); wp('craterDepth');
      const sd=el('div','btns');
      const bsd=el('button',null,'Reroll surface');
      bsd.onclick=()=>{ b.world.seed=Math.floor(Math.random()*9999); saveSystem(); hud(b.name+' reshaped.'); };
      sd.appendChild(bsd); box.appendChild(sd);

      box.appendChild(el('p','subhead','Face'));
      wchk('faceOn','Give it a face');
      if(num(b.world.p.faceOn,0)>0.5){
        const mr=el('div','sel','<label>Expression</label>');
        const msel=document.createElement('select');
        msel.innerHTML='<option value="">Choose…</option>'+Object.keys(MOODS).map(k=>`<option>${k}</option>`).join('');
        msel.onchange=()=>{ const m=MOODS[msel.value]; if(!m) return;
          for(const k in m) b.world.p[k]=m[k]; saveSystem(); buildUI(); };
        mr.appendChild(msel); box.appendChild(mr);
        wp('eyes');
        const er=el('div','sel','<label>Eye arrangement</label>');
        const es2=document.createElement('select');
        es2.innerHTML=DEF('eyeLayout').sel.map((o,j)=>`<option value="${j}"${Math.round(num(b.world.p.eyeLayout,0))===j?' selected':''}>${o}</option>`).join('');
        es2.onchange=()=>{ b.world.p.eyeLayout=parseInt(es2.value,10); saveSystem(); };
        er.appendChild(es2); box.appendChild(er);
        wp('faceSize'); wp('faceLat'); wp('faceLon');
        wp('mouthCurve'); wp('mouthOpen'); wp('eyeSize'); wp('eyeSpace'); wp('eyeJitter');
        wchk('browOn','Eyebrows');
        box.appendChild(el('p','subhead','Voice'));
        wchk('sing','Sing along with the mic');
        if(num(b.world.p.sing,0)>0.5){
          const vr=el('div','sel','<label>Listens to</label>');
          const vs=document.createElement('select');
          vs.innerHTML=DEF('singSrc').sel.map((o,j)=>`<option value="${j}"${Math.round(num(b.world.p.singSrc,0))===j?' selected':''}>${o}</option>`).join('');
          vs.onchange=()=>{ b.world.p.singSrc=parseInt(vs.value,10); saveSystem(); };
          vr.appendChild(vs); box.appendChild(vr);
          wp('singAmount'); wp('singBounce');
        }
      }
      box.appendChild(el('p','subhead','Editor'));
      const bb2=el('div','btns');
      const be=el('button',null,'Open in editor');
      be.onclick=()=>openInEditor(i);
      const bu=el('button',null,'Copy editor onto this');
      bu.onclick=()=>{ b.world=snapshot(); copyTex(accum.tex,bodyAccum(b),BODY_ACC,BODY_ACC/2); saveSystem(); buildUI(); hud('“'+b.name+'” now matches the editor.'); };
      bb2.append(be,bu); box.appendChild(bb2);
      if(lvl) box.style.marginLeft=(lvl*13)+'px';
      pb.appendChild(box);
    }
  });
  const b4=el('div','btns');
  const bAdd=el('button',null,'Send current planet');
  bAdd.onclick=()=>addBodyFromCurrent('',true);
  const bWide=el('button',null,'View whole system');
  bWide.onclick=()=>{ focusIdx=-1; cam.tDist=Math.max(14,(bodies.reduce((m,b)=>Math.max(m,b.orbit.r),6))*2.1); buildUI(); };
  b4.append(bAdd,bWide); pb.appendChild(b4);

  const ab=section('Asteroid belts',belts.length>0);
  ab.appendChild(el('p','note','Belts are drawn as one instanced batch of tumbling rocks, so the count costs almost nothing.'));
  belts.forEach((bl,i)=>{
    const it=el('div','item');
    const dot=el('div','dot'); dot.style.background=bl.cA||'#8d8478';
    const nm=el('span','nm'); nm.textContent='Belt '+(i+1)+' · r '+num(bl.r,9).toFixed(1);
    const bx=el('button',null,'✕');
    bx.onclick=()=>{ belts.splice(i,1); saveSystem(); buildUI(); };
    it.append(dot,nm,bx); ab.appendChild(it);
    const box=el('div','modslot');
    sliderRow(box,{l:'Distance',min:1,max:40,step:0.05},bl,'r',saveSystem);
    sliderRow(box,{l:'Width',min:0.1,max:14,step:0.05},bl,'width',saveSystem);
    sliderRow(box,{l:'Rocks',min:10,max:900,step:10,int:true},bl,'count',saveSystem);
    sliderRow(box,{l:'Rock size',min:0.005,max:0.3,step:0.002},bl,'size',saveSystem);
    sliderRow(box,{l:'Size variation',min:0,max:3,step:0.01},bl,'sizeVar',saveSystem);
    sliderRow(box,{l:'Thickness',min:0,max:1.2,step:0.005},bl,'incl',saveSystem);
    sliderRow(box,{l:'Orbit speed',min:-1,max:1,step:0.002},bl,'speed',saveSystem);
    sliderRow(box,{l:'Tumble',min:0,max:3,step:0.01},bl,'spin',saveSystem);
    sliderRow(box,{l:'Rock lumpiness',min:0,max:1,step:0.005},bl,'lump',saveSystem);
    const sw2=el('div','sw');
    [['cA','Rock light'],['cB','Rock dark']].forEach(([k,lbl])=>{
      const cell=el('div');
      const ci=document.createElement('input'); ci.type='color'; ci.value=bl[k]||'#8d8478'; ci.id='bl'+i+k;
      ci.oninput=()=>{ bl[k]=ci.value; saveSystem(); };
      const cl=el('label'); cl.textContent=lbl; cl.htmlFor='bl'+i+k;
      cell.append(ci,cl); sw2.appendChild(cell);
    });
    box.appendChild(sw2);
    const rs=el('div','btns');
    const br=el('button',null,'Reshuffle rocks');
    br.onclick=()=>{ bl.seed=Math.floor(Math.random()*9999); saveSystem(); };
    rs.appendChild(br); box.appendChild(rs);
    ab.appendChild(box);
  });
  if(belts.length<MAX_BELTS){
    const bb2=el('div','btns');
    const ba=el('button',null,'Add a belt');
    ba.onclick=()=>{ const nb=newBelt();
      if(bodies.length) nb.r=Math.max(2,bodies.reduce((m,b)=>Math.max(m,b.orbit.r),4)*0.7);
      belts.push(nb); saveSystem(); buildUI(); };
    bb2.appendChild(ba); ab.appendChild(bb2);
  }

  const lb=section('Saved planets',library.length>0);
  if(!library.length) lb.appendChild(el('p','note','Save planets in Planet mode to drop them into orbit here.'));
  library.forEach(entry=>{
    const it=el('div','item');
    const dot=el('div','dot'); dot.style.background=entry.colors.mid;
    const nm=el('span','nm'); nm.textContent=entry.name;
    const bo=el('button',null,'Add to orbit');
    bo.onclick=()=>{ const keep=snapshot(); restore(entry); addBodyFromCurrent(entry.name,false,-1); restore(keep); buildUI(); };
    it.append(dot,nm,bo); lb.appendChild(it);
  });

  const kb=section('Background',false);
  kb.appendChild(el('p','note','The sky is generated, not an image — nebula clouds come from noise warped through itself, so they drift and never repeat.'));
  const kr=el('div','sel','<label for="skyp">Preset</label>');
  const ks=document.createElement('select'); ks.id='skyp';
  ks.innerHTML='<option value="">Choose…</option>'+Object.keys(SKY_PRESETS).map(k=>`<option>${k}</option>`).join('');
  ks.onchange=()=>{ const p=SKY_PRESETS[ks.value]; if(!p) return;
    Object.assign(sky,{neb:0,den:0.55,scale:1.35,con:0.45,drift:0.01,milky:0,starDen:46,starWarm:0.5},p);
    saveSystem(); buildUI(); };
  kr.appendChild(ks); kb.appendChild(kr);
  sliderRow(kb,{l:'Nebula strength',min:0,max:2,step:0.005},sky,'neb',saveSystem);
  if(sky.neb>0){
    sliderRow(kb,{l:'Cloud coverage',min:0.02,max:0.95,step:0.005},sky,'den',saveSystem);
    sliderRow(kb,{l:'Cloud scale',min:0.3,max:4,step:0.01},sky,'scale',saveSystem);
    sliderRow(kb,{l:'Edge softness',min:0,max:1,step:0.005},sky,'con',saveSystem);
    sliderRow(kb,{l:'Drift',min:0,max:0.15,step:0.0005},sky,'drift',saveSystem);
    sliderRow(kb,{l:'Galactic band',min:0,max:1.2,step:0.005},sky,'milky',saveSystem);
  }
  sliderRow(kb,{l:'Star density',min:8,max:110,step:1,int:true},sky,'starDen',saveSystem);
  sliderRow(kb,{l:'Star warmth',min:0,max:1,step:0.005},sky,'starWarm',saveSystem);
  sliderRow(kb,DEF('stars'),P,'stars');
  const ksw=el('div','sw');
  [['space','Sky'],['c1','Cloud 1'],['c2','Cloud 2'],['c3','Core glow']].forEach(([k,lbl])=>{
    const cell=el('div');
    const ci=document.createElement('input'); ci.type='color'; ci.value=sky[k]; ci.id='sky_'+k;
    ci.oninput=()=>{ sky[k]=ci.value; saveSystemSoon(); };
    const cl=el('label'); cl.textContent=lbl; cl.htmlFor='sky_'+k;
    cell.append(ci,cl); ksw.appendChild(cell);
  });
  kb.appendChild(ksw);

  const vb=section('View',false);
  for(const id of ['kuwahara','outline','sat','contrast']) sliderRow(vb,DEF(id),P,id);
  if(S.rings===undefined) S.rings=true;
  if(S.labels===undefined) S.labels=true;
  checkbox(vb,'Orbit paths',()=>S.rings,v=>{S.rings=v;});
  checkbox(vb,'Name labels',()=>S.labels,v=>{S.labels=v;});
  const b5=el('div','btns');
  [['Save PNG',1],['Save 2×',2],['Save 4×',4]].forEach(([l,s3])=>{
    const b=el('button',null,l); b.onclick=()=>saveFrame(s3*S.resScale); b5.appendChild(b); });
  recordButton(b5);
  const bExp=el('button',null,'Export system');
  bExp.onclick=()=>downloadJSON({library,system:{stars,multi,sky,belts,bodies:bodies.map(b=>({name:b.name,world:b.world,orbit:b.orbit,scale:b.scale,spin:b.spin,parent:(b.parent===undefined?-1:b.parent)}))}},'worldseed-system.json');
  b5.appendChild(bExp);
  vb.appendChild(b5);
}

function setMode(m){
  if(mode==='planet'&&m==='system') syncLink(true);
  mode=m;
  if(m==='system'){ cam.tDist=Math.max(14,(bodies.reduce((x,b)=>Math.max(x,b.orbit.r),6))*2.1); cam.pitch=0.45; }
  else { cam.tDist=3.1; cam.tTarget=[0,0,0]; focusIdx=-1; }
  buildUI();
}
document.getElementById('mPlanet').onclick=()=>setMode('planet');
document.getElementById('mSystem').onclick=()=>setMode('system');

let hudTimer;
function hud(msg){
  const h=document.getElementById('hud'); h.textContent=msg;
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>h.textContent='Drag to orbit, scroll to zoom.',4500);
}
document.getElementById('toggle').onclick=e=>{
  const ui=document.getElementById('ui'); ui.classList.toggle('hidden');
  e.target.textContent=ui.classList.contains('hidden')?'Show panel':'Hide panel';
};

/* ── boot ─────────────────────────────────────────────────── */
buildSphere(S.subdiv);
meshSys=makeSphere(5);
meshRock=makeSphere(2);
buildParticles(S.pCount);
buildAccum(S.accumSize);
loadPersisted();
resize();
buildUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
