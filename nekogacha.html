<title>Neko Gacha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed WebGL stage, logo top-left, knob bottom-centre, edit deck docked right (bottom sheet on phones). */
:root{
  --ink:#1b1440;        /* deep indigo outlines + text */
  --paper:#fffdf8;      /* panel surface */
  --paper-2:#f3efff;    /* inset fields */
  --pink:#ff3d8b;       /* primary accent / knob */
  --blue:#2f5bff;       /* secondary accent */
  --sun:#ffd23f;        /* highlight */
  --muted:#6b6391;
  --sky:#bfe9ff;
  --f-display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Trebuchet MS",system-ui,sans-serif;
  --f-data:"DotGothic16","Courier New",monospace;
  --panel-w:340px;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* logo */
.logo{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none;user-select:none}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:.9;letter-spacing:.01em;color:var(--paper);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink),0 0 0 var(--ink);transform:rotate(-3deg);transform-origin:left}
.logo h1 span{color:var(--pink)}
.logo .sub{display:flex;gap:8px;align-items:center;margin-top:8px;font-family:var(--f-data);font-size:13px}
.tag{background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:99px;letter-spacing:.06em}
.tag.alt{background:var(--sun);color:var(--ink);border:2px solid var(--ink);padding:0 8px}

/* knob */
.knobwrap{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px}
#roll{width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle at 35% 30%,#ff8fbf 0 18%,var(--pink) 45%,#c8125f 100%);
  box-shadow:0 6px 0 var(--ink);cursor:pointer;position:relative;transition:transform .12s}
#roll::before{content:"";position:absolute;left:50%;top:50%;width:66px;height:18px;margin:-9px 0 0 -33px;border-radius:9px;background:var(--paper);border:3px solid var(--ink);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
#roll.turn::before{transform:rotate(180deg)}
#roll:hover{transform:translateY(-2px)}
#roll:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#roll:disabled{filter:saturate(.4) brightness(.95);cursor:default}
.knoblabel{font-family:var(--f-display);font-size:15px;color:var(--paper);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;letter-spacing:.08em}

/* tap prompt */
#tap{position:fixed;z-index:4;pointer-events:none;font-family:var(--f-display);font-size:30px;color:var(--sun);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;
  transform:translate(-50%,-100%);animation:bob .6s ease-in-out infinite alternate;white-space:nowrap}
@keyframes bob{to{transform:translate(-50%,-125%) rotate(-4deg)}}

/* flash */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7;transition:opacity .5s}
#flash.on{opacity:.9;transition:none}

/* result card */
#card{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));top:50%;width:min(300px,calc(100vw - 32px));
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:14px 16px 16px;
  transform:translate(-120%,-50%) rotate(-4deg);transition:transform .5s cubic-bezier(.3,1.5,.5,1);}
#card.show{transform:translate(0,-50%) rotate(-2deg)}
#card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-family:var(--f-display);font-size:20px;padding:2px 12px;border-radius:10px;border:3px solid var(--ink);background:var(--tier,#6fb6ff);color:var(--ink)}
.badge.secret{background:linear-gradient(90deg,#ff5fa2,#ffd23f,#3dffb6,#5e8bff,#c77dff);animation:hue 2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.stars{font-size:18px;letter-spacing:2px;color:var(--sun);-webkit-text-stroke:1px var(--ink)}
.no{font-family:var(--f-data);font-size:13px;color:var(--muted)}
#card h2{margin:10px 0 0;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;text-wrap:balance}
#card .species{margin:4px 0 10px;font-weight:800;color:var(--blue)}
.traits{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.traits span{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:2px solid var(--ink);background:var(--paper-2)}
.traits span.t2{background:#e6dcff}.traits span.t3{background:#fff1b8}.traits span.t4{background:#ffd1e6}
.row{display:flex;gap:8px}
.btn{flex:1;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:8px 10px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.hot{background:var(--sun)}

/* panel */
#panel{position:fixed;z-index:8;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:var(--panel-w);
  background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;transition:transform .4s cubic-bezier(.3,1.2,.5,1)}
#panel.closed{transform:translateX(calc(100% + 40px))}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:3px solid var(--ink)}
.phead b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.04em}
.phead .meta{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.pbody{overflow-y:auto;padding:4px 14px 16px;min-height:0;flex:1;overscroll-behavior:contain}
.sec{border-bottom:2px dashed #d9d2f2;padding:12px 0}
.sec:last-child{border-bottom:0}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sechead h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.lock{border:2px solid var(--ink);background:var(--paper);border-radius:8px;font-size:11px;font-weight:800;padding:1px 8px;cursor:pointer;letter-spacing:.06em}
.lock[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
.field{margin:8px 0}
.flabel{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
.flabel output{font-family:var(--f-data);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:2px solid var(--ink);background:var(--paper);border-radius:99px;padding:3px 10px 3px 8px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--t,#9cc9ff);border:1.5px solid var(--ink)}
.chip[aria-pressed="true"]{background:var(--pink);color:var(--paper)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);cursor:pointer;position:relative;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.sw.t3::after,.sw.t4::after{content:"";position:absolute;right:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--sun);border:1.5px solid var(--ink)}
.sw.t4::after{background:var(--pink)}
input[type=range]{width:100%;accent-color:var(--pink)}
.codebox{display:flex;gap:6px}
.codebox input{flex:1;min-width:0;font-family:var(--f-data);font-size:14px;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;background:var(--paper-2);color:var(--ink)}
.codebox .btn{flex:0 0 auto;padding:6px 10px;font-size:12px}
.note{font-size:11px;color:var(--muted);margin-top:5px;min-height:1em}
.toggles{display:flex;flex-wrap:wrap;gap:5px}
.pulls{display:flex;flex-wrap:wrap;gap:5px}
.pull{border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.pull i{font-style:normal;font-family:var(--f-data);font-size:10px;padding:0 4px;border-radius:4px;background:var(--t);border:1.5px solid var(--ink)}
.empty{font-size:12px;color:var(--muted)}
#editbtn{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));border:3px solid var(--ink);border-radius:12px;background:var(--sun);
  font-family:var(--f-display);font-size:14px;padding:6px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.close{border:2px solid var(--ink);border-radius:8px;background:var(--paper);font-weight:800;cursor:pointer;width:30px;height:30px}

@media (max-width:820px){
  :root{--panel-w:auto}
  #panel{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:auto;height:56%;bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:20px}
  #panel.closed{transform:translateY(calc(100% + 40px))}
  #card{top:auto;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translate(-120%,0) rotate(-4deg)}
  #card.show{transform:translate(0,0) rotate(-1deg)}
  body.sheet #card{display:none}
  body.sheet .knobwrap{display:none}
}
@media (prefers-reduced-motion:reduce){#tap{animation:none}#card,#panel{transition:none}}
</style>

<canvas id="stage" aria-label="Neko Gacha 3D stage. Drag to spin the cat, tap it to poke."></canvas>
<div class="logo"><h1>NEKO<br><span>GACHA</span></h1><div class="sub"><span class="tag">ネコガチャ</span><span class="tag alt" id="pullcount">PULL 000</span></div></div>
<button id="editbtn" type="button" aria-controls="panel">EDIT</button>
<div class="knobwrap"><button id="roll" type="button" aria-label="Roll a new cat"></button><div class="knoblabel">ROLL!</div></div>
<div id="tap" hidden>TAP!</div>
<div id="flash"></div>

<section id="card" aria-live="polite">
  <div class="top"><span class="badge" id="cBadge">N</span><span class="stars" id="cStars">★</span><span class="no" id="cNo">No.000</span></div>
  <h2 id="cName">Mochi-maru</h2>
  <div class="species" id="cSpecies">Tabby Mochineko</div>
  <div class="traits" id="cTraits"></div>
  <div class="row"><button class="btn" id="cEdit" type="button">Tweak it</button><button class="btn hot" id="cKeep" type="button">Keep</button></div>
</section>

<aside id="panel" class="closed" aria-label="Cat editor">
  <div class="phead"><div><b>NEKO LAB</b><div class="meta" id="pRarity">—</div></div><button class="close" id="pClose" type="button" aria-label="Close editor">✕</button></div>
  <div class="pbody" id="pbody"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
"use strict";
/* ================= DATA ================= */
const TIERS=['N','R','SR','SSR','SECRET'];
const TIERCOL=['#8fc6ff','#5fdc98','#c09bff','#ffcf33','#ff5fa2'];
const TIERW=[52,26,13,5,1.4];
const OPT={
  style:[['Mochi',0],['PS2',1],['Voxel',2],['Real Fur',3]],
  shape:[['Chonk',0],['Loaf',0],['Bean',1],['Noodle',2]],
  pattern:[['Solid',0],['Tabby',0],['Tuxedo',1],['Calico',1],['Spots',1],['Pointed',2],['Y2K Fade',3],['Cyber Grid',4]],
  eyes:[['Dot',0],['Kawaii',0],['Sleepy',1],['Happy',1],['Visor',3],['Cyclops',4]],
  mouth:[['ω',0],['Open',0],['Fang',1],['Flat',1]],
  blush:[['Off',0],['On',0]],
  ears:[['Pointy',0],['Round',1],['Folded',2],['Fennec',2]],
  tail:[['Long',0],['Bob',1],['Fluffy',1],['Curl',2],['Twin',4]],
  head:[['None',0],['Bow',1],['Headphones',2],['Propeller',2],['Crown',3],['Horns',3],['Halo',4]],
  neck:[['None',0],['Bell',0],['Scarf',1],['Koban',2]],
  pose:[['Stand',0],['Maneki',2]],
  mood:[['Chill',0],['Hyper',1],['Sleepy',1],['Glitch',4]],
};
const FUR=[['Snow','#f7f4ef',0],['Cream','#f2d6a2',0],['Ginger','#f08a3c',0],['Ash','#9aa0ab',0],['Ink','#2a2733',0],['Cocoa','#7a4e33',0],
  ['Sky','#7fc8ff',1],['Sakura','#ff9ec4',1],['Matcha','#9fd47a',1],['Lilac','#b49cff',2],['Lemon','#ffe45c',2],['Chrome','#c9d6e8',3],['Neon','#3dffb6',3],['Void','#120e2a',4]];
const EYE=[['Gold','#ffc93c',0],['Jade','#3fbf7f',0],['Azure','#3d7bff',0],['Amber','#ff8a1f',1],['Rose','#ff4f8b',2],['Ice','#a8f0ff',2],['Blood','#e3192f',3],['Prism','#ffffff',4]];
const SLIDERS={headSize:'Head',legs:'Legs',earSize:'Ears'};
const KEYS=['style','shape','pattern','eyes','mouth','blush','ears','tail','head','neck','pose','mood','fur','acc','eye','headSize','legs','earSize'];
const SECTIONS=[
  {id:'build',title:'Build',keys:['style','shape','headSize','legs']},
  {id:'fur',title:'Fur',keys:['pattern','fur','acc']},
  {id:'face',title:'Face',keys:['eyes','eye','mouth','blush']},
  {id:'ears',title:'Ears & Tail',keys:['ears','earSize','tail']},
  {id:'gear',title:'Gear',keys:['head','neck','pose']},
  {id:'soul',title:'Soul',keys:['mood']},
];
const LABEL={style:'Build style',shape:'Body',pattern:'Pattern',fur:'Fur colour',acc:'Accent colour',eyes:'Eyes',eye:'Eye colour',mouth:'Mouth',blush:'Blush',ears:'Ear type',tail:'Tail',head:'Head gear',neck:'Neck gear',pose:'Pose',mood:'Mood'};
function tierOf(k,v){ if(OPT[k]) return OPT[k][v][1]; if(k==='fur'||k==='acc') return FUR[v][2]; if(k==='eye') return EYE[v][2]; return 0; }

/* ================= RNG / NOISE ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function h3(x,y,z,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1440662683)^Math.imul(s|0,-1640531535);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);let xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);const L=(a,b,t)=>a+(b-a)*t;
  const c=(i,j,k)=>h3(xi+i,yi+j,zi+k,s);
  return L(L(L(c(0,0,0),c(1,0,0),u),L(c(0,1,0),c(1,1,0),u),v),L(L(c(0,0,1),c(1,0,1),u),L(c(0,1,1),c(1,1,1),u),v),w)}
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ================= STATE ================= */
let A=defaultAttrs();
const locks={};
let pulls=[]; try{pulls=JSON.parse(localStorage.getItem('nekogacha.pulls')||'[]')||[]}catch(e){pulls=[]}
let pullCount=0; try{pullCount=+localStorage.getItem('nekogacha.count')||0}catch(e){}
const prefs={res:0.5,wobble:true,sound:true,spin:false,furLen:1,shells:24};
if(matchMedia('(pointer:coarse)').matches)prefs.shells=16;
try{Object.assign(prefs,JSON.parse(localStorage.getItem('nekogacha.prefs')||'{}'))}catch(e){}
function savePrefs(){try{localStorage.setItem('nekogacha.prefs',JSON.stringify(prefs))}catch(e){}}
function defaultAttrs(){return{style:0,shape:0,pattern:1,eyes:1,mouth:0,blush:1,ears:0,tail:0,head:0,neck:1,pose:1,mood:0,fur:2,acc:0,eye:0,headSize:5,legs:3,earSize:4}}

function encode(a){return 'NEKO-'+KEYS.map(k=>a[k].toString(36)).join('').toUpperCase()}
function decode(s){s=String(s||'').trim().toUpperCase().replace(/^NEKO-?/,'');if(s.length!==KEYS.length)return null;const a={};
  for(let i=0;i<KEYS.length;i++){const k=KEYS[i];const v=parseInt(s[i],36);if(isNaN(v))return null;
    const max=OPT[k]?OPT[k].length:(k==='fur'||k==='acc')?FUR.length:k==='eye'?EYE.length:10;if(v>=max)return null;a[k]=v}return a}

function pickWeighted(list,tierFn,rng){let tot=0;const w=list.map((x,i)=>{const t=TIERW[tierFn(i)];tot+=t;return t});let r=rng()*tot;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}return w.length-1}
function rollAttrs(rng){const a={...A};const lockedKeys=new Set();SECTIONS.forEach(s=>{if(locks[s.id])s.keys.forEach(k=>lockedKeys.add(k))});
  for(const k of KEYS){if(lockedKeys.has(k))continue;
    if(OPT[k])a[k]=pickWeighted(OPT[k],i=>OPT[k][i][1],rng);
    else if(k==='fur'||k==='acc')a[k]=pickWeighted(FUR,i=>FUR[i][2],rng);
    else if(k==='eye')a[k]=pickWeighted(EYE,i=>EYE[i][2],rng);
    else a[k]=Math.floor(rng()*10)}
  const lum=i=>{const c=new THREE.Color(FUR[i][1]);return c.r*0.3+c.g*0.59+c.b*0.11};
  if(!lockedKeys.has('acc')){let g=0;while((a.acc===a.fur||(a.pattern>0&&Math.abs(lum(a.acc)-lum(a.fur))<0.22))&&g++<40)a.acc=pickWeighted(FUR,i=>FUR[i][2],rng)}
  return a}
function rarity(a){let mx=0,hi=0;for(const k of KEYS){const t=tierOf(k,a[k]);mx=Math.max(mx,t);if(t>=2)hi++}if(hi>=4)mx=Math.min(4,mx+1);return mx}
const SYL=['mo','chi','ku','ro','ta','ma','ne','ko','pi','su','shi','ji','ka','nya','to','fu','ri','yu','po','n','zu','me'];
const SUF=['-maru','-chan','-tan','','-kun','-hime','-dono','-bō'];
function identity(a){const code=encode(a);const r=mulberry(strHash(code));let n='';const L=2+Math.floor(r()*2);for(let i=0;i<L;i++)n+=SYL[Math.floor(r()*SYL.length)];
  n=n[0].toUpperCase()+n.slice(1)+SUF[Math.floor(r()*SUF.length)];
  const pat=OPT.pattern[a.pattern][0];let base=['Mochineko','Polyneko','Voxelneko','Fuzzneko'][a.style];
  if(a.pose===1)base=a.style===2?'Voxel Manekineko':'Manekineko';if(a.tail===4)base='Nekomata';if(a.mood===3)base='Bugneko';
  return{name:n,species:(pat==='Solid'?FUR[a.fur][0]:pat)+' '+base,no:String(strHash(code)%1000).padStart(3,'0'),code}}

/* ================= THREE SETUP ================= */
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setClearColor(0xbfe9ff);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const HORIZON=new THREE.Color('#ffd6ea');
scene.fog=new THREE.Fog(HORIZON,22,70);
const camera=new THREE.PerspectiveCamera(32,1,0.1,300);
const camTarget=new THREE.Vector3(0,1.75,0);
scene.add(new THREE.HemisphereLight(0xdff2ff,0x8a6fb0,0.8));
const sun=new THREE.DirectionalLight(0xfff1dc,0.75);sun.position.set(4,7,6);scene.add(sun);
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-4,right:4,top:5,bottom:-3,near:1,far:25});sun.shadow.bias=-0.0008;sun.shadow.radius=4;sun.shadow.camera.updateProjectionMatrix();

const SNAP={value:new THREE.Vector2(320,240)},SNAPON={value:1};
function ps2(mat){mat.onBeforeCompile=sh=>{sh.uniforms.uSnap=SNAP;sh.uniforms.uSnapOn=SNAPON;

const PMAX=180;

for(let i=0;i<PMAX;i++){pMesh.setColorAt(i,new THREE.Color('#fff'))}
function burst(at,tier){const n=tier>=3?160:90;const cols=tier===4?['#ff5fa2','#ffd23f','#3dffb6','#5e8bff','#c77dff','#ffffff']:[TIERCOL[tier],'#ffffff','#ffd23f','#ff5fa2','#5e8bff'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,u=Math.random()*2-1,s=3+Math.random()*6;const r=Math.sqrt(1-u*u);

  while(parts.length>PMAX)parts.shift()}
function stepParticles(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue}
    q.v.y-=9*dt;q.v.multiplyScalar(1-1.2*dt);q.p.addScaledVector(q.v,dt);if(q.p.y<0.05){q.p.y=0.05;q.v.y*=-0.3;q.v.x*=0.6;q.v.z*=0.6}q.r.x+=q.w*dt;q.r.y+=q.w*0.7*dt}

let AC=null;function ac(){if(!prefs.sound)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function blip(f0,f1,dur,type='square',vol=0.08,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.02)}
function meow(pitch=1){const a=ac();if(!a)return;const t=a.currentTime;const o=a.createOscillator(),o2=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();
  o.type='sawtooth';o2.type='triangle';const p=pitch*(0.9+Math.random()*0.25);
  [o,o2].forEach((x,k)=>{x.frequency.setValueAtTime(520*p*(k?2:1),t);x.frequency.linearRampToValueAtTime(820*p*(k?2:1),t+0.12);x.frequency.exponentialRampToValueAtTime(380*p*(k?2:1),t+0.42)});
  f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(2200,t+0.15);f.frequency.linearRampToValueAtTime(700,t+0.42);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.05);g.gain.exponentialRampToValueAtTime(0.0008,t+0.45);
  o.connect(f);o2.connect(f);f.connect(g).connect(a.destination);o.start(t);o2.start(t);o.stop(t+0.5);o2.stop(t+0.5)}
function jingle(tier){const notes=[523,659,784,1047,1319,1568];const n=2+tier;for(let i=0;i<n;i++)blip(notes[i],notes[i]*1.01,0.16,'square',0.06,i*0.09);if(tier>=3)blip(2093,2093,0.5,'triangle',0.05,n*0.09)}

  const was=cat?cat.userData.style:-1;cat=buildCat(a);cat.userData.style=a.style;holder.add(cat);applyMode();if(was!==a.style)resize();
  if(pop){spawn.v=0.01;spawn.vel=0}
  motion.nextHop=clock.elapsedTime+1.5;updateUI()}

function roll(){if(!(state==='idle'||state==='reveal'))return;hideCard();closePanelMobile();
  const rng=mulberry((Math.random()*2**32)>>>0);pending=rollAttrs(rng);pendingTier=rarity(pending);
  state='exit';stT=0;btnRoll.disabled=true;btnRoll.classList.toggle('turn');
  blip(180,90,0.25,'square',0.07);blip(240,120,0.25,'square',0.05,0.12);
  pullCount++;try{localStorage.setItem('nekogacha.count',pullCount)}catch(e){}updateCount()}
function startCapsule(){if(cat){holder.remove(cat);cat=null}
  tintCapsule(pendingTier);capsule.visible=true;capTop.position.set(0,0,0);capTop.rotation.set(0,0,0);capBot.position.set(0,0,0);capBot.rotation.set(0,0,0);capBot.scale.setScalar(1);capTop.scale.setScalar(1);
  cap.x=9;cap.y=capR+2.4;cap.vx=-7.5;cap.vy=0;cap.rot=0;state='rolling';stT=0}
function openCapsule(){if(state==='rolling'&&Math.abs(cap.x)<2.5&&cap.vy===0){state='waiting';tapEl.hidden=false}if(state!=='waiting')return;state='opening';stT=0;tapEl.hidden=true;blip(300,900,0.35,'square',0.05)}

  cap.topV.set(1.2+Math.random(),7.5,2.2);cap.botV.set(-0.6,1.5,0.6);cap.spin=(Math.random()<0.5?-1:1)*6;
  A=pending;setCat(A,true);state='reveal';stT=0;
  const id=identity(A);pulls.unshift({code:id.code,name:id.name,tier:pendingTier});pulls=pulls.slice(0,16);try{localStorage.setItem('nekogacha.pulls',JSON.stringify(pulls))}catch(e){}
  renderPulls();setTimeout(()=>showCard(pendingTier),450);setTimeout(()=>{btnRoll.disabled=false},700)}

const cardEl=document.getElementById('card');
function showCard(tier){const id=identity(A);const b=document.getElementById('cBadge');b.textContent=TIERS[tier];b.style.setProperty('--tier',TIERCOL[tier]);b.classList.toggle('secret',tier===4);
  document.getElementById('cStars').textContent='★'.repeat(tier+1);document.getElementById('cNo').textContent='No.'+id.no;
  document.getElementById('cName').textContent=id.name;document.getElementById('cSpecies').textContent=id.species;
  const tr=document.getElementById('cTraits');tr.innerHTML='';
  ['pattern','eyes','ears','tail','head','neck','pose','mood'].forEach(k=>{const v=OPT[k][A[k]][0];if(v==='None'||v==='Stand'||v==='Off')return;const s=document.createElement('span');s.textContent=v;s.className='t'+OPT[k][A[k]][1];tr.appendChild(s)});
  [['fur',FUR],['eye',EYE]].forEach(([k,L])=>{const t=L[A[k]][2];if(t>=2){const s=document.createElement('span');s.textContent=L[A[k]][0]+(k==='eye'?' eyes':' fur');s.className='t'+t;tr.appendChild(s)}});
  cardEl.classList.add('show')}
function hideCard(){cardEl.classList.remove('show')}
document.getElementById('cKeep').onclick=()=>{hideCard();meow(1.1)};
document.getElementById('cEdit').onclick=()=>{hideCard();openPanel()};

/* ================= PANEL ================= */
const panel=document.getElementById('panel'),pbody=document.getElementById('pbody');
const controls={};
function chipGroup(k,list,getT){const wrap=document.createElement('div');wrap.className=k==='fur'||k==='acc'||k==='eye'?'swatches':'chips';
  list.forEach((o,i)=>{const b=document.createElement('button');b.type='button';
    if(wrap.className==='swatches'){b.className='sw t'+o[2];b.style.background=o[0]==='Prism'?'conic-gradient(#ff5fa2,#ffd23f,#3dffb6,#5e8bff,#c77dff,#ff5fa2)':o[1];b.title=o[0]+' · '+TIERS[o[2]];b.setAttribute('aria-label',o[0])}
    else{b.className='chip';b.innerHTML='<i></i>';b.append(o[0]);b.querySelector('i').style.setProperty('--t',TIERCOL[o[1]]);b.title=TIERS[o[1]]}
    b.onclick=()=>{A[k]=i;edit()};wrap.appendChild(b)});controls[k]=wrap;return wrap}
function buildPanel(){pbody.innerHTML='';
  SECTIONS.forEach(s=>{const sec=document.createElement('div');sec.className='sec';
    const hd=document.createElement('div');hd.className='sechead';hd.innerHTML=`<h3>${s.title}</h3>`;const lk=document.createElement('button');lk.type='button';lk.className='lock';lk.id='lock-'+s.id;
    lk.textContent=locks[s.id]?'LOCKED':'LOCK';lk.setAttribute('aria-pressed',!!locks[s.id]);lk.title='Keep this group when you roll';lk.onclick=()=>{locks[s.id]=!locks[s.id];lk.textContent=locks[s.id]?'LOCKED':'LOCK';lk.setAttribute('aria-pressed',locks[s.id])};hd.appendChild(lk);sec.appendChild(hd);
    s.keys.forEach(k=>{const f=document.createElement('div');f.className='field';
      if(SLIDERS[k]){f.innerHTML=`<label class="flabel" for="sl-${k}">${SLIDERS[k]} <output id="out-${k}"></output></label>`;const r=document.createElement('input');r.type='range';r.min=0;r.max=9;r.step=1;r.id='sl-'+k;r.oninput=()=>{A[k]=+r.value;edit()};f.appendChild(r);controls[k]=r}
      else{f.innerHTML=`<div class="flabel">${LABEL[k]}</div>`;const list=OPT[k]||(k==='eye'?EYE:FUR);f.appendChild(chipGroup(k,list))}
      sec.appendChild(f)});pbody.appendChild(sec)});
  // share
  const sh=document.createElement('div');sh.className='sec';sh.innerHTML=`<div class="sechead"><h3>Share code</h3></div>
    <div class="codebox"><input id="code" aria-label="Cat code" spellcheck="false"><button class="btn" id="copy" type="button">Copy</button><button class="btn" id="load" type="button">Load</button></div><div class="note" id="codeNote">Paste a code and press Load to summon that cat.</div>`;pbody.appendChild(sh);
  const pl=document.createElement('div');pl.className='sec';pl.innerHTML=`<div class="sechead"><h3>Recent pulls</h3></div><div class="pulls" id="pulls"></div>`;pbody.appendChild(pl);
  const rs=document.createElement('div');rs.className='sec';rs.innerHTML=`<div class="sechead"><h3>Render</h3></div>
    <div class="field"><label class="flabel" for="res">Pixel resolution <output id="resOut"></output></label><input type="range" id="res" min="0.2" max="1" step="0.05"></div>
    <div class="field"><label class="flabel" for="furlen">Fur length <output id="flOut"></output></label><input type="range" id="furlen" min="0.3" max="2.2" step="0.1"></div>
    <div class="field"><label class="flabel" for="shells">Fur layers <output id="shOut"></output></label><input type="range" id="shells" min="8" max="48" step="4"></div>
    <div class="note">Fur length and layers apply to the Real Fur style. More layers look denser but cost GPU.</div>
    <div class="toggles"><button class="chip" id="tWob" type="button">Vertex wobble</button><button class="chip" id="tSpin" type="button">Turntable</button><button class="chip" id="tSnd" type="button">Sound</button></div>`;pbody.appendChild(rs);
  const fl=document.getElementById('furlen');fl.value=prefs.furLen;fl.oninput=()=>{prefs.furLen=+fl.value;FURU.uLenMul.value=prefs.furLen;savePrefs();syncRender()};
  const shl=document.getElementById('shells');shl.value=prefs.shells;shl.onchange=()=>{prefs.shells=+shl.value;savePrefs();syncRender();if(A.style===3&&(state==='idle'||state==='reveal')){const y=motion.yaw;setCat(A,false);motion.yaw=y}};shl.oninput=()=>{document.getElementById('shOut').textContent=shl.value};
  const res=document.getElementById('res');res.value=prefs.res;res.oninput=()=>{prefs.res=+res.value;savePrefs();resize();syncRender()};
  const tg=(id,key)=>{const b=document.getElementById(id);b.onclick=()=>{prefs[key]=!prefs[key];savePrefs();syncRender()}};tg('tWob','wobble');tg('tSpin','spin');tg('tSnd','sound');
  document.getElementById('copy').onclick=async()=>{const inp=document.getElementById('code');const note=document.getElementById('codeNote');
    try{await navigator.clipboard.writeText(inp.value);note.textContent='Copied '+inp.value}catch(e){inp.select();note.textContent='Selected. Press Ctrl/Cmd+C to copy.'}};
  document.getElementById('load').onclick=()=>{const v=document.getElementById('code').value;const d=decode(v);const note=document.getElementById('codeNote');
    if(!d){note.textContent='That code doesn’t look right. Codes start with NEKO- and have 18 characters after it.';return}A=d;setCat(A,true);meow();note.textContent='Loaded '+encode(A)};
  renderPulls();syncRender()}
function syncRender(){document.getElementById('resOut').textContent=Math.round(prefs.res*100)+'%';
  [['tWob','wobble'],['tSpin','spin'],['tSnd','sound']].forEach(([id,k])=>document.getElementById(id).setAttribute('aria-pressed',!!prefs[k]));
  document.getElementById('flOut').textContent=prefs.furLen.toFixed(1)+'×';document.getElementById('shOut').textContent=prefs.shells;applyMode()}
function renderPulls(){const el=document.getElementById('pulls');if(!el)return;el.innerHTML='';if(!pulls.length){el.innerHTML='<span class="empty">Your gacha history shows up here.</span>';return}
  pulls.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='pull';b.innerHTML=`<i>${TIERS[p.tier]}</i>`;b.querySelector('i').style.setProperty('--t',TIERCOL[p.tier]);b.append(p.name);b.title=p.code;
    b.onclick=()=>{const d=decode(p.code);if(d){A=d;setCat(A,true);meow()}};el.appendChild(b)})}
function updateUI(){for(const k of KEYS){const c=controls[k];if(!c)continue;if(c.tagName==='INPUT'){c.value=A[k];const o=document.getElementById('out-'+k);if(o)o.textContent=A[k]}
    else[...c.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===A[k]))}
  const ci=document.getElementById('code');if(ci&&document.activeElement!==ci)ci.value=encode(A);
  const t=rarity(A);document.getElementById('pRarity').textContent=`${TIERS[t]} · ${identity(A).name}`}
let editTimer=0;
function edit(){if(state!=='idle'&&state!=='reveal')return;hideCard();cancelAnimationFrame(editTimer);editTimer=requestAnimationFrame(()=>{const keepYaw=motion.yaw;setCat(A,false);motion.yaw=keepYaw;motion.sqv-=3})}
function updateCount(){document.getElementById('pullcount').textContent='PULL '+String(pullCount).padStart(3,'0')}
const narrow=()=>innerWidth<=820;
function openPanel(){panel.classList.remove('closed');document.body.classList.toggle('sheet',narrow());resize()}
function closePanel(){panel.classList.add('closed');document.body.classList.remove('sheet');resize()}
function closePanelMobile(){if(narrow())closePanel()}
document.getElementById('editbtn').onclick=()=>panel.classList.contains('closed')?openPanel():closePanel();
document.getElementById('pClose').onclick=closePanel;

/* ================= INPUT ================= */
const btnRoll=document.getElementById('roll');btnRoll.onclick=roll;
const tapEl=document.getElementById('tap');
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,moved:false,lx:e.clientX};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();motion.look.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));
  if(down){const dx=e.clientX-down.lx;down.lx=e.clientX;if(Math.abs(e.clientX-down.x)>6||Math.abs(e.clientY-down.y)>6){down.moved=true;canvas.classList.add('drag')}if(down.moved){motion.yaw+=dx*0.012;motion.yawV=dx*0.012}}});
canvas.addEventListener('pointerup',e=>{canvas.classList.remove('drag');if(down&&!down.moved){
  if(state==='waiting'||state==='rolling'){openCapsule()}
  else if(cat&&(state==='idle'||state==='reveal')){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(ndc,camera);
    if(ray.intersectObject(cat,true).length){motion.sqv-=8;if(motion.py<=0.001)motion.vy=4.5;motion.poke=0.6;meow(A.shape===2?1.2:1)}}}down=null});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'||e.key==='r'){e.preventDefault();state==='waiting'?openCapsule():roll()}});

/* ================= RESIZE ================= */
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(A.style===3?Math.min(devicePixelRatio||1,2):prefs.res);renderer.setSize(w,h,true);camera.aspect=w/h;
  const port=w/h<0.8;camera.fov=port?44:32;
  let ox=0,oy=0;if(!panel.classList.contains('closed')){if(narrow())oy=h*0.25;else ox=(panel.offsetWidth+24)/2}
  camera.setViewOffset(w,h,ox,oy,w,h);camera.updateProjectionMatrix();
  const bw=Math.round(w*prefs.res),bh=Math.round(h*prefs.res);SNAP.value.set(bw/2.5,bh/2.5)}
addEventListener('resize',resize);

/* ================= ANIMATE ================= */
const clock=new THREE.Clock();
const MOOD=[{sp:1,tail:0.28,hop:0},{sp:2,tail:0.55,hop:1},{sp:0.5,tail:0.12,hop:0,sleepy:1},{sp:1.3,tail:0.42,hop:0.35,glitch:1}];
const tmpV=new THREE.Vector3();
function animCat(t,dt){if(!cat)return;const rig=cat.userData.rig;const m=MOOD[A.mood];const T=t*m.sp;
  // spawn spring
  spawn.vel+=((spawn.target-spawn.v)*170-spawn.vel*11)*dt;spawn.v+=spawn.vel*dt;
  // hops
  if(m.hop&&motion.py<=0&&t>motion.nextHop&&(state==='idle'||state==='reveal')){motion.vy=3.6+Math.random()*1.5;motion.sqv-=5;motion.nextHop=t+(1+Math.random()*1.8)/m.hop}
  motion.vy-=20*dt;motion.py+=motion.vy*dt;if(motion.py<=0){if(motion.vy<-2.5)motion.sqv+=motion.vy*0.9;motion.py=0;motion.vy=0}
  motion.sqv+=(-(motion.sq-1)*190-motion.sqv*9)*dt;motion.sq+=motion.sqv*dt;const sq=clamp(motion.sq,0.55,1.5);
  const s=Math.max(0.001,spawn.v);cat.scale.set(s/Math.sqrt(sq),s*sq,s/Math.sqrt(sq));
  const emerge=state==='reveal'&&stT<0.6?(1-sstep(0,0.6,stT))*capR*0.6:0;
  cat.position.y=motion.py+emerge;
  // breathing
  rig.body.scale.y=1+0.035*Math.sin(T*2.2);
  rig.head.position.y=rig.headY+0.04*Math.sin(T*2.2-0.6)+(m.sleepy?-0.06:0);
  // look
  motion.lookS.lerp(motion.look,1-Math.exp(-dt*5));
  let ty=clamp(motion.lookS.x*0.9-holder.rotation.y,-0.9,0.9);if(Math.abs(((holder.rotation.y+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI)>1.6)ty=0;
  rig.head.rotation.y+=(ty-rig.head.rotation.y)*(1-Math.exp(-dt*6));
  const tx=-motion.lookS.y*0.22+(m.sleepy?0.22+0.08*Math.sin(T*1.5):0);rig.head.rotation.x+=(tx-rig.head.rotation.x)*(1-Math.exp(-dt*6));
  rig.head.rotation.z=0.07*Math.sin(T*1.3)+(motion.poke>0?0.25*Math.sin(motion.poke*20)*motion.poke:0);
  motion.poke=Math.max(0,motion.poke-dt);
  // blink
  motion.blink-=dt;if(motion.blink<0){motion.blinkT=0.13;motion.blink=1.8+Math.random()*3.5}motion.blinkT-=dt;
  const base=m.sleepy?0.4:1;const ey=motion.blinkT>0?0.08:(motion.poke>0.3?1.25:base);
  rig.eyes.forEach(e=>{if(e.userData.visor)return;const k=e.userData.line?1:ey;e.scale.y+=(k-e.scale.y)*Math.min(1,dt*25)});
  // ears
  rig.ears.forEach((e,i)=>{motion.ear[i]-=dt;if(motion.ear[i]<0){motion.earT[i]=0.28;motion.ear[i]=2+Math.random()*5}motion.earT[i]-=dt;
    const tw=motion.earT[i]>0?Math.sin(motion.earT[i]*40)*0.35:0;e.rotation.z=e.userData.rz0+tw*e.userData.s+(motion.vy>1?-e.userData.s*0.3:0)});
  // legs
  const air=motion.py>0.02;
  rig.legs.forEach((L,i)=>{if(L.beckon){L.knee.rotation.x=-0.2-0.6*(0.5+0.5*Math.sin(T*5.5));return}
    let tx=0,kx=0;if(air){tx=L.front?-0.45:0.45;kx=L.front?0.6:-0.6}else if(A.mood===1){tx=0.12*Math.sin(T*8+i*Math.PI)}
    L.pivot.rotation.x+=(tx-L.pivot.rotation.x)*Math.min(1,dt*12);L.knee.rotation.x+=(kx-L.knee.rotation.x)*Math.min(1,dt*12)});
  // tail
  const amp=m.tail*(motion.poke>0?2.2:1);
  rig.tails.forEach(tl=>tl.joints.forEach((j,i)=>{j.rotation.x=j.userData.base+amp*0.35*Math.sin(T*2.4-i*0.55);j.rotation.y=amp*Math.sin(T*1.9-i*0.5+(tl.dir<0?1.3:0))*(i===0?0.7:0.32)*tl.dir}));
  if(rig.prop)rig.prop.rotation.y+=dt*(10+(air?18:0));
  if(rig.halo){rig.halo.position.y=rig.headY*0+rig.halo.position.y*0+ (0.94*(0.8+A.headSize*0.05))*1.45+0.06*Math.sin(T*2);rig.halo.rotation.z+=dt*0.6}
  if(rig.mouth)rig.mouth.scale.y=1+0.35*Math.sin(T*3);
  // glitch
  if(m.glitch){if(motion.glitch<=0&&Math.random()<dt*1.1)motion.glitch=0.08+Math.random()*0.12;
    if(motion.glitch>0){motion.glitch-=dt;rig.head.position.x=(Math.random()-0.5)*0.25;rig.body.position.x=(Math.random()-0.5)*0.12;SNAP.value.multiplyScalar(0.35)}else{rig.head.position.x=0;rig.body.position.x=0}}
  FURU.uTime.value=t;FURU.uS.value=s;FURU.uRuffle.value=motion.poke*0.5+(m.glitch&&motion.glitch>0?0.6:0);
  furG.set(clamp(-motion.yawV*14,-0.9,0.9)+0.06*Math.sin(t*0.7),-0.5-clamp(motion.vy*0.09,-0.5,0.6),0.05*Math.sin(t*0.9));FURU.uGrav.value.lerp(furG,1-Math.exp(-dt*7));
  shadow.scale.setScalar(Math.max(0.01,(1.15+0.2*(A.shape===1?1:0))*s/(1+motion.py*0.5)));shadow.material.opacity=0.22/(1+motion.py)}

function tick(){requestAnimationFrame(tick);let dt=Math.min(clock.getDelta(),1/20);const t=clock.elapsedTime;stT+=dt;
  resizeSnapReset();
  // turntable
  if(!down||!down.moved){motion.yaw+=motion.yawV;motion.yawV*=0.92;if(prefs.spin)motion.yaw+=dt*0.5;else if(Math.abs(motion.yawV)<0.0005)motion.yaw+=(0.35+0.12*Math.sin(t*0.4)-motion.yaw)*dt*0.4*(state==='reveal'||state==='idle'?1:0)}
  holder.rotation.y=motion.yaw;
  // sequence
  if(state==='exit'){spawn.target=0;if(stT>0.32){spawn.target=1;startCapsule()}}
  if(state==='rolling'||state==='waiting'){
    if(state==='rolling'){cap.vy-=20*dt;cap.y+=cap.vy*dt;if(cap.y<capR){cap.y=capR;if(cap.vy<-2.5){cap.vy=-cap.vy*0.42;blip(140,70,0.08,'square',0.05)}else cap.vy=0}
      cap.vx+=(-cap.x*6-cap.vx*4.2)*dt;cap.x+=cap.vx*dt;cap.rot-=cap.vx*dt/capR;
      if(Math.abs(cap.x)<0.12&&Math.abs(cap.vx)<0.35&&cap.vy===0){state='waiting';stT=0;tapEl.hidden=false}}
    else{const k=stT%2.2;const hop=k<0.3?Math.sin(k/0.3*Math.PI)*0.25:0;cap.y=capR+hop;cap.rot+=(Math.round(cap.rot/(Math.PI*2))*Math.PI*2-cap.rot)*dt*3;}
    capsule.position.set(cap.x,cap.y,0);capsule.rotation.set(0,0,cap.rot+(state==='waiting'?0.08*Math.sin(t*5):0));
    shadow.scale.setScalar(capR*0.9/(1+(cap.y-capR)*0.4));shadow.position.x=cap.x}
  else shadow.position.x+=(0-shadow.position.x)*Math.min(1,dt*8);
  if(state==='opening'){const j=sstep(0,0.45,stT)*0.25;cap.rot+=(Math.round(cap.rot/(Math.PI*2))*Math.PI*2-cap.rot)*Math.min(1,dt*10);
    capsule.rotation.set((Math.random()-0.5)*j,(Math.random()-0.5)*j,cap.rot+(Math.random()-0.5)*j);capsule.scale.setScalar(1+0.08*Math.sin(stT*40)*sstep(0,0.45,stT));
    if(stT>0.45){capsule.scale.setScalar(1);pop()}}
  if(state==='reveal'&&capsule.visible){capTop.position.addScaledVector(cap.topV,dt);cap.topV.y-=16*dt;capTop.rotation.z+=cap.spin*dt;capTop.rotation.x+=cap.spin*0.4*dt;
    capBot.position.addScaledVector(cap.botV,dt);cap.botV.y-=16*dt;capBot.rotation.z-=cap.spin*0.3*dt;if(capBot.position.y+cap.y<0.4){cap.botV.set(0,0,0)}
    const fade=1-sstep(0.6,1.2,stT);capBot.scale.setScalar(Math.max(0.001,fade));capTop.scale.setScalar(Math.max(0.001,1-sstep(0.8,1.4,stT)));if(stT>1.4)capsule.visible=false}
  if(state==='reveal'&&stT>1.5)state='idle';
  if(state!=='rolling'&&state!=='waiting'&&state!=='opening'&&cat)animCat(t,dt);
  else if(state==='exit'&&cat)animCat(t,dt);
  // tap label position
  if(!tapEl.hidden){tmpV.set(cap.x,cap.y+capR+0.3,0).project(camera);tapEl.style.left=((tmpV.x+1)/2*innerWidth)+'px';tapEl.style.top=((1-tmpV.y)/2*innerHeight)+'px'}
  // world drift
  WORLD.deco.rotation.y=t*0.01;WORLD.floaters.forEach(f=>{f.rotation.x+=dt*f.userData.s;f.rotation.y+=dt*f.userData.s*0.7;f.position.y=f.userData.y+Math.sin(t*f.userData.s+f.userData.ph)*0.4});
  stepParticles(dt);
  camera.position.set(0,2.9,innerWidth/innerHeight<0.8?13:11);camera.lookAt(camTarget);
  renderer.render(scene,camera)}
function resizeSnapReset(){const w=innerWidth,h=innerHeight;SNAP.value.set(Math.round(w*prefs.res)/2.5,Math.round(h*prefs.res)/2.5)}

/* ================= BOOT ================= */
buildPanel();updateCount();
const boot=pulls[0]&&decode(pulls[0].code);if(boot)A=boot;
setCat(A,true);resize();tick();
if(!narrow())openPanel();
})();
</script>
