<title>Neko Gacha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed WebGL stage, logo top-left, knob bottom-centre, edit deck docked right (bottom sheet on phones). */
:root{
  --ink:#1b1440;        /* deep indigo outlines + text */
  --paper:#fffdf8;      /* panel surface */
  --paper-2:#f3efff;    /* inset fields */
  --pink:#ff3d8b;       /* primary accent / knob */
  --blue:#2f5bff;       /* secondary accent */
  --sun:#ffd23f;        /* highlight */
  --muted:#6b6391;
  --sky:#bfe9ff;
  --f-display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Trebuchet MS",system-ui,sans-serif;
  --f-data:"DotGothic16","Courier New",monospace;
  --panel-w:340px;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* logo */
.logo{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none;user-select:none}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:.9;letter-spacing:.01em;color:var(--paper);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink),0 0 0 var(--ink);transform:rotate(-3deg);transform-origin:left}
.logo h1 span{color:var(--pink)}
.logo .sub{display:flex;gap:8px;align-items:center;margin-top:8px;font-family:var(--f-data);font-size:13px}
.tag{background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:99px;letter-spacing:.06em}
.tag.alt{background:var(--sun);color:var(--ink);border:2px solid var(--ink);padding:0 8px}

/* knob */
.knobwrap{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px}
#roll{width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle at 35% 30%,#ff8fbf 0 18%,var(--pink) 45%,#c8125f 100%);
  box-shadow:0 6px 0 var(--ink);cursor:pointer;position:relative;transition:transform .12s}
#roll::before{content:"";position:absolute;left:50%;top:50%;width:66px;height:18px;margin:-9px 0 0 -33px;border-radius:9px;background:var(--paper);border:3px solid var(--ink);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
#roll.turn::before{transform:rotate(180deg)}
#roll:hover{transform:translateY(-2px)}
#roll:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#roll:disabled{filter:saturate(.4) brightness(.95);cursor:default}
.knoblabel{font-family:var(--f-display);font-size:15px;color:var(--paper);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;letter-spacing:.08em}

/* tap prompt */
#tap{position:fixed;z-index:4;pointer-events:none;font-family:var(--f-display);font-size:30px;color:var(--sun);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;
  transform:translate(-50%,-100%);animation:bob .6s ease-in-out infinite alternate;white-space:nowrap}
@keyframes bob{to{transform:translate(-50%,-125%) rotate(-4deg)}}

/* flash */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7;transition:opacity .5s}
#flash.on{opacity:.9;transition:none}

/* result card */
#card{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));top:auto;bottom:calc(110px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 32px));
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:14px 16px 16px;
  transform:translate(-120%,0) rotate(-4deg);transition:transform .5s cubic-bezier(.3,1.5,.5,1);}
#card.show{transform:translate(0,0) rotate(-2deg)}
#card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-family:var(--f-display);font-size:20px;padding:2px 12px;border-radius:10px;border:3px solid var(--ink);background:var(--tier,#6fb6ff);color:var(--ink)}
.bankbox{margin-top:10px;display:inline-block;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:6px 12px 8px;min-width:200px;transform-origin:left center}
.bk-l{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--muted)}
.bk-v{font-family:var(--f-display);font-size:30px;line-height:1.05;color:#14a35c;font-variant-numeric:tabular-nums}
.bk-n{font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}.bk-n b{color:var(--ink);font-variant-numeric:tabular-nums}
.ticker{font-family:var(--f-data);font-size:11px;margin-top:4px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker .hot{color:#d81b60}.ticker .cold{color:#2f5bff}
.bankbox.up .bk-v{animation:bkUp .7s}.bankbox.down .bk-v{animation:bkDown .7s}
.bankbox.up.l1{animation:boxPop .6s cubic-bezier(.3,1.6,.5,1)}.bankbox.up.l2{animation:boxPop2 1.1s cubic-bezier(.3,1.6,.5,1)}
.bankbox.down.l1,.bankbox.down.l2,.bankbox.deny{animation:boxShake .5s}
.bankbox.inf .bk-v{font-size:44px;background:linear-gradient(90deg,#ff5fa2,#ffd23f,#3dffb6,#5e8bff,#c77dff,#ff5fa2);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:infSlide 2s linear infinite}
@keyframes bkUp{0%{color:#14a35c;transform:scale(1)}30%{color:#00e676;transform:scale(1.12)}100%{color:#14a35c;transform:scale(1)}}
@keyframes bkDown{0%,60%{color:#e8264c}100%{color:#14a35c}}
@keyframes boxPop{40%{transform:scale(1.14) rotate(-2deg)}}
@keyframes boxPop2{20%{transform:scale(1.35) rotate(-4deg)}45%{transform:scale(1.18) rotate(3deg)}70%{transform:scale(1.26) rotate(-2deg)}}
@keyframes boxShake{20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes infSlide{to{background-position:200% 0}}
.float{position:fixed;z-index:10;pointer-events:none;font-family:var(--f-display);font-size:22px;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:floatUp 1.6s ease-out forwards}
.float small{display:block;font-family:var(--f-body);font-size:11px;font-weight:800;-webkit-text-stroke:0;color:var(--ink)}
.float.up{color:#00e676}.float.down{color:#ff3d5a}.float.l1{font-size:32px}.float.l2{font-size:46px}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.float.down{animation-name:floatDown}@keyframes floatDown{0%{opacity:0;transform:translateY(-6px)}15%{opacity:1}100%{opacity:0;transform:translateY(50px)}}
.coin{position:fixed;left:0;top:0;z-index:10;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 55%,#d48a00);border:2px solid var(--ink);font:800 13px/20px var(--f-body);text-align:center;color:var(--ink);pointer-events:none}
.caps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.capbtn{border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);padding:2px 10px;font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 3px 0 var(--ink);line-height:1.15}
.capbtn small{display:block;font-family:var(--f-data);font-weight:400;font-size:11px}
.capbtn[aria-pressed="true"]{background:var(--sun)}
.capbtn.c1[aria-pressed="true"]{background:#c09bff}.capbtn.c2[aria-pressed="true"]{background:linear-gradient(90deg,#ff9ed0,#ffe98a,#9effd8)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:12;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:12px;font-weight:700;max-width:min(420px,calc(100vw - 32px));text-align:center;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#toast.on{transform:translate(-50%,0)}
.fx{position:fixed;inset:0;z-index:9;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.fx .rays{position:absolute;left:50%;top:38%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(rgba(255,255,255,.6) 0 5deg,transparent 5deg 15deg);opacity:0;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 45%);mask-image:radial-gradient(circle,#000 0,transparent 45%);animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fxwrap{transform:translateY(-14vh);text-align:center;padding:0 16px}
.fxt{font-family:var(--f-display);font-size:clamp(38px,8.5vw,108px);line-height:1;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);color:var(--paper)}
.fxs{margin-top:10px;font-weight:800;font-size:clamp(14px,2.2vw,20px);background:var(--ink);color:var(--paper);display:inline-block;padding:3px 12px;border-radius:99px}
.fx.go .fxt{animation:fxPop .7s cubic-bezier(.3,1.7,.5,1) both}.fx.go .fxs{animation:fxPop .5s .25s cubic-bezier(.3,1.7,.5,1) both}
.fx.t0 .fxt{color:#c9c4da;font-size:clamp(30px,6vw,72px);text-shadow:3px 3px 0 var(--ink)}
.fx.go.t0 .fxt{animation:fxMid 1.8s ease both}
.fx.t1 .fxt{color:#5fdc98}.fx.t2 .fxt{color:#c09bff}.fx.t3 .fxt{color:#ffcf33}
.fx.go.t2 .fxt{animation:fxPop .7s cubic-bezier(.3,1.7,.5,1) both,fxWob .25s .7s 4}
.fx.t3 .rays,.fx.t4 .rays,.fx.t5 .rays{opacity:.75}
.fx.go.t3 .fxt{animation:fxSlam .8s cubic-bezier(.2,1.4,.5,1) both}
.fx.t4 .fxt,.fx.t5 .fxt{background:linear-gradient(90deg,#ff5fa2,#ffd23f,#3dffb6,#5e8bff,#c77dff,#ff5fa2);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(5px 5px 0 var(--ink))}
.fx.go.t4 .fxt{animation:fxSlam .9s cubic-bezier(.2,1.4,.5,1) both,infSlide 1.2s linear infinite}
.fx.go.t5 .fxt{animation:fxSlam 1.2s cubic-bezier(.2,1.4,.5,1) both,infSlide .8s linear infinite}
.fx.t5{background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),transparent 60%)}
@keyframes fxPop{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1) rotate(-3deg)}}
@keyframes fxMid{0%{transform:scale(.4);opacity:0}25%{transform:scale(1);opacity:1}60%{transform:translateY(0) rotate(0)}100%{transform:translateY(40px) rotate(9deg) scale(.9);opacity:.2}}
@keyframes fxWob{50%{transform:rotate(3deg) scale(1.04)}}
@keyframes fxSlam{0%{transform:scale(4);opacity:0}55%{transform:scale(.9);opacity:1}75%{transform:scale(1.08) rotate(-3deg)}100%{transform:scale(1) rotate(-3deg)}}
.emote{position:fixed;z-index:6;transform:translate(-50%,-100%);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;font-weight:800;font-size:20px;white-space:nowrap;pointer-events:none;box-shadow:3px 3px 0 var(--ink);animation:fxPop .5s cubic-bezier(.3,1.7,.5,1)}
.emote::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
.emote.t0{background:#ecebf2;color:#6b6391}.emote.t4,.emote.t5{background:linear-gradient(90deg,#ffd1ea,#fff3b8,#c9fff0,#d6e4ff)}
#stage.quake{animation:quake .6s}
@keyframes quake{10%,50%,90%{transform:translate(-6px,3px)}30%,70%{transform:translate(6px,-4px)}}
.tabs{display:flex;gap:6px}
.tab{border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);font-family:var(--f-display);font-size:14px;padding:4px 12px;cursor:pointer;letter-spacing:.04em}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sun)}
.tab span{font-family:var(--f-data);font-size:12px}
.chip small{font-family:var(--f-data);font-size:10px;opacity:.8;margin-left:2px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0 8px}
.shead b{font-family:var(--f-display);font-weight:400;font-size:18px}
.btn.sm{flex:0 0 auto;padding:4px 10px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
.mkt{background:var(--paper-2);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.5;margin-bottom:10px}
.mkt b{font-family:var(--f-data);font-weight:400;font-size:14px}
.invlist{display:flex;flex-direction:column;gap:8px}
.inv{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--paper)}
.inv.on{box-shadow:0 0 0 3px var(--pink)}
.inv .pill{font-family:var(--f-data);font-size:11px;padding:1px 6px;border-radius:6px;background:var(--t);border:1.5px solid var(--ink)}
.inv .iname{min-width:0}.inv .iname b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv .iname small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv .ival{font-family:var(--f-display);font-size:16px;color:#14a35c;font-variant-numeric:tabular-nums}
.inv .iact{grid-column:1/-1;display:flex;gap:6px}
.ib{border:2px solid var(--ink);border-radius:8px;background:var(--paper);font-weight:800;font-size:12px;padding:3px 9px;cursor:pointer}
.ib.fav[aria-pressed="true"]{background:var(--sun)}
.ib.sell{margin-left:auto;background:#d9f7e6}.ib.sell.arm{background:#ff3d5a;color:#fff}
.ib:disabled{opacity:.4;cursor:default}
.sfoot{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 6px}
.sfoot .btn{flex:1 1 auto}
.btn.danger.arm{background:#ff3d5a;color:#fff}
.pnl{font-weight:800;font-size:13px;margin:-4px 0 10px}.pnl.up{color:#14a35c}.pnl.down{color:#e8264c}
#modal{position:fixed;inset:0;z-index:20;background:rgba(27,20,64,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:14px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;justify-content:space-between;align-items:center}.mhead b{font-family:var(--f-display);font-weight:400;font-size:20px}
#mText{width:100%;min-height:200px;font-family:var(--f-data);font-size:12px;border:2px solid var(--ink);border-radius:10px;padding:8px;background:var(--paper-2);color:var(--ink);resize:vertical;box-sizing:border-box}
.row.wrap{flex-wrap:wrap}
.tag.cash{background:#2fd17a;color:var(--ink);border:2px solid var(--ink);padding:0 8px}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-top:2px dashed #d9d2f2;border-bottom:2px dashed #d9d2f2;padding:6px 0;margin:0 0 6px}
.price span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.price b{font-family:var(--f-display);font-weight:400;font-size:30px;color:#14a35c;font-variant-numeric:tabular-nums}
.drivers{font-size:11px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.drivers b{color:var(--ink);font-weight:800}
.shinybtn{margin-top:6px;border:2px dashed var(--ink);background:var(--paper);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;cursor:pointer}
.shinybtn[aria-pressed="true"]{border-style:solid;background:linear-gradient(90deg,#ff9ed0,#ffe98a,#9effd8,#9ec2ff,#d9a8ff);animation:hue 3s linear infinite}
.shinybtn:disabled{opacity:.35;cursor:default}
.traits span.sh{background:linear-gradient(90deg,#ffd1ea,#fff3b8,#c9fff0)}
.badge{max-width:62%;line-height:1.1;text-align:center}
.badge.long{font-size:15px}
.badge.secret{background:linear-gradient(90deg,#ff5fa2,#ffd23f,#3dffb6,#5e8bff,#c77dff);animation:hue 2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.stars{font-size:18px;letter-spacing:2px;color:var(--sun);-webkit-text-stroke:1px var(--ink)}
.no{font-family:var(--f-data);font-size:13px;color:var(--muted)}
#card h2{margin:10px 0 0;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;text-wrap:balance}
#card .species{margin:4px 0 10px;font-weight:800;color:var(--blue)}
.traits{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.traits span{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:2px solid var(--ink);background:var(--paper-2)}
.traits span.t2{background:#e6dcff}.traits span.t3{background:#fff1b8}.traits span.t4{background:#ffd1e6}
.row{display:flex;gap:8px}
.btn{flex:1;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:8px 10px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.hot{background:var(--sun)}

/* panel */
#panel{position:fixed;z-index:8;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:var(--panel-w);
  background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;transition:transform .4s cubic-bezier(.3,1.2,.5,1)}
#panel.closed{transform:translateX(calc(100% + 40px))}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:3px solid var(--ink)}
.phead b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.04em}
.phead .meta{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.pbody{overflow-y:auto;padding:4px 14px 16px;min-height:0;flex:1;overscroll-behavior:contain}
.sec{border-bottom:2px dashed #d9d2f2;padding:12px 0}
.sec:last-child{border-bottom:0}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sechead h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.lock{border:2px solid var(--ink);background:var(--paper);border-radius:8px;font-size:11px;font-weight:800;padding:1px 8px;cursor:pointer;letter-spacing:.06em}
.lock[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
.field{margin:8px 0}
.flabel{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
.flabel output{font-family:var(--f-data);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:2px solid var(--ink);background:var(--paper);border-radius:99px;padding:3px 10px 3px 8px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--t,#9cc9ff);border:1.5px solid var(--ink)}
.chip[aria-pressed="true"]{background:var(--pink);color:var(--paper)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);cursor:pointer;position:relative;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.sw.t3::after,.sw.t4::after{content:"";position:absolute;right:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--sun);border:1.5px solid var(--ink)}
.sw.t4::after{background:var(--pink)}
input[type=range]{width:100%;accent-color:var(--pink)}
.codebox{display:flex;gap:6px}
.codebox input{flex:1;min-width:0;font-family:var(--f-data);font-size:14px;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;background:var(--paper-2);color:var(--ink)}
.codebox .btn{flex:0 0 auto;padding:6px 10px;font-size:12px}
.note{font-size:11px;color:var(--muted);margin-top:5px;min-height:1em}
.toggles{display:flex;flex-wrap:wrap;gap:5px}
.pulls{display:flex;flex-wrap:wrap;gap:5px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
"use strict";
/* ================= DATA ================= */
const OPTR=['Common','Uncommon','Rare','Epic','Mythic','Ultimate'];
const PULL=['Mid','Strong','Generational','S-Tier','Absolutely GOATed','∞ Infinite Neko'];
const PULLS=['MID','STRONG','GEN','S-TIER','GOAT','∞'];
const TIERCOL=['#8fc6ff','#5fdc98','#c09bff','#ffcf33','#ff5fa2','#ffffff'];
const TIERW=[52,26,13,5,1.4,0.04];
const OPT={
  style:[['Mochi',0],['PS2',1],['Voxel',2],['Real Fur',3]],

  tail:[['Long',0],['Bob',1],['Fluffy',1],['Curl',2],['Twin',4]],

};
const GEAR=['head','neck','face','back','extra'];
const FUR=[['Snow','#f7f4ef',0],['Cream','#f2d6a2',0],['Ginger','#f08a3c',0],['Ash','#9aa0ab',0],['Ink','#2a2733',0],['Cocoa','#7a4e33',0],
  ['Sky','#7fc8ff',1],['Sakura','#ff9ec4',1],['Matcha','#9fd47a',1],['Lilac','#b49cff',2],['Lemon','#ffe45c',2],['Chrome','#c9d6e8',3],['Neon','#3dffb6',3],['Void','#120e2a',4]];
const EYE=[['Gold','#ffc93c',0],['Jade','#3fbf7f',0],['Azure','#3d7bff',0],['Amber','#ff8a1f',1],['Rose','#ff4f8b',2],['Ice','#a8f0ff',2],['Blood','#e3192f',3],['Prism','#ffffff',4]];
const SLIDERS={headSize:'Head size',legs:'Leg length',earSize:'Ear size'};
const KEYS=['style','shape','pattern','eyes','mouth','blush','ears','tail','head','neck','pose','mood','fur','acc','eye','headSize','legs','earSize','legCount','eyeCount','face','back','extra','shiny','material'];
const LEGACY_LEN=18;
const SECTIONS=[
  {id:'build',title:'Build',keys:['style','material','shape','legCount','headSize','legs']},
  {id:'fur',title:'Fur',keys:['pattern','fur','acc']},
  {id:'face',title:'Face',keys:['eyes','eyeCount','eye','mouth','blush']},
  {id:'ears',title:'Ears & Tail',keys:['ears','earSize','tail']},
  {id:'gear',title:'Gear',keys:['head','neck','face','back','shiny']},
  {id:'kawaii',title:'Kawaii',keys:['extra','pose']},
  {id:'soul',title:'Soul',keys:['mood']},
];
const LABEL={style:'Build style',shape:'Body',pattern:'Pattern',fur:'Fur colour',acc:'Accent colour',eyes:'Eye style',eye:'Eye colour',mouth:'Mouth',blush:'Blush',ears:'Ear type',tail:'Tail',head:'Head gear',neck:'Neck gear',pose:'Pose',mood:'Mood',legCount:'Legs',eyeCount:'Eye count',face:'Face gear',back:'Back gear',extra:'Kawaii extra',material:'Body material'};
function tierOf(k,v){ if(k==='shiny') return 0; if(OPT[k]) return OPT[k][v][1]; if(k==='fur'||k==='acc') return FUR[v][2]; if(k==='eye') return EYE[v][2]; return 0; }
const isShiny=(a,slot)=>a[slot]>0&&((a.shiny>>GEAR.indexOf(slot))&1)===1;
const shinyCount=a=>GEAR.filter(g=>isShiny(a,g)).length;

/* ================= RNG / NOISE ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function h3(x,y,z,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1440662683)^Math.imul(s|0,-1640531535);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);let xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);const L=(a,b,t)=>a+(b-a)*t;
  const c=(i,j,k)=>h3(xi+i,yi+j,zi+k,s);
  return L(L(L(c(0,0,0),c(1,0,0),u),L(c(0,1,0),c(1,1,0),u),v),L(L(c(0,0,1),c(1,0,1),u),L(c(0,1,1),c(1,1,1),u),v),w)}
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ================= STATE ================= */
let A=defaultAttrs();
const locks={};
let pulls=[]; try{pulls=JSON.parse(localStorage.getItem('nekogacha.pulls')||'[]')||[]}catch(e){pulls=[]}
let pullCount=0; try{pullCount=+localStorage.getItem('nekogacha.count')||0}catch(e){}
let wallet=0; try{wallet=+localStorage.getItem('nekogacha.wallet')||0}catch(e){}
const prefs={res:0.5,wobble:true,sound:true,spin:false,furLen:1,shells:24};
if(matchMedia('(pointer:coarse)').matches)prefs.shells=16;
try{Object.assign(prefs,JSON.parse(localStorage.getItem('nekogacha.prefs')||'{}'))}catch(e){}
function savePrefs(){try{localStorage.setItem('nekogacha.prefs',JSON.stringify(prefs))}catch(e){}}
function defaultAttrs(){return{style:0,shape:0,pattern:1,eyes:1,mouth:0,blush:1,ears:0,tail:0,head:0,neck:1,pose:1,mood:0,fur:2,acc:0,eye:0,headSize:5,legs:3,earSize:4,legCount:0,eyeCount:0,face:0,back:0,extra:1,shiny:0,material:0}}

function encode(a){return 'NEKO-'+KEYS.map(k=>a[k].toString(36)).join('').toUpperCase()}
function decode(s){s=String(s||'').trim().toUpperCase().replace(/^NEKO-?/,'');if(s.length===LEGACY_LEN||s.length===24)s+='0'.repeat(KEYS.length-s.length);if(s.length!==KEYS.length)return null;const a={};
  for(let i=0;i<KEYS.length;i++){const k=KEYS[i];const v=parseInt(s[i],36);if(isNaN(v))return null;
    const max=k==='shiny'?32:OPT[k]?OPT[k].length:(k==='fur'||k==='acc')?FUR.length:k==='eye'?EYE.length:10;if(v>=max)return null;a[k]=v}return a}

function pickWeighted(list,tierFn,rng,W=TIERW){let tot=0;const w=list.map((x,i)=>{const t=W[tierFn(i)];tot+=t;return t});let r=rng()*tot;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}return w.length-1}
function rollAttrs(rng,CP={w:TIERW,shiny:0.07}){const a={...A};const lockedKeys=new Set();SECTIONS.forEach(s=>{if(locks[s.id])s.keys.forEach(k=>lockedKeys.add(k))});
  for(const k of KEYS){if(lockedKeys.has(k)||k==='shiny')continue;
    if(OPT[k])a[k]=pickWeighted(OPT[k],i=>OPT[k][i][1],rng,CP.w);
    else if(k==='fur'||k==='acc')a[k]=pickWeighted(FUR,i=>FUR[i][2],rng,CP.w);
    else if(k==='eye')a[k]=pickWeighted(EYE,i=>EYE[i][2],rng,CP.w);
    else a[k]=Math.floor(rng()*10)}
  const lum=i=>{const c=new THREE.Color(FUR[i][1]);return c.r*0.3+c.g*0.59+c.b*0.11};
  if(!lockedKeys.has('acc')){let g=0;while((a.acc===a.fur||(a.pattern>0&&Math.abs(lum(a.acc)-lum(a.fur))<0.22))&&g++<40)a.acc=pickWeighted(FUR,i=>FUR[i][2],rng)}
  if(!lockedKeys.has('shiny')){let m=0;GEAR.forEach((g,i)=>{if(a[g]>0&&rng()<CP.shiny)m|=1<<i});a.shiny=m}
  return a}
const VAL=[0,1,3,8,20,100];
function score(a){let s=0;for(const k of KEYS)s+=VAL[tierOf(k,a[k])];return s+14*shinyCount(a)}
const PULL_AT=[0,21,31,41,52];
function rarity(a){if(a.material===7)return 5;const s=score(a);let t=0;for(let i=1;i<5;i++)if(s>=PULL_AT[i])t=i;return t}
const USD=[0,4,15,60,240,Infinity];const MATUSD=[0,30,80,120,400,600,2500,Infinity];
function traitName(k,a){const v=a[k];if(k==='legCount')return OPT.legCount[v][0]+' legs';if(k==='eyeCount')return v===1?'1 eye':OPT.eyeCount[v][0]+' eyes';
  if(k==='fur')return FUR[v][0]+' fur';if(k==='acc')return FUR[v][0]+' accent';if(k==='eye')return EYE[v][0]+' eyes';if(k==='style')return OPT.style[v][0]+' build';if(k==='mood')return OPT.mood[v][0]+' mood';if(k==='material')return OPT.material[v][0]+' body';return OPT[k]?OPT[k][v][0]:k}
function appraise(a){const parts=[];for(const k of KEYS){const t=tierOf(k,a[k]);if(t>0)parts.push({label:traitName(k,a),v:k==='material'?MATUSD[a[k]]:USD[t],t})}
  GEAR.forEach(g=>{if(isShiny(a,g))parts.push({label:'Shiny '+OPT[g][a[g]][0],v:175,t:4,shiny:1})});
  const sum=3+parts.reduce((x,p)=>x+p.v,0);let mult=1;const syn=[];
  const S=(ok,label,m)=>{if(ok){mult*=m;syn.push({label,m})}};
  S(a.legCount===2&&a.eyeCount===5,'Spider-neko',2);S(a.fur===13&&a.pattern===7,'Void Grid',1.5);
  S(a.pose===1&&(a.neck===3||a.neck===5),'Lucky Maneki',1.4);S(a.back===3&&a.head===6,'Holy Combo',1.5);
  S(shinyCount(a)>=2,'Shiny Set',1.6);S(a.style===3&&a.tail===2,'Mega Floof',1.3);S(a.mood===3&&a.eyes===4,'Corrupted Visor',1.3);S(a.material===4&&a.pose===1,'Golden Maneki',2);S(a.material===6&&a.head===4,'Crown Jewel',1.5);S(a.material===2&&a.extra===4,'Full Goo',1.3);S(a.material===3&&a.pattern===7,'Chrome Grid',1.4);
  const noise=0.9+0.2*((strHash(encode(a)+'$')%1000)/1000);
  parts.sort((x,y)=>y.v-x.v);return{total:Math.max(1,Math.round(sum*mult*noise)),parts,syn}}
const money=v=>isFinite(v)?(v<0?'-$':'$')+Math.round(Math.abs(v)).toLocaleString('en-US'):'∞';
const SYL=['mo','chi','ku','ro','ta','ma','ne','ko','pi','su','shi','ji','ka','nya','to','fu','ri','yu','po','n','zu','me'];
const SUF=['-maru','-chan','-tan','','-kun','-hime','-dono','-bō'];
function identity(a){const code=encode(a);const r=mulberry(strHash(code));let n='';const L=2+Math.floor(r()*2);for(let i=0;i<L;i++)n+=SYL[Math.floor(r()*SYL.length)];
  n=n[0].toUpperCase()+n.slice(1)+SUF[Math.floor(r()*SUF.length)];
  const pat=a.material>0?OPT.material[a.material][0]:OPT.pattern[a.pattern][0];let base=['Mochineko','Polyneko','Voxelneko','Fuzzneko'][a.style];
  if(a.pose===1)base=a.style===2?'Voxel Manekineko':'Manekineko';if(a.tail===4)base='Nekomata';if(a.back===3)base='Tenshineko';if(a.back===4)base='Rocketneko';if(a.legCount===2&&a.eyeCount>=4)base='Spiderneko';if(a.mood===3)base='Bugneko';
  return{name:n,species:(pat==='Solid'?FUR[a.fur][0]:pat)+' '+base,no:String(strHash(code)%1000).padStart(3,'0'),code}}

/* ================= THREE SETUP ================= */
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setClearColor(0xbfe9ff);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const HORIZON=new THREE.Color('#ffd6ea');
scene.fog=new THREE.Fog(HORIZON,22,70);
const camera=new THREE.PerspectiveCamera(32,1,0.1,300);
const camTarget=new THREE.Vector3(0,1.75,0);
scene.add(new THREE.HemisphereLight(0xdff2ff,0x8a6fb0,0.8));
const sun=new THREE.DirectionalLight(0xfff1dc,0.75);sun.position.set(4,7,6);scene.add(sun);
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-4,right:4,top:5,bottom:-3,near:1,far:25});sun.shadow.bias=-0.0008;sun.shadow.radius=4;sun.shadow.camera.updateProjectionMatrix();

const SNAP={value:new THREE.Vector2(320,240)},SNAPON={value:1};
function ps2(mat){mat.onBeforeCompile=sh=>{sh.uniforms.uSnap=SNAP;sh.uniforms.uSnapOn=SNAPON;
  sh.vertexShader='uniform vec2 uSnap;uniform float uSnapOn;\n'+sh.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\nif(uSnapOn>0.5){gl_Position.xy=floor(gl_Position.xy/gl_Position.w*uSnap+0.5)/uSnap*gl_Position.w;}')};return mat}
const MAT={
  lit:ps2(new THREE.MeshLambertMaterial({vertexColors:true})),
  basic:ps2(new THREE.MeshBasicMaterial({vertexColors:true})),
  basic2:ps2(new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide})),
  lit2:ps2(new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})),
  line:ps2(new THREE.LineBasicMaterial({vertexColors:true})),

};

/* ---- Real Fur style: PBR mats, env reflection, shell fur ---- */
MAT.skin=new THREE.MeshStandardMaterial({vertexColors:true,color:0x6d6a70,roughness:1});
MAT.glass=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.06,metalness:0});
MAT.gold=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.22,metalness:1});
MAT.wet=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.32});
MAT.std=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.6});
MAT.ear=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,envMapIntensity:0.15,color:0xd8c0c4});MAT.std.envMapIntensity=0.5;MAT.skin.envMapIntensity=0.3;
MAT.std2=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.6,side:THREE.DoubleSide});
const MATU={uTime:{value:0}};
function wobbly(mat,amp,fr){mat.onBeforeCompile=sh=>{sh.uniforms.uTime=MATU.uTime;sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',
  '#include <begin_vertex>\ntransformed+=normal*('+amp.toFixed(4)+'*sin(uTime*3.1+position.y*'+fr.toFixed(3)+'+position.x*'+(fr*0.7).toFixed(3)+')*sin(uTime*2.3+position.z*'+fr.toFixed(3)+'));')};return mat}
function irid(mat){mat.onBeforeCompile=sh=>{sh.uniforms.uTime=MATU.uTime;sh.fragmentShader='uniform float uTime;\n'+sh.fragmentShader
  .replace('#include <color_fragment>','#include <color_fragment>\nvec3 nn=normalize(vNormal);float hh=fract(nn.x*0.45+nn.y*0.3+nn.z*0.2+uTime*0.12+vViewPosition.y*0.06);vec3 irr=clamp(abs(mod(hh*6.0+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);diffuseColor.rgb=mix(irr,vec3(1.),0.12);')
  .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\ntotalEmissiveRadiance+=irr*0.28;')};return mat}
const MATL=[null,
  new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.2,metalness:0,envMapIntensity:0.9}),
  wobbly(new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.04,metalness:0,transparent:true,opacity:0.6,envMapIntensity:1.4}),0.028,6),
  new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.05,metalness:1}),

const PMAX=180;

const parts=[];const _o=new THREE.Object3D();

function burst(at,tier){const n=tier>=3?160:90;const cols=tier>=4?['#ff5fa2','#ffd23f','#3dffb6','#5e8bff','#c77dff','#ffffff']:[TIERCOL[tier],'#ffffff','#ffd23f','#ff5fa2','#5e8bff'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,u=Math.random()*2-1,s=3+Math.random()*6;const r=Math.sqrt(1-u*u);
    parts.push({p:at.clone(),v:new THREE.Vector3(Math.cos(a)*r*s,Math.abs(u)*s+3,Math.sin(a)*r*s*0.6+2),r:new THREE.Euler(Math.random()*6,Math.random()*6,0),w:Math.random()*10-5,life:1.6+Math.random(),c:new THREE.Color(cols[i%cols.length]),sc:0.6+Math.random()*1.2})}
  while(parts.length>PMAX)parts.shift()}
function stepParticles(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue}
    q.v.y-=9*dt;q.v.multiplyScalar(1-1.2*dt);q.p.addScaledVector(q.v,dt);if(q.p.y<0.05){q.p.y=0.05;q.v.y*=-0.3;q.v.x*=0.6;q.v.z*=0.6}q.r.x+=q.w*dt;q.r.y+=q.w*0.7*dt}
  for(let i=0;i<PMAX;i++){const q=parts[i];if(q){_o.position.copy(q.p);_o.rotation.copy(q.r);_o.scale.setScalar(q.sc*Math.min(1,q.life*2));pMesh.setColorAt(i,q.c)}else{_o.scale.setScalar(0);_o.position.set(0,-50,0)}
    _o.updateMatrix();pMesh.setMatrixAt(i,_o.matrix)}
  pMesh.instanceMatrix.needsUpdate=true;if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true}

let AC=null;function ac(){if(!prefs.sound)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function blip(f0,f1,dur,type='square',vol=0.08,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.02)}
function meow(pitch=1){const a=ac();if(!a)return;const t=a.currentTime;const o=a.createOscillator(),o2=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();
  o.type='sawtooth';o2.type='triangle';const p=pitch*(0.9+Math.random()*0.25);
  [o,o2].forEach((x,k)=>{x.frequency.setValueAtTime(520*p*(k?2:1),t);x.frequency.linearRampToValueAtTime(820*p*(k?2:1),t+0.12);x.frequency.exponentialRampToValueAtTime(380*p*(k?2:1),t+0.42)});
  f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(2200,t+0.15);f.frequency.linearRampToValueAtTime(700,t+0.42);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.05);g.gain.exponentialRampToValueAtTime(0.0008,t+0.45);
  o.connect(f);o2.connect(f);f.connect(g).connect(a.destination);o.start(t);o2.start(t);o.stop(t+0.5);o2.stop(t+0.5)}
function jingle(tier){const notes=[523,659,784,1047,1319,1568,2093,2637];const n=2+tier;for(let i=0;i<n;i++)blip(notes[i],notes[i]*1.01,0.16,'square',0.06,i*0.09);if(tier>=3)blip(2093,2093,0.5,'triangle',0.05,n*0.09)}

function starter(g){const a=defaultAttrs();g.inv.push({id:g.nextId++,code:encode(a),name:identity(a).name,fav:false});g.active=g.inv[0].id}
function loadGame(){try{const g=unpackSave(JSON.parse(localStorage.getItem('nekogacha.save')||'null'));if(g)GS=g}catch(e){}
  if(!GS.inv.length&&GS.pulls===0)starter(GS);if(!GS.market.hot)rollTrends()}
const activeItem=()=>GS.inv.find(i=>i.id===GS.active)||null;
const TREND_KEYS=['pattern','eyes','ears','tail','head','neck','face','back','extra','material','legCount','eyeCount','mood','shape','style'];
function rollTrends(){const pick=()=>{const k=TREND_KEYS[Math.floor(Math.random()*TREND_KEYS.length)];const o=OPT[k].map((_,i)=>i).filter(i=>i>0&&!(k==='material'&&i===7));return{k,v:o[Math.floor(Math.random()*o.length)]}};
  const m=GS.market;m.hot=pick();do{m.cold=pick()}while(m.cold.k===m.hot.k&&m.cold.v===m.hot.v)}
function marketStep(){const m=GS.market;m.prev=m.idx;m.idx=clamp(m.idx*Math.exp((Math.random()-0.5)*0.18),0.55,1.9);m.n++;if(m.n%8===0){rollTrends();toast(`Market shift: ${trendLabel(m.hot)} is hot, ${trendLabel(m.cold)} is not.`)}}
function worth(a){let v=appraise(a).total;if(!isFinite(v))return v;const m=GS.market;v*=m.idx;if(m.hot&&a[m.hot.k]===m.hot.v)v*=2.5;if(m.cold&&a[m.cold.k]===m.cold.v)v*=0.5;return Math.max(1,Math.round(v))}
const sellPrice=a=>{const w=worth(a);return isFinite(w)?Math.max(1,Math.round(w*SELL_CUT)):Infinity};
const trendLabel=t=>t?OPT[t.k][t.v][0]+(t.k==='legCount'?' legs':t.k==='eyeCount'?' eyes':t.k==='material'?' body':''):'—';
function netWorth(){let n=GS.bank;for(const it of GS.inv){if(it.imp)continue;const a=decode(it.code);if(a)n+=worth(a)}return n}
function optCost(k,v){if(k==='material')return MATCOST[v];if(SLIDERS[k]||k==='blush')return 0;return COST[tierOf(k,v)]}
function lockCost(){let c=0;SECTIONS.forEach(sc=>{if(!locks[sc.id])return;c+=20;sc.keys.forEach(k=>{if(k==='shiny'){c+=shinyCount(A)*120;return}c+=0.5*(k==='material'?MATUSD[A[k]]:USD[tierOf(k,A[k])])})});return Math.round(c)}
const rollPrice=()=>CAPS[GS.capsule].cost+(cat?lockCost():0);
const capCost=()=>300*(1+(GS.cap-12)/4);
function labelOf(k,v){if(OPT[k])return OPT[k][v][0]+(k==='material'?' body':'');if(k==='eye')return EYE[v][0]+' eyes';return FUR[v][0]+(k==='fur'?' fur':' accent')}

/* ---- toasts, floats, coins, quake ---- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)}
const bankEl=$('#bank'),netEl=$('#net'),bankBox=$('#bankbox');
function tween(el,from,to,ms){cancelAnimationFrame(el._raf);if(!isFinite(to)){el.textContent='∞';return}if(!isFinite(from))from=to;const t0=performance.now();
  const step=()=>{const k=Math.min(1,(performance.now()-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=money(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(step)};step()}
function floatDelta(text,dir,lvl,label){const r=bankBox.getBoundingClientRect();const f=document.createElement('div');f.className=`float ${dir} l${lvl}`;f.textContent=text;
  if(label){const sm=document.createElement('small');sm.textContent=label;f.appendChild(sm)}f.style.left=(r.right+10)+'px';f.style.top=(r.top+12)+'px';$('#fxlayer').appendChild(f);setTimeout(()=>f.remove(),1700)}
function coins(n){const r=bankBox.getBoundingClientRect(),tx=r.left+40,ty=r.top+30;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)return;
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='coin';c.textContent='$';$('#fxlayer').appendChild(c);
    const x0=innerWidth*0.5+(Math.random()-0.5)*innerWidth*0.4,y0=innerHeight*0.55+(Math.random()-0.5)*120;
    const an=c.animate([{transform:`translate(${x0}px,${y0}px) scale(.3)`,opacity:0},{transform:`translate(${x0+(Math.random()-0.5)*160}px,${y0-80-Math.random()*120}px) scale(1.2)`,opacity:1,offset:.35},{transform:`translate(${tx}px,${ty}px) scale(.5)`,opacity:.6}],
      {duration:850+Math.random()*500,delay:i*28,easing:'cubic-bezier(.45,0,.6,1)',fill:'forwards'});an.onfinish=()=>c.remove()}
  for(let i=0;i<Math.min(6,n/4);i++)blip(1568+i*90,2093+i*90,0.07,'square',0.03,0.6+i*0.07)}
function quake(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;canvas.classList.remove('quake');void canvas.offsetWidth;canvas.classList.add('quake')}
function shakeBank(){bankBox.classList.remove('deny','up','down','l1','l2');void bankBox.offsetWidth;bankBox.classList.add('deny');blip(140,90,0.18,'square',0.06)}
function bankFX(old,now,label){if(old===now)return;
  if(!isFinite(now)){bankBox.className='bankbox inf';bankEl.textContent='∞';floatDelta('∞ INFINITE MONEY','up',2,label);coins(70);quake();return}
  const d=now-old,mag=Math.abs(d),lvl=mag>=2500?2:mag>=500?1:0;bankBox.classList.remove('up','down','l0','l1','l2','deny');void bankBox.offsetWidth;bankBox.classList.add(d>0?'up':'down','l'+lvl);
  tween(bankEl,old,now,450+Math.min(1800,Math.log10(1+mag)*380));floatDelta((d>0?'+':'−')+money(mag),d>0?'up':'down',lvl,label);if(d>0&&lvl>0)coins(lvl===2?40:16);if(lvl===2)quake()}
function setBank(v,label){const old=GS.bank;GS.bank=v;saveGame();bankFX(old,v,label);updateHUD()}
function addBank(d,label){setBank(GS.bank+d,label)}
let netShown=null;
function updateHUD(){const pc=$('#pullcount');if(pc)pc.textContent='PULL '+String(GS.pulls).padStart(3,'0');
  $('#knobLabel').textContent='ROLL '+money(rollPrice());
  document.querySelectorAll('.capbtn').forEach((b,i)=>b.setAttribute('aria-pressed',i===GS.capsule));
  const nw=netWorth();if(netShown===null){netEl.textContent=money(nw)}else if(nw!==netShown)tween(netEl,netShown,nw,900);netShown=nw;
  const m=GS.market,arrow=m.idx>m.prev?'▲':m.idx<m.prev?'▼':'•';
  $('#ticker').innerHTML=`MKT ${m.idx.toFixed(2)}× ${arrow} · <span class="hot">HOT ${trendLabel(m.hot)}</span> · <span class="cold">NOT ${trendLabel(m.cold)}</span>`;
  const sc=$('#shelfCount');if(sc)sc.textContent=GS.inv.length+'/'+GS.cap;
  if(isFinite(GS.bank))bankBox.classList.remove('inf');else{bankBox.classList.add('inf');bankEl.textContent='∞'}}
function renderCaps(){const el=$('#caps');el.innerHTML='';CAPS.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='capbtn c'+i;b.setAttribute('role','radio');
  b.innerHTML=`${c.name}<small>${money(c.cost)}</small>`;b.onclick=()=>{GS.capsule=i;saveGame();updateHUD();blip(600+i*200,800+i*200,0.08,'square',0.04)};el.appendChild(b)});updateHUD()}

/* ---- buying, selling, shelf ---- */
function commitActive(){const it=activeItem();if(!it)return;it.code=encode(A);saveGame();renderShelf();updateHUD();if(it.fav)refreshDisplays()}
function buy(k,v){if(state!=='idle'&&state!=='reveal')return;if(!activeItem()){toast('Pick a neko from your shelf first, or pull one.');return}
  if(A[k]===v)return;const c=optCost(k,v);
  if(c===null){toast('Iridescent can only come out of a capsule. Good luck.');shakeBank();return}
  if(c>GS.bank){toast(`${labelOf(k,v)} costs ${money(c)}. You have ${money(GS.bank)}.`);shakeBank();return}
  A[k]=v;if(GEAR.includes(k)&&v===0)A.shiny&=~(1<<GEAR.indexOf(k));commitActive();if(c>0){addBank(-c,'Bought '+labelOf(k,v));blip(880,660,0.1,'square',0.05)}edit()}
function buyShiny(k){if(state!=='idle'&&state!=='reveal')return;if(!activeItem())return;const bit=1<<GEAR.indexOf(k);
  if(A.shiny&bit){A.shiny&=~bit;commitActive();edit();return}
  if(SHINY_COST>GS.bank){toast(`Shiny upgrade costs ${money(SHINY_COST)}.`);shakeBank();return}
  A.shiny|=bit;commitActive();addBank(-SHINY_COST,'Shiny '+OPT[k][A[k]][0]);blip(1568,2637,0.25,'triangle',0.05);edit()}
function viewItem(id){const it=GS.inv.find(i=>i.id===id);if(!it)return;const a=decode(it.code);if(!a)return;GS.active=id;A=a;saveGame();hideCard();setCat(A,true);renderShelf();meow()}
function sellItem(id,silent){const ix=GS.inv.findIndex(i=>i.id===id);if(ix<0)return 0;const it=GS.inv[ix];if(it.imp){toast('Imported nekos are display-only and can’t be sold.');return 0}
  const a=decode(it.code);const price=sellPrice(a);GS.inv.splice(ix,1);
  if(GS.active===id){const nx=GS.inv[0];if(nx){GS.active=nx.id;A=decode(nx.code);setCat(A,true)}else{GS.active=0;clearCat()}hideCard()}
  if(!silent){addBank(price,'Sold '+it.name);blip(1319,1760,0.1,'square',0.05)}
  if(it.fav)refreshDisplays();saveGame();renderShelf();updateHUD();return price}
function clearCat(){if(cat){holder.remove(cat);cat=null}shadow.scale.setScalar(0.001)}
function renderShelf(){const el=$('#shelf');if(!el)return;const m=GS.market;
  el.innerHTML=`<div class="shead"><b>Shelf ${GS.inv.length}/${GS.cap}</b><button class="btn sm" id="capUp" type="button">+4 slots ${money(capCost())}</button></div>
  <div class="mkt">Market index <b>${m.idx.toFixed(2)}×</b>. Hot right now: <b class="hot">${trendLabel(m.hot)}</b> sells for 2.5×. Cooling off: <b>${trendLabel(m.cold)}</b> sells for 0.5×. Trends change every 8 pulls; you get ${Math.round(SELL_CUT*100)}% of market value when you sell.</div>
  <div class="invlist" id="invlist"></div>
  <div class="sfoot"><button class="btn" id="sellMid" type="button">Sell all Mid</button><button class="btn" id="expSave" type="button">Export save</button><button class="btn" id="impSave" type="button">Import .json</button><button class="btn danger" id="restart" type="button">Restart</button></div>
  <div class="note">★ puts a neko on display behind the stage (up to ${FAV_MAX}). Selling, viewing and buying traits all use your bank.</div>`;
  const list=$('#invlist');if(!GS.inv.length)list.innerHTML='<div class="empty">Your shelf is empty. Pull a capsule to start a collection.</div>';
  GS.inv.forEach(it=>{const a=decode(it.code);if(!a)return;const t=rarity(a),w=worth(a),sp=sellPrice(a);const row=document.createElement('div');row.className='inv'+(it.id===GS.active?' on':'');row.dataset.id=it.id;
    row.innerHTML=`<span class="pill">${PULLS[t]}</span><div class="iname"><b></b><small></small></div><div class="ival">${money(w)}</div>
      <div class="iact"><button class="ib fav" type="button" aria-pressed="${it.fav}" title="Display in the background">★</button><button class="ib view" type="button">${it.id===GS.active?'On stage':'View'}</button><button class="ib sell" type="button" ${it.imp?'disabled':''}>${it.imp?'Imported':'Sell '+money(sp)}</button></div>`;
    row.querySelector('.pill').style.setProperty('--t',t>=5?'linear-gradient(90deg,#ff9ed0,#ffe98a,#9effd8)':TIERCOL[t]);if(t>=5)row.querySelector('.pill').style.background='linear-gradient(90deg,#ff9ed0,#ffe98a,#9effd8,#9ec2ff)';
    row.querySelector('.iname b').textContent=it.name;row.querySelector('.iname small').textContent=identity(a).species;list.appendChild(row)});
  $('#capUp').disabled=GS.cap>=60;$('#shelfCount')&&($('#shelfCount').textContent=GS.inv.length+'/'+GS.cap)}
$('#shelf').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const row=b.closest('.inv');const id=row?+row.dataset.id:0;
  if(b.classList.contains('view'))viewItem(id);
  else if(b.classList.contains('fav')){const it=GS.inv.find(i=>i.id===id);if(!it.fav&&GS.inv.filter(i=>i.fav).length>=FAV_MAX){toast(`You can display ${FAV_MAX} favourites at once.`);return}it.fav=!it.fav;saveGame();renderShelf();refreshDisplays()}
  else if(b.classList.contains('sell')){if(!b.classList.contains('arm')){b.classList.add('arm');const t0=b.textContent;b.textContent='Confirm '+t0.replace('Sell ','');setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.textContent=t0}},2600);return}sellItem(id)}
  else if(b.id==='capUp'){const c=capCost();if(c>GS.bank){toast(`More shelf space costs ${money(c)}.`);shakeBank();return}GS.cap+=4;addBank(-c,'Shelf +4');renderShelf()}
  else if(b.id==='sellMid'){const ids=GS.inv.filter(i=>!i.fav&&!i.imp&&i.id!==GS.active&&rarity(decode(i.code))===0).map(i=>i.id);if(!ids.length){toast('No Mid nekos to clear (favourites and the one on stage are kept).');return}
    let tot=0;ids.forEach(i=>tot+=sellItem(i,true));addBank(tot,`Sold ${ids.length} Mid`)}
  else if(b.id==='expSave')openModal('Save file',JSON.stringify(packSave(),null,1),'neko-gacha-save.json');
  else if(b.id==='impSave')$('#importFile').click();
  else if(b.id==='restart'){if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Wipe everything?';setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.textContent='Restart'}},3000);return}
    GS=newGame();starter(GS);rollTrends();saveGame();bankBox.className='bankbox';applyGame();toast('Fresh start: $1,000 and one starter neko.')}});

/* ---- JSON export / import ---- */
let modalFile='neko.json';
function openModal(title,text,file){modalFile=file;$('#mTitle').textContent=title;$('#mText').value=text||'';$('#mNote').textContent=text?'Download saves a .json file (on iPad it goes to Files). If nothing downloads here, use Copy and keep the text somewhere safe.':'Paste a save or cat .json here, or open a file.';$('#modal').hidden=false}
$('#mClose').onclick=()=>{$('#modal').hidden=true};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});
let DL=null;try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
$('#mDl').onclick=async()=>{const txt=$('#mText').value;if(!txt.trim()){$('#mNote').textContent='Nothing to download yet.';return}
  if(DL){try{const r=await DL.save({filename:modalFile,data:txt});$('#mNote').textContent=r.status==='saved'?'Saved '+modalFile:'Sent.'}catch(e){$('#mNote').textContent=e&&e.code==='declined'?'Download cancelled.':'Download isn’t available here. Use Copy instead.'}return}
  if(window.claude){$('#mNote').textContent='Downloads aren’t available in this view. Use Copy instead.';return}
  try{const blob=new Blob([txt],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=modalFile;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);$('#mNote').textContent='Download started: '+modalFile}catch(e){$('#mNote').textContent='Download isn’t available here. Use Copy instead.'}};
$('#mCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#mText').value);$('#mNote').textContent='Copied to clipboard.'}catch(e){$('#mText').select();$('#mNote').textContent='Selected. Press Ctrl/Cmd+C to copy.'}};
$('#mLoad').onclick=()=>importText($('#mText').value);
$('#mFile').onclick=()=>$('#importFile').click();
$('#importFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f);e.target.value=''});
addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(!f||!/json/i.test(f.type+f.name))return;e.preventDefault();const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f)});
function importText(txt){let o;try{o=JSON.parse(txt)}catch(e){toast('That file isn’t valid JSON.');return}
  if(o&&o.type==='save'){const g=unpackSave(o);if(!g){toast('That save file is missing pieces.');return}GS=g;saveGame();bankBox.className='bankbox';applyGame();$('#modal').hidden=true;toast(`Save loaded: ${GS.inv.length} nekos, ${money(GS.bank)} in the bank.`);return}
  const code=o&&(o.type==='cat'?o.code:o.code);const a=code&&decode(code);if(!a){toast('No neko code found in that file.');return}importCat(a,o.name);$('#modal').hidden=true}
function importCat(a,name){if(GS.inv.length>=GS.cap){toast('Shelf is full. Sell something first.');return}const it={id:GS.nextId++,code:encode(a),name:String(name||identity(a).name).slice(0,40),fav:false,imp:true};
  GS.inv.unshift(it);saveGame();viewItem(it.id);toast(`Imported ${it.name}. Imported nekos are display-only and can’t be sold.`)}
function exportCat(){const it=activeItem();if(!it){toast('Nothing on stage to export.');return}openModal('Cat file',JSON.stringify({app:'neko-gacha',type:'cat',v:1,name:it.name,code:it.code,species:identity(A).species,value:isFinite(worth(A))?worth(A):'inf'},null,1),'neko-'+it.name.replace(/[^a-z0-9-]+/gi,'_')+'.json')}
function applyGame(){const it=activeItem();const a=it&&decode(it.code);if(a){A=a;setCat(A,true)}else clearCat();
  bankEl.textContent=money(GS.bank);netShown=null;refreshDisplays();renderShelf();updateHUD();updateUI()}

/* ---- favourites on display ---- */
const gallery=new THREE.Group();scene.add(gallery);let displays=[];
const DSLOT=[[-4.4,-5.6],[4.4,-5.6],[-8,-7.6],[8,-7.6],[0,-10.5]];
function refreshDisplays(){displays.forEach(d=>{gallery.remove(d.g);d.g.traverse(o=>{if(o.geometry)o.geometry.dispose()})});displays=[];
  GS.inv.filter(i=>i.fav).slice(0,FAV_MAX).forEach((it,i)=>{const a=decode(it.code);if(!a)return;const[x,z]=DSLOT[i];const g=new THREE.Group();
    g.position.set(x,Math.sqrt(42*42-x*x-z*z)-42,z);g.rotation.y=Math.atan2(-x,11-z);
    const t=rarity(a),pc=new THREE.Color(t>=5?'#ffffff':TIERCOL[t]);
    const ped=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.45,0.55,18),MAT.lit);ped.position.y=0.27;ped.updateMatrixWorld();
    paint(ped,(p,n,c,k)=>{if(t>=5)c.setHSL(((Math.atan2(p.z,p.x)/6.283)+1)%1,0.9,0.65);else c.copy(pc);c.multiplyScalar(n.y>0.5?1.05:0.7+0.2*h3(k,1,2,3))});g.add(ped);
    const c=buildCat(a,{display:true});c.scale.setScalar(0.62);c.position.y=0.55;g.add(c);gallery.add(g);displays.push({g,c,ph:i*1.9})})}
function animDisplays(t,dt){displays.forEach(d=>{const r=d.c.userData.rig,T=t+d.ph;r.body.scale.y=1+0.03*Math.sin(T*2);r.head.rotation.y=0.4*Math.sin(T*0.5);r.head.rotation.z=0.06*Math.sin(T*1.1);
  r.tails.forEach(tl=>tl.joints.forEach((j,i)=>{j.rotation.x=j.userData.base+0.1*Math.sin(T*2.2-i*0.55);j.rotation.y=0.3*Math.sin(T*1.7-i*0.5)*(i===0?0.7:0.3)*tl.dir}));
  if(r.arm)r.arm.knee.rotation.x=-0.2-0.6*(0.5+0.5*Math.sin(T*5));animGear(r,T,dt,false,0,0)})}

const panel=document.getElementById('panel'),pbody=document.getElementById('pbody');
const controls={};
function chipGroup(k,list,getT){const wrap=document.createElement('div');wrap.className=k==='fur'||k==='acc'||k==='eye'?'swatches':'chips';
  list.forEach((o,i)=>{const b=document.createElement('button');b.type='button';
    if(wrap.className==='swatches'){b.className='sw t'+o[2];b.style.background=o[0]==='Prism'?'conic-gradient(#ff5fa2,#ffd23f,#3dffb6,#5e8bff,#c77dff,#ff5fa2)':o[1];b.title=o[0]+' · '+OPTR[o[2]];b.setAttribute('aria-label',o[0])}
    else{b.className='chip';b.innerHTML='<i></i>';b.append(o[0]);b.querySelector('i').style.setProperty('--t',o[1]>=5?'#fff':TIERCOL[o[1]]);b.title=OPTR[o[1]];
      const c=optCost(k,i);if(c===null){const sm=document.createElement('small');sm.textContent='pull only';b.appendChild(sm)}else if(c>0){const sm=document.createElement('small');sm.textContent=money(c);b.appendChild(sm)}}
    if(wrap.className==='swatches'){const c=optCost(k,i);if(c>0)b.title+=' · '+money(c)}
    b.onclick=()=>buy(k,i);wrap.appendChild(b)});controls[k]=wrap;return wrap}
function buildPanel(){pbody.innerHTML='<div class="meta" id="pRarity" style="padding-top:10px">—</div>';

    const fade=1-sstep(0.6,1.2,stT);capBot.scale.setScalar(Math.max(0.001,fade));capTop.scale.setScalar(Math.max(0.001,1-sstep(0.8,1.4,stT)));if(stT>1.4)capsule.visible=false}
  if(state==='reveal'&&stT>1.5)state='idle';
  if(state!=='rolling'&&state!=='waiting'&&state!=='opening'&&cat)animCat(t,dt);
  else if(state==='exit'&&cat)animCat(t,dt);
  // tap label position
  if(!tapEl.hidden){tmpV.set(cap.x,cap.y+capR+0.3,0).project(camera);tapEl.style.left=((tmpV.x+1)/2*innerWidth)+'px';tapEl.style.top=((1-tmpV.y)/2*innerHeight)+'px'}
  // world drift
  WORLD.deco.rotation.y=t*0.01;WORLD.floaters.forEach(f=>{f.rotation.x+=dt*f.userData.s;f.rotation.y+=dt*f.userData.s*0.7;f.position.y=f.userData.y+Math.sin(t*f.userData.s+f.userData.ph)*0.4});
  stepParticles(dt);
  camera.position.set(0,2.9,innerWidth/innerHeight<0.8?13:11);camera.lookAt(camTarget);
  renderer.render(scene,camera)}
function resizeSnapReset(){const w=innerWidth,h=innerHeight;SNAP.value.set(Math.round(w*prefs.res)/2.5,Math.round(h*prefs.res)/2.5)}

/* ================= BOOT ================= */
loadGame();buildPanel();renderCaps();applyGame();resize();tick();
if(!narrow())openPanel('lab');
})();
